# Compiles ``markRunningImageAsReproCliForTest`` and
# ``resetRunningImageReproCliMarkForTest`` into ``repro_cli_support``.
#
# In every ordinary build the mark is reachable ONLY from
# ``runThinApp("repro")``: the setter is module-private and the clear does
# not exist at all. That is deliberate in both directions — an image that can
# SET the mark is an image the engine will re-execute with an internal verb
# without it ever having declared itself, and an image that sets it and
# leaves it set is the unbounded self-exec chain the predicate exists to
# prevent. So the only way to drive the predicate through both answers inside
# a single process, and therefore the only way to assert it in both
# directions, is this define, turned on by the one test that needs it.
--define:reproImageIdentityTest
--hints:off
