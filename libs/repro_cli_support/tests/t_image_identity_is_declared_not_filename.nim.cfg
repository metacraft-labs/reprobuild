# Compiles ``resetRunningImageReproCliMarkForTest`` into
# ``repro_cli_support``. The mark is deliberately one-way in every ordinary
# build — an image that can clear it is an image the engine might be willing
# to self-spawn after the clear — so the only way to restore the refusal
# inside a single process, and therefore the only way to assert it in both
# directions, is this define, turned on by the one test that needs it.
--define:reproImageIdentityTest
--hints:off
