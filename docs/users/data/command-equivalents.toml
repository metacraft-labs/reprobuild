  [[tool.row]]
  theirs = "nix profile history"
  repro = "repro home history"

  [[tool.row]]
  theirs = "nix profile rollback"
  repro = "repro home rollback"

  [[tool.row]]
  theirs = "nix search"
  repro = ""
  note = "No package search."

  [[tool.row]]
  theirs = "nix repl, nix eval"
  repro = ""
  note = "No evaluation console."

