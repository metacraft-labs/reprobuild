# Source for reference/command-equivalents.md.
#
# One [[tool]] table per family of tools, one [[tool.row]] per command. The
# generator renders the page from this file; the check parses every `repro`
# value against the CLI model and fails on a command repro does not have.
# A row whose `repro` is empty states that reprobuild has no equivalent; its
# `note` says so in the reader's terms.
#
# Measured against the repro dispatcher at reprobuild d0469cdda (2026-11-11).

schema = "reprobuild.docs.command-equivalents.v1"

[[tool]]
id = "nix"
title = "Nix"

  [[tool.row]]
  theirs = "nix build"
  repro = "repro build"

  [[tool.row]]
  theirs = "nix develop"
  repro = "repro shell"

  [[tool.row]]
  theirs = "nix develop --command <command>"
  repro = "repro exec -- <command>"

  [[tool.row]]
  theirs = "nix run"
  repro = "repro run <task>"
  note = "Runs a task the project declares, not a package from a registry."

  [[tool.row]]
  theirs = "nix why-depends"
  repro = "repro why <package-or-action>"

  [[tool.row]]
