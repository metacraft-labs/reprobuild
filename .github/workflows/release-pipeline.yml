name: Release pipeline

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE HOLDS THE RELEASE'S JOBS; release.yml TRIGGERS THEM.
#
# release.yml subscribes to `v*` tags and `workflow_dispatch` and calls this
# file, either at the run's own ref (`./.github/workflows/release-pipeline.yml`)
# or, when the repository variable RELEASE_LANE is `admitted` and the run is
# for a tag, at the fixed ref `@agents`. The split exists for the reserved
# release lane in metacraft-labs/infra (lib/infra-constants.nix `releaseLane`,
# docs/CI-Runner-Fleet-Status.md §1.2):
#
#   * The lane is a runner group restricted to selected workflows. GitHub
#     admits a job by the file that DEFINES it and the ref that file was
#     loaded from, `OWNER/REPO/.github/workflows/FILE@REF`, exact, with no
#     wildcards. A tag-triggered run loads release.yml at `refs/tags/vX.Y.Z`,
#     which no list can enumerate; this file loaded at `refs/heads/agents` is
#     one fixed entry.
#   * The lane's pool advertises the same labels as general Linux capacity, so
#     `plan`, `build-addon-static` and `publish-nix-cache` keep
#     `runs-on: [self-hosted, linux, x64]`. Admitted, they may take the lane's
#     warm runner OR a general one; not admitted, they behave as before. A
#     routing mistake therefore queues nothing forever.
#
# ONLY THE DEFINITION COMES FROM THE FIXED REF. A called workflow sees the
# CALLER's `github` context, so `github.ref`/`github.sha` stay the tag's and
# every `actions/checkout` below checks out the tag's source, as before. And
# `plan` refuses to start a release whose loaded copy of this file differs from
# the tag's copy (step "Assert this pipeline is the tag's own"), so a release
# runs the pipeline its tag declares, byte for byte, or does not run.
#
# THE GUARD on `plan` and `publish-release`, the two jobs that can start
# without `plan` (`publish-release` runs under `always()`); the rest need
# `plan` and are skipped with it.
# Anything in the organisation can CALL a reusable workflow at `@agents`,
# including a pull request from a fork that adds such a call to its own
# workflow, and the jobs it reaches are admitted to the lane because they are
# defined here. The guard reads the caller's context, which a caller cannot
# forge, and runs the jobs only for metacraft-labs/reprobuild's own release.yml
# on a `v*` tag push or a `workflow_dispatch` (both need write access). Keep it
# on every job that can start without `plan`, and keep this file `on: workflow_call`
# only: a push trigger here would make every push to `agents` an admitted run.
# scripts/check_workflows.sh asserts both.
on:
  workflow_call:
    inputs:
      # A PROVING RUN, never a release. Empty (every tag push, and the
      # default dispatch) builds every row of `platforms` in
      # .github/release-platforms.json, as before. A list of `<platform>-<arch>`
      # names (comma- or space-separated) builds only those legs, and may name
      # a row of `candidates`: a leg that is not part of the release yet and
      # must first build green through THIS job, on its own runner, before it
      # is moved into `platforms` ("Prove, then gate"). `plan` refuses a
      # filter on a tag ref, so a filtered run can never reach the publish
      # job's asset assertion with a partial set.
      platforms:
        type: string
        required: false
        default: ""

# ─────────────────────────────────────────────────────────────────────────────
# Release shape: build everything, THEN publish once, atomically.
#
# History this structure exists to prevent. Every release to date shipped a
# different subset of platforms, and no release ever carried all of them:
#
#   v0.1.0  darwin-aarch64 + linux-x86_64   (no windows)
#   v0.1.1  draft, holding a stray v0.1.0 linux tarball
#   v0.1.2  windows-x86_64 only -- and that asset was uploaded BY HAND
#           (uploader=zah, 8 days after the tag); CI published nothing at all
#   v0.1.3  linux-x86_64 only  <- and this one is tagged "Latest"
#
# The cause was structural, not incidental: each matrix leg carried its own
# `softprops/action-gh-release` step, and `fail-fast: false` let the green legs
# publish while the red ones simply did not. A partially-published release is
# strictly worse than no release -- consumers on the missing platforms get a
# confident-looking "Latest" whose asset 404s.
#
# So, now:
#
#   plan     -- reads .github/release-platforms.json, the ONE declaration of
#               which platforms a release contains, and derives both the build
#               matrix and the exact asset list the release must carry.
#   build    -- per-platform build/package/verify. Publishes NOTHING. Emits a
#               workflow artifact and a checksum.
#   cache    -- `publish-nix-cache` builds the revision's Nix package and
#               pushes it to the organisation's Attic cache. A convenience for
#               consumers, not an asset: `publish` does NOT wait for it, and a
#               failed push is re-run on its own.
#   publish  -- runs only for tags, gated on EVERY leg succeeding, asserts the
#               full asset set is present, then creates the release as a DRAFT,
#               uploads everything, re-verifies against the API, and only then
#               flips it visible.
#
# Two independent guarantees, because a gate alone is not enough:
#   1. No leg can publish on its own -- only `publish` touches the release.
#   2. Even `publish` cannot half-finish visibly -- the release stays a draft
#      until every expected asset is confirmed present on it. A dropped upload
#      or a mid-flight network failure leaves an invisible draft, not a broken
#      "Latest".
#
# Note on `workflow_dispatch` (release.yml's trigger, inherited here through the
# caller's context): it is a dry run ONLY when dispatched against a
# branch. `publish` is gated on `startsWith(github.ref, 'refs/tags/')`, and a
# dispatch can be aimed at a tag ref -- in which case github.ref IS
# `refs/tags/vX.Y.Z` and the publish job runs and publishes for real. Dispatch
# from a branch (the normal case: every dispatch run to date was against `dev`)
# builds and publishes nothing, which is what made the 2026-08-01 dispatch run
# show green macOS and Linux legs yet add nothing to any release.
#
# A branch dispatch may also name legs (the `platforms` input), to prove one
# without building the rest, including a `candidates` row of
# .github/release-platforms.json that is not part of the release yet. That is
# how a new platform goes green through THIS job before it is allowed to gate
# a release. `plan` refuses the input on a tag.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  plan:
    name: Plan release
    # The release-lane guard; see the header. The expression reads the
    # CALLER's context, so it holds whichever ref this file was loaded from.
    if: >-
      github.repository == 'metacraft-labs/reprobuild' &&
      startsWith(github.workflow_ref, 'metacraft-labs/reprobuild/.github/workflows/release.yml@') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    permissions:
      contents: read
      # `actions: read` lets the pipeline-identity step read this run's
      # `referenced_workflows`.
      actions: read
    # Planning only reads source metadata with Node. `[self-hosted, linux, x64]`
    # rather than the `eph-linux-x64-release` scale set, so another product's
    # heavy Linux release cannot gate the Windows/macOS fan-out. On the
    # reserved lane (RELEASE_LANE=admitted) these labels also reach the lane's
    # warm runner, which is what keeps `plan` from queueing behind general CI.
    # The heavy Linux build and final publisher keep the scale set.
    runs-on: [self-hosted, linux, x64]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      expected-assets: ${{ steps.plan.outputs.expected-assets }}
      packages: ${{ steps.plan.outputs.packages }}
      # The `build-addon-static` job's runner (JSON: a label or a label array;
      # `addon_static.runner`) and dev-env flavour (the `addon_static.from`
      # platform's). Empty when .github/release-platforms.json declares no add-on.
      addon-runner: ${{ steps.plan.outputs.addon-runner }}
      addon-env-flavor: ${{ steps.plan.outputs.addon-env-flavor }}
      # `addon_static.arches`, space-separated: what the job builds, and what
      # the expected asset set above already names.
      addon-arches: ${{ steps.plan.outputs.addon-arches }}
      # `true` unless the run was given a `platforms` filter (a proving run).
      # Jobs that only make sense for a whole release -- the Nix cache push --
      # are skipped when it is `false`.
      full-release: ${{ steps.plan.outputs.full-release }}
    steps:
      - uses: actions/checkout@v4

      # When release.yml calls this file at `@agents` (the reserved lane), the
      # jobs below are DEFINED by agents' copy while the checkout above is the
      # tag. Refuse unless the two copies are the same bytes. The loaded
      # revision is the run's `referenced_workflows` entry for this file; the
      # tag's copy is the checked-out one, hashed as a git blob so it compares
      # with the blob id the contents API returns. For a run that called this
      # file at its own ref the two are trivially equal.
      #
      # `referenced_workflows` lists BOTH of release.yml's copies on every run,
      # because GitHub resolves each `uses:` when it creates the run, the
      # skipped job's included (v0.2.32, run 44995307653, failed on exactly
      # that). So pick the entry the running caller job loaded, by repeating
      # release.yml's `lane` condition: `refs/heads/agents` when it holds,
      # otherwise the entry at the run's own commit. If agents and the tag
      # name one commit, two entries can share a revision; that is still one
      # copy. Two candidate revisions, or none, is refused.
      # tests/unit/test_release_pipeline_identity.py runs this script and
      # fails if release.yml's `lane` condition changes without it.
      #
      # Re-running FAILED jobs reuses the first attempt's revision of this file
      # (GitHub docs, "Reusing workflow configurations"), so the answer given
      # here still holds for them; "Re-run all jobs" re-resolves `@agents` and
      # re-runs this step.
      - name: Assert this pipeline is the tag's own
        uses: actions/github-script@v7
        env:
          RELEASE_LANE: ${{ vars.RELEASE_LANE }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const file = '.github/workflows/release-pipeline.yml';
            const { owner, repo } = context.repo;
            const prefix = `${owner}/${repo}/${file}@`;
            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            const referenced = (run.data.referenced_workflows || []).filter(w => w.path.startsWith(prefix));
            // release.yml's `lane` condition, evaluated on the caller's context.
            const lane = process.env.RELEASE_LANE === 'admitted' &&
              (context.ref || '').startsWith('refs/tags/v');
            const caller = lane ? 'lane (@agents)' : `general (the run's own commit ${context.sha})`;
            const loaded = lane
              ? referenced.filter(w => w.ref === 'refs/heads/agents')
              : referenced.filter(w => w.sha === context.sha);
            const revisions = [...new Set(loaded.map(w => w.sha))];
            if (revisions.length !== 1) {
              core.setFailed(`expected exactly one revision of ${prefix}* loaded by release.yml's ` +
                `${caller} job, found ${revisions.length}: ` +
                JSON.stringify(run.data.referenced_workflows || []));
              return;
            }
            const sha = revisions[0];
            const ref = loaded.map(w => w.ref).filter(Boolean).join(', ');
            const remote = await github.rest.repos.getContent({ owner, repo, path: file, ref: sha });
            const local = fs.readFileSync(file);
            const blob = crypto.createHash('sha1')
              .update(`blob ${local.length}\0`).update(local).digest('hex');
            core.info(`pipeline loaded from ${ref || '(no ref)'} at ${sha}: blob ${remote.data.sha}`);
            core.info(`pipeline at the checked-out ${context.ref} (${context.sha}): blob ${blob}`);
            if (remote.data.sha !== blob) {
              core.setFailed(
                `this run's jobs come from ${file} at ${ref} (${sha}), which differs from the copy at ` +
                `${context.ref}. A release must run the pipeline its tag declares. Either release from a ` +
                `commit whose ${file} matches agents' current one, or run the tag's own pipeline on ` +
                `general capacity: delete the RELEASE_LANE repository variable and dispatch release.yml ` +
                `on the tag (gh workflow run release.yml --ref <tag>), then restore the variable.`);
              return;
            }

      # `actions/github-script` rather than jq/python: this job runs on a bare
      # runner before any dev-env provisioning, and the GARM Debian/macOS/Windows
      # images cannot be assumed to carry either. A JS action runs wherever the
      # Actions runner itself runs.
      - name: Derive matrix and expected asset set
        id: plan
        uses: actions/github-script@v7
        env:
          PLATFORM_FILTER: ${{ inputs.platforms }}
          # Whether the production signing credentials of the signed installers
          # are configured (repository secrets; docs/release-signing.md,
          # "Installer signing"). Only the presence is read, never a value.
          PKG_SIGNING_CONFIGURED: ${{ secrets.REPRO_PKG_SIGNING_P12_BASE64 != '' && secrets.REPRO_PKG_SIGNING_P12_PASSWORD != '' && secrets.REPRO_NOTARY_API_KEY_P8 != '' && secrets.REPRO_NOTARY_API_KEY_ID != '' && secrets.REPRO_NOTARY_API_ISSUER_ID != '' }}
          MSI_SIGNING_CONFIGURED: ${{ secrets.REPRO_AUTHENTICODE_PFX_BASE64 != '' && secrets.REPRO_AUTHENTICODE_PFX_PASSWORD != '' }}
        with:
          script: |
            const fs = require('fs');

            const spec = JSON.parse(fs.readFileSync('.github/release-platforms.json', 'utf8'));
            const released = spec.platforms;
            if (!Array.isArray(released) || released.length === 0) {
              core.setFailed('.github/release-platforms.json declares no platforms; a release with no platforms is not a release.');
              return;
            }
            const legName = p => `${p.platform}-${p.arch}`;

            // The proving-run filter (the `platforms` input). Without one the
            // matrix is exactly `platforms`, and `candidates` are never built.
            // With one, the matrix is exactly the named legs, which may be
            // candidates; it is refused on a tag, where the publish job would
            // otherwise compare a partial build against a partial asset list
            // and could publish a release missing a promised platform.
            const filter = (process.env.PLATFORM_FILTER || '').split(/[\s,]+/).filter(Boolean);
            let platforms = released;
            if (filter.length) {
              if ((context.ref || '').startsWith('refs/tags/')) {
                core.setFailed(
                  `a platform filter (${filter.join(', ')}) was given for ${context.ref}. A tag builds and ` +
                  `publishes every platform in .github/release-platforms.json or nothing; filter only a ` +
                  `dispatch from a branch, which publishes nothing.`);
                return;
              }
              const known = [...released, ...(spec.candidates || [])];
              const unknown = filter.filter(n => !known.some(p => legName(p) === n));
              if (unknown.length) {
                core.setFailed(
                  `unknown platform(s) ${unknown.join(', ')}; .github/release-platforms.json declares ` +
                  `${known.map(legName).join(', ')}`);
                return;
              }
              platforms = known.filter(p => filter.includes(legName(p)));
              core.info(`proving run: building only ${platforms.map(legName).join(', ')}; nothing is published`);
            }
            core.setOutput('full-release', filter.length ? 'false' : 'true');

            const nimble = fs.readFileSync('reprobuild.nimble', 'utf8');
            const m = nimble.match(/^\s*version\s*=\s*"([^"]+)"/m);
            if (!m) {
              core.setFailed('could not read `version` from reprobuild.nimble');
              return;
            }
            const version = m[1];

            // The tag and the nimble version MUST agree. Asset names embed the
            // nimble version while the download URL embeds the tag, so if they
            // drift the published asset is unreachable at the URL every
            // consumer constructs -- including setup-reprobuild's installer,
            // which derives the asset name from the tag. Catch it here, before
            // spending an hour of build time on an unusable release.
            const ref = context.ref || '';
            if (ref.startsWith('refs/tags/')) {
              const tag = ref.slice('refs/tags/'.length);
              if (tag !== `v${version}`) {
                core.setFailed(
                  `tag ${tag} does not match reprobuild.nimble version ${version} (expected tag v${version}). ` +
                  `Asset names embed the nimble version and the download path embeds the tag, so these must agree.`);
                return;
              }
            }

            const assets = platforms.map(p =>
              `reprobuild-${version}-${p.platform}-${p.arch}.${p['archive_ext']}`);

            // Native packages are built in the publish job from one of the
            // archives above, and are then ordinary members of the asset set.
            const archiveOf = Object.fromEntries(platforms.map(p =>
              [`${p.platform}-${p.arch}`, `reprobuild-${version}-${p.platform}-${p.arch}.${p['archive_ext']}`]));
            // Validated against the RELEASED platforms on every run, so a
            // proving run still catches a declaration error; built only when
            // the platform they come from is in this run's matrix.
            const isReleased = n => released.some(p => legName(p) === n);
            // The signed installers (.pkg: Developer ID Installer + notarization;
            // .msi: Authenticode) may be listed only while their PRODUCTION
            // credentials are configured: without them the leg signs with a
            // stand-in certificate, and a stand-in-signed asset is never part of
            // a release. Refused on every run, so listing one too early fails
            // the dispatch that would prove it, not the first tag.
            const SIGNED = {
              pkg: { configured: process.env.PKG_SIGNING_CONFIGURED === 'true',
                     secrets: 'REPRO_PKG_SIGNING_P12_BASE64, REPRO_PKG_SIGNING_P12_PASSWORD, ' +
                              'REPRO_NOTARY_API_KEY_P8, REPRO_NOTARY_API_KEY_ID, REPRO_NOTARY_API_ISSUER_ID' },
              msi: { configured: process.env.MSI_SIGNING_CONFIGURED === 'true',
                     secrets: 'REPRO_AUTHENTICODE_PFX_BASE64, REPRO_AUTHENTICODE_PFX_PASSWORD' },
            };
            for (const p of spec.packages || []) {
              const signed = SIGNED[p.ecosystem];
              if (signed && !signed.configured) {
                core.setFailed(
                  `.github/release-platforms.json lists ${p.asset.replaceAll('{version}', version)} (${p.ecosystem}), but its production signing ` +
                  `credentials are not configured (${signed.secrets}); its leg would sign it with a stand-in ` +
                  `certificate, and a stand-in-signed asset never joins a release. Configure the secrets, or ` +
                  `remove the entry.`);
                return;
              }
            }
            const packages = (spec.packages || []).map(p => {
              if (!isReleased(p.from)) {
                throw new Error(`package ${p.asset} is built from '${p.from}', which is not a platform in this release`);
              }
              return { ecosystem: p.ecosystem, archive: archiveOf[p.from],
                       asset: p.asset.replaceAll('{version}', version) };
            }).filter(p => p.archive);
            assets.push(...packages.map(p => p.asset));

            // The static add-on binaries, built by their own job
            // (`build-addon-static`) in the dev environment of the `from`
            // platform, on `addon_static.runner` (that platform's runner when
            // absent).
            const addon = spec.addon_static;
            if (addon) {
              if (!isReleased(addon.from)) {
                throw new Error(`addon_static is built on '${addon.from}', which is not a platform in this release`);
              }
              const host = platforms.find(p => legName(p) === addon.from);
              if (host) {
                for (const a of addon.arches) {
                  assets.push(addon.asset.replaceAll('{version}', version).replaceAll('{arch}', a));
                }
                core.setOutput('addon-runner', JSON.stringify(addon.runner ?? host.runner));
                core.setOutput('addon-env-flavor', host['env-flavor']);
                core.setOutput('addon-arches', addon.arches.join(' '));
              }
            }

            const dupes = assets.filter((a, i) => assets.indexOf(a) !== i);
            if (dupes.length) {
              core.setFailed(`.github/release-platforms.json yields duplicate asset names: ${[...new Set(dupes)].join(', ')}`);
              return;
            }

            core.info(`release ${version} will consist of exactly ${assets.length} assets:`);
            for (const a of assets) core.info(`  - ${a}`);

            // `native-packages`: whether a declared package is built from
            // this leg's archive. The leg's package steps run only then, so a
            // Linux leg no package names (linux-aarch64) neither builds nor
            // claims to have checked one, while a leg that does name one still
            // fails if none was checked.
            // `signed-installer`: the signed .pkg/.msi asset listed for this leg,
            // or ''. The leg's installer steps run on a proving run (no tag) to
            // prove the leg, and on a tag only for a listed installer; the
            // .deb/.rpm steps ignore the signed ecosystems.
            const ofLeg = (p, k) => k.archive === archiveOf[legName(p)];
            core.setOutput('matrix', JSON.stringify(platforms.map(p => ({
              ...p,
              'native-packages': packages.some(k => ofLeg(p, k) && !SIGNED[k.ecosystem]),
              'signed-installer': (packages.find(k => ofLeg(p, k) && SIGNED[k.ecosystem]) || {}).asset || '',
            }))));
            core.setOutput('version', version);
            core.setOutput('expected-assets', assets.join('\n'));
            // One `ecosystem archive asset` line per package: the publish job
            // reads it with `read`, so it needs no JSON tool on the runner.
            core.setOutput('packages', packages.map(p => `${p.ecosystem} ${p.archive} ${p.asset}`).join('\n'));

  build-release:
    name: ${{ matrix.os-name }} (${{ matrix.arch }}) Release Build
    needs: plan
    runs-on: ${{ matrix.runner }}
    # Without a job-level cap GitHub applies its default of 360 minutes
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes),
    # and the Linux leg's normal duration sits at that default: 5 h 25 m for
    # v0.2.12 (run 39049060492), and v0.2.15 (run 39813513564, attempt 1)
    # was cancelled at 6 h 0 m in its archive smoke after every build step had
    # passed. The release runners are self-hosted, where a job may run for up
    # to five days, so the cap is set here with headroom over the slowest
    # measured leg. v0.2.24 (run 43218423379) ran its Linux leg 9 h 0 m: every
    # build and verify step passed, then the cap cancelled the artifact upload
    # at 540 minutes, so the release did not publish. The cap is 900 now. The
    # steps that can wedge keep their own tighter caps (Windows build 240,
    # each archive verify 60).
    timeout-minutes: 900
    env:
      # Per-edge lines instead of a repainting bar, on every leg.
      #
      # The default (`bar-line`) redraws one status line in place. A terminal
      # collapses those repaints; a CI log keeps every one of them, and the bar
      # ELIDES the very thing a stuck build needs to name -- it renders the
      # running action's path truncated to terminal width
      # ("C:\actions-runner\_work\re...").
      #
      # Measured on the windows leg of run 33641812258: the log was 55k lines,
      # 50k of them bar repaints, and every single one reported the same
      # "checked=10/20 running=2" with both running actions unnameable. The leg
      # then hit the 240-minute cap. From that log it is impossible to say WHICH
      # two actions were outstanding, or whether they were slow or wedged.
      #
      # `simple-lines` writes "Starting: <command>" and "Finished: <command> in
      # <duration> [SUCCESS|FAILED]", flushed, one line per transition. That
      # names every action in full and times it, which turns "the leg timed out"
      # into "this action took N minutes" or "this action never finished".
      REPROBUILD_PROGRESS: simple-lines
      # The commit the release images are built from (the checkout below is
      # `github.sha`), embedded as `ReprobuildSourceRevision` so a shipped
      # `repro` can name its source revision (e.g. in `repro home export`
      # provenance). The `.#release` engine edge takes it from the
      # `reprobuild.apps.source-revision` probe, which runs
      # scripts/source_revision.sh when the ACTION runs and so inherits this
      # job-level variable, which wins over the checkout's own git answer.
      REPROBUILD_SOURCE_REVISION: ${{ github.sha }}
    strategy:
      # fail-fast stays false so ONE broken leg still lets the others report.
      # That is a diagnostics choice only -- it no longer affects what gets
      # published, because publishing is gated on the aggregate result below.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # ── Persistent runners: let checkout clean the previous run's tree ────
      #
      # The macOS legs run on persistent hosts (m3-mcl-*), where the work
      # directory survives between jobs. A release run extracts the built
      # archive to verify it, and that tree carries read-only entries; until
      # verify_release.sh made its trees writable before removing them, a run
      # that stopped early left one behind. actions/checkout's workspace clean
      # then fails on it before any step of ours runs (v0.2.7 run 37906066406:
      # "EACCES: permission denied, unlink .../reprobuild-0.2.2-darwin-aarch64/
      # lib/python3.13/EXTERNALLY-MANAGED"), and every later job on that host
      # fails the same way. Making the old tree owner-writable is all checkout
      # needs; ephemeral runners start empty, so the step is limited to macOS.
      - name: Make the previous workspace removable (persistent macOS runners)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true
          fi

      - uses: actions/checkout@v4

      # ── Windows: fail fast, and legibly, if the image has no Git ───────────
      #
      # Git for Windows supplies bash.exe. Without it this workflow dies with
      # `##[error]bash: command not found` inside the FIRST step of
      # setup-dev-env (its `shell: bash` env-flavor check), and actions/checkout
      # above silently degrades to the REST-API tarball, logging "add Git 2.18
      # or higher to the PATH" and leaving no .git behind.
      #
      # This step is an ASSERTION, not a workaround. An earlier version tried to
      # rescue an installed-but-unexported Git by searching the usual install
      # roots and appending them to GITHUB_PATH. That was written before the
      # cause was known; the Windows runner image simply had no Git installed at
      # all, so the rescue path could never have fired. Keeping it would have
      # been worse than useless: it would let a half-provisioned image pass CI
      # and hide the image defect from whoever has to fix it.
      #
      # So we assert instead. A correctly built runner image has Git on the
      # MACHINE PATH (services capture their environment from the machine
      # environment at service start, so a user-scoped PATH never reaches the
      # runner service) and this step is a no-op costing one second. A bad image
      # fails here, named, instead of anonymously five steps later.
      - name: Assert Git for Windows is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bash = Get-Command bash -ErrorAction SilentlyContinue
          $git = Get-Command git -ErrorAction SilentlyContinue

          if ($bash -and $git) {
            Write-Host "bash: $($bash.Source)"
            Write-Host "git:  $($git.Source)"
            & git --version
            exit 0
          }

          $missing = @()
          if (-not $bash) { $missing += 'bash' }
          if (-not $git) { $missing += 'git' }

          # Built by joining an array rather than with a here-string: a
          # PowerShell here-string terminator must sit flush against the left
          # margin, which would break out of this YAML block scalar.
          throw (@(
            "Missing on this Windows runner: $($missing -join ', ')",
            "",
            "Git for Windows provides both. Without it every 'shell: bash' step in this",
            "workflow -- including the first step of setup-dev-env -- fails with",
            "'bash: command not found', and actions/checkout cannot create a real",
            "repository.",
            "",
            "This is a defect in the Windows runner image, not in this repository, and it",
            "cannot be worked around from a workflow: the runner runs as a service, and a",
            "service's environment is captured from the MACHINE environment when the",
            "service starts.",
            "",
            "Fix it in the image: install Git for Windows and add its 'bin' directory to",
            "the machine PATH before the image is captured."
          ) -join [Environment]::NewLine)

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the setup-dev-env / clone-siblings actions can clone private
      # metacraft-labs repos (codetracer, runquota, etc.).
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # Setup dev environment using the shared composite workflow.
      # Automatically clones all sibling repos defined in .github/sibling-repos.
      - name: Setup dev environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: ${{ matrix.env-flavor }}
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          flake-override-inputs: |
            runquota-src=../runquota
            io-mon-src=../io-mon
            nim-shm-queue-src=../nim-shm-queue
            nim-cli-spec-src=../nim-cli-spec
            nim-entrypoints-src=../nim-entrypoints
            nim-confutils-src=../nim-confutils
            nim-stackable-hooks-src=../nim-stackable-hooks
            reprobuild-test-adapters-src=../reprobuild-test-adapters
            test-certificates-tools-src=../test-certificates-tools

      # Clone status-im/nim-bearssl manually on Windows (since it belongs to a
      # foreign organization and is not resolvable by metacraft-labs clone-siblings).
      - name: Clone nim-bearssl (Windows)
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          if (Test-Path -Path ../nim-bearssl) { Remove-Item -Recurse -Force ../nim-bearssl }
          git clone --depth 1 --recurse-submodules https://github.com/status-im/nim-bearssl.git ../nim-bearssl

      # Enable the repro binary-cache publish for THIS per-platform build so its
      # `repro build` outputs land in the fleet cache (repro-cache.metacraft-labs.com),
      # giving Windows/macOS/ARM machines cache hits when provisioning from source.
      # The composite action writes the signing key/cert to $RUNNER_TEMP and exports
      # the REPRO_BINARY_CACHE_* env vars picked up by the build steps below; it is a
      # no-op when the secrets are empty (fork PRs) and publish failures are non-fatal
      # (see .github/actions/setup-repro-publish). It selects bash vs pwsh by
      # runner.os, so it covers every matrix leg -- including any leg added later to
      # .github/release-platforms.json, which needs no change here.
      - name: Configure repro binary-cache publish
        uses: ./.github/actions/setup-repro-publish
        with:
          publish-key: ${{ secrets.REPRO_PUBLISH_KEY }}
          publish-cert: ${{ secrets.REPRO_PUBLISH_CERT }}

      # Build all release applications and monitor shims using repro.nim/repro.lock.
      # The build inherits REPRO_BINARY_CACHE_* from $GITHUB_ENV (set by the step
      # above) so reprobuild's engine publisher signs and POSTs the outputs.
      # `.#release` (B5) replaced `.#reprobuild.build_apps`. That wrapper ran the
      # whole build inside ONE shell() action, which takes the automatic-monitor
      # policy, so every nim compile and clang link executed as a child under the
      # io-mon shim -- where, on macOS, children die producing no output. (That is
      # precisely how the v0.1.3 macOS leg died: `repro build: action failed:
      # reprobuild.build_apps (exit code 2)` / `unsupported platform for the
      # io-mon shim`.) The `release` collection is per-artifact `nim.c` /
      # `fs.copyFile` edges, which are depfile-policied and unmonitored, and it
      # covers both `build/bin` and the `build/lib` libraries the tarball packages.
      #
      # `just bootstrap` still runs scripts/build_apps.sh directly -- unmonitored,
      # and the only way to get an engine binary in the first place.
      - name: Bootstrap (POSIX)
        if: matrix.os-name != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dev-exec just bootstrap
          # refresh-build-auth (next step) rewrites Nix's credentials with a
          # Python helper, and runs outside the dev shell. The persistent macOS
          # runners have no python3 on their own PATH (v0.2.9 run 37958588616:
          # "python3: command not found", exit 127); hand it the dev shell's.
          py=$(dev-exec bash -c 'command -v python3' | tail -n 1)
          echo "REPROBUILD_BOOTSTRAP_PYTHON=${py}" >> "$GITHUB_ENV"

      # The installation token minted at the top of the job lives one hour
      # (https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-an-installation-access-token-for-a-github-app).
      # The Linux bootstrap alone takes over two hours on the release lane, and
      # the build below then fetches the pinned nixpkgs through Nix with that
      # token: v0.2.8 run 37941621127 failed there with "unable to download
      # 'https://api.github.com/repos/NixOS/nixpkgs/tarball/...': HTTP error
      # 401". Re-mint it, and re-point Git's and Nix's job-scoped credentials
      # at the new one, between the two phases.
      - name: Refresh build authentication (POSIX)
        if: matrix.os-name != 'windows'
        uses: metacraft-labs/metacraft-github-actions/refresh-build-auth@dev
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Build (POSIX)
        if: matrix.os-name != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dev-exec ./build/bin/repro build --tool-provisioning=path --daemon=off --no-runquota .#release

      # The Nix package of this revision is published to the organisation
      # cache by the `publish-nix-cache` job, not by this leg: that push needs
      # nothing this leg builds, and a failure in it must not cost the leg
      # (see that job).

      - name: Bootstrap and Build (Windows)
        if: matrix.os-name == 'windows'
        # Fail-fast guard. The `.#release` build's interface-extraction phase
        # (a single `nim c` of the full DSL-stdlib closure) has hung for 4+
        # HOURS on Windows -- nim.exe wedged on the large compile, holding a
        # runner slot indefinitely. A healthy Windows leg (app build + extract
        # + package + verify) completes well inside an hour, so cap the step:
        # a wedged extract now fails in bounded time with the runner's timeout
        # annotation instead of blocking the pool for hours. Remove/raise once
        # the Windows interface-extract hang is root-caused and fixed (it is
        # release-only and has no CI coverage today -- see ci.yml).
        # The Windows runner is slow and cache-less (windows-diy recompiles the
        # whole tree from scratch): app build 43-65 min + interface-extract ~13
        # min + the `.#release` build of 20 artifacts ~61 min (the repro app
        # alone is 435k lines of C / 1.9 GiB / 12 min) ≈ 115-140 min. A 120-min
        # cap guillotined the LAST still-compiling artifact (reprobuild.apps.repro)
        # at exactly 120 min -- a killed process with empty stderr, not a real
        # failure. The phases PROGRESS (proven: extract completes in 13 min, the
        # earlier "hang" was that too-tight cap), they are just slow, so give the
        # whole leg room to finish. The interface-extract has its own inner
        # watchdog (runCommand kills a `nim c` whose output stops for
        # REPRO_INTERFACE_COMPILE_STALL_SECONDS, default 15 min) to catch a
        # genuine extract wedge fast, so this outer cap need not be tight.
        timeout-minutes: 240
        env:
          # No fixed total on the interface `nim c`: runCommand's default
          # watchdog kills it when its output stops (a wedge), not when it is
          # merely slow, and dumps the partial sink. LIST_CMD keeps nim echoing
          # each gcc sub-command, so the watchdog sees steady progress and the
          # LAST line of a dump names the sub-command that wedged. Retained as
          # a durable guard, not just debug scaffolding.
          REPRO_INTERFACE_LIST_CMD: "1"
          # Cap the `.#release` engine's action parallelism on this leg.
          #
          # `repro build` defaults to 8-wide (buildMaxParallelism()). On the
          # ephemeral Linux/macOS runners that fits; on the memory-constrained
          # windows-diy runner it does not. The engine scheduled all eight heavy
          # `nim c` edges at once, and `nim.exe`'s codegen alone peaks at ~1.9 GiB
          # for the repro app (435k lines of C) -- eight such peaks plus their gcc
          # children exhaust the box. The largest edge, `reprobuild.apps.repro`,
          # lost the memory race: its gcc/cc1 died mid-compile, `nim` reported the
          # failure on STDOUT (where nim writes compiler diagnostics), and the edge
          # exited 1. It ran ~60 min under contention before failing, versus the
          # 15 min the SAME compile takes when `just bootstrap` builds it SERIALLY
          # (which is exactly why bootstrap succeeds and `.#release` did not).
          #
          # Two is the balance point: it keeps peak RAM to ~2 concurrent nim
          # codegens (~4 GiB) so nothing OOMs, while still overlapping the long
          # tail of small edges so the leg finishes comfortably inside the 240-min
          # cap. Raise once the windows-diy image carries more RAM headroom.
          REPROBUILD_MAX_PARALLELISM: "2"
        shell: pwsh
        run: |
          # env.ps1 from setup-dev-env is already sourced in GITHUB_ENV/PATH.
          # That is what provisions the pinned conda-forge clingo via
          # windows/ensure-clingo.ps1 and exports REPRO_WINDOWS_CLINGO_DIR,
          # which build_apps.sh stages into build/bin. Before that provisioner
          # existed, clingo.dll was picked up only if the runner happened to
          # carry a hand-provisioned C:\clingo on its machine PATH.

          # Raise nim.exe's OWN stack BEFORE any nim compile. The `.#release`
          # interface-extract compiles the entire DSL-stdlib closure in a single
          # nim.exe whose deep sem/macro recursion overruns nim's linker-default
          # ~1 MB stack, crashing the COMPILER with STATUS_STACK_BUFFER_OVERRUN
          # (0xC0000409 / exit -1073740791) -- confirmed as nim.exe's own exit
          # code. This patches nim.exe's PE SizeOfStackReserve to 128 MB (exactly
          # what `editbin /STACK` writes, but MSVC/editbin is absent on
          # windows-diy: `vswhere.exe not found`). Idempotent; covers both
          # `just bootstrap` and the `.#release` extract below.
          & ./windows/raise-nim-stack.ps1

          # Provision `just`: the reprobuild dev-env summary reports
          # `just = (not on PATH)` on the windows-diy runners (the cold-start
          # bootstrap provisions nim/gcc but not just here), yet both builds below
          # invoke it. Fetch the single static just.exe and put it on PATH. Pinned
          # to the version the windows dev-env docs record.
          if (-not (Get-Command just -ErrorAction SilentlyContinue)) {
            $justVersion = "1.51.0"
            $justRoot = if ($env:WINDOWS_DIY_INSTALL_ROOT) { $env:WINDOWS_DIY_INSTALL_ROOT } else { $env:RUNNER_TEMP }
            $justDir = Join-Path $justRoot "just\$justVersion"
            $justExe = Join-Path $justDir "just.exe"
            if (-not (Test-Path $justExe)) {
              New-Item -ItemType Directory -Force -Path $justDir | Out-Null
              $justZip = Join-Path $env:RUNNER_TEMP "just.zip"
              # The leg's own architecture: an aarch64 just.exe on windows-aarch64,
              # where an x64 one would run under emulation (reprobuild-pm
              # Distribution-And-Packaging.md §7.1).
              $justTriple = if ('${{ matrix.arch }}' -eq 'aarch64') { 'aarch64-pc-windows-msvc' } else { 'x86_64-pc-windows-msvc' }
              $justUrl = "https://github.com/casey/just/releases/download/$justVersion/just-$justVersion-$justTriple.zip"
              Write-Host "Provisioning just $justVersion from $justUrl"
              Invoke-WebRequest -Uri $justUrl -OutFile $justZip
              Expand-Archive -Path $justZip -DestinationPath $justDir -Force
            }
            if (-not (Test-Path $justExe)) { throw "failed to provision just.exe" }
            $env:Path = $justDir + [IO.Path]::PathSeparator + $env:Path
            Add-Content -Path $env:GITHUB_PATH -Value $justDir
            Write-Host "just provisioned at $justExe"
          }

          Push-Location ../runquota
          just build
          Pop-Location
          $runquotaRoot = (Resolve-Path ../runquota).Path
          $runquotaBin = Join-Path $runquotaRoot "build\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $runquotaBin
          $env:Path = $runquotaBin + [IO.Path]::PathSeparator + $env:Path

          # `just bootstrap` runs scripts/build_apps.sh to compile the engine and
          # every app entry point. That script stages clingo.dll (fatal if absent
          # -- the dev-env exports REPRO_WINDOWS_CLINGO_DIR) and best-effort stages
          # libzstd/sqlite3/cacert next to the binaries.
          #
          # We deliberately do NOT set REPRO_REQUIRE_WINDOWS_RUNTIME_DLLS=1 for
          # this step. Those runtime-DLL sources are not all present on the PATH
          # the windows-diy runner provisions (no zstd.exe is installed, and the
          # prebuilt Nim does not reliably carry sqlite3_64.dll), so promoting a
          # miss to a hard error would abort bootstrap before the deterministic
          # staging below could supply them. Release self-containment is instead
          # guaranteed by windows/stage-release-dlls.ps1 (explicit, toolchain-
          # source-first with a pinned-download fallback) and independently gated
          # by scripts/verify_release.sh against the packaged archive.
          just bootstrap
          if ($LASTEXITCODE -ne 0) {
            throw "reprobuild bootstrap failed (exit code $LASTEXITCODE)"
          }

          # Put the MSYS coreutils on PATH for the pwsh-side `repro build`.
          # repro's recipe declares `uses: "mkdir"/"cp"/"chmod"/"sh"` (the
          # reprobuild-nix-daemon staging edge shells them) and resolves them from
          # PATH under --tool-provisioning=path. On Windows `mkdir` is a cmd
          # builtin, not an executable -- the coreutils live in Git for Windows'
          # `<git>\usr\bin`. setup-dev-env's env.ps1 puts `<git>\bin` on PATH
          # (bash/sh/git, which is why `sh`/`openssl` already resolve) but NOT
          # `usr\bin`, and build_apps.sh only saw them because it runs under bash.
          # `.#release` runs here in pwsh, so add `usr\bin` -- the whole dir, so
          # every coreutil any edge shells (cp, rm, mv, cat, ...) resolves at
          # once. The path-mode resolver just needs to FIND each declared tool on
          # PATH; it composes each action's own PATH from the resolved dirs.
          $gitExe = (Get-Command git -ErrorAction Stop).Source
          $gitUsrBin = Join-Path (Split-Path -Parent (Split-Path -Parent $gitExe)) "usr\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $gitUsrBin "mkdir.exe"))) {
            throw "coreutils not found at $gitUsrBin (repro path-mode resolution needs mkdir.exe/cp.exe/chmod.exe); is this MinGit rather than full Git for Windows?"
          }
          $env:Path = $gitUsrBin + [IO.Path]::PathSeparator + $env:Path
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsrBin
          Write-Host "coreutils on PATH via $gitUsrBin"

          # Stage every required runtime DLL into build\bin BEFORE running the
          # engine. The orchestrating repro.exe (built by bootstrap) dlopens
          # clingo.dll and sqlite3_64.dll at MODULE INIT and imports
          # libcrypto/libssl through its PE import table, so it will not even
          # start unless those sit beside it -- Win32 LoadLibrary searches the
          # exe's own directory first. This same script runs again after the
          # build (next step) because `.#release` rewrites build\bin.
          & ./windows/stage-release-dlls.ps1

          # Run the `.#release` build from a COPY of the engine at a different
          # path. That build RELINKS the engine image -- the very binary
          # orchestrating the build -- and
          # on Windows a running .exe holds an exclusive lock on its own image
          # file, so the linker cannot open it for output:
          #
          #   ld.exe: cannot open output file ...\build\bin\repro.exe: Permission denied
          #   collect2.exe: error: ld returned 1 exit status
          #   Error: execution of an external program failed: 'gcc.exe @repro_linkerArgs.txt'
          #
          # (POSIX has no such lock: `ld` unlinks the old inode and creates a new
          # file, so a running process keeps executing the old image while the new
          # binary lands -- which is exactly why the Linux/macOS legs relink repro
          # without trouble and only Windows fails here. This is also why the DSL
          # runtime library is already built as `librepro_project_dsl_runtime.new.dll`
          # and swapped: the same self-lock, handled for the .dll but not the .exe.)
          #
          # The copy lives NEXT TO the staged runtime DLLs in build\bin so
          # clingo.dll / sqlite3_64.dll / libcrypto-3-x64.dll / libssl / vcruntime
          # etc. still resolve from the orchestrator's own directory at load time
          # (Win32 LoadLibrary searches the exe's dir first). It is removed in the
          # `finally` so the packaged archive never carries the orchestrator
          # copy.
          #
          # THE COPY IS OF THE ENGINE, `reprobuild.exe`, NOT OF `repro.exe`.
          # `repro.exe` is now the thin daemon client, and it `execv`s
          # build\bin\reprobuild.exe for this build (see
          # libs/repro_core/src/repro_core/cli_images.nim). Copying the client
          # moved the lock rather than removing it: the 0.2.0 dry run failed
          # with `ld.exe: cannot open output file ...\build\bin\reprobuild.exe:
          # Permission denied`. The engine does not decide what it is from its
          # file name, so running it under another one is sound.
          $orchestrator = "build\bin\repro-orchestrator.exe"
          Copy-Item -LiteralPath "build\bin\reprobuild.exe" -Destination $orchestrator -Force

          # The same self-lock, for the monitor shim. The engine injects
          # `<engine dir>\..\lib\librepro_monitor_shim.dll` -- build\lib's copy,
          # which bootstrap just published -- into every monitored action, and
          # every process it was injected into keeps the DLL mapped until it
          # exits. `.#release` also RELINKS that path (the
          # `reprobuild.test_fixtures.monitor_shim` action), so whenever that
          # link overlaps a running monitored action it fails exactly like the
          # engine relink above:
          #
          #   ld.exe: cannot open output file ...\build\lib\librepro_monitor_shim.dll: Permission denied
          #
          # (v0.2.25's first release run, while the repro.exe link was still
          # going.) Earlier releases never relinked it at all: the engine took
          # the output bootstrap had left on disk as up to date. It now runs a
          # cacheable action that no cache record vouches for, so on this cold
          # cache the fixture always relinks.
          #
          # So pin the engine to a COPY of the monitor stack, outside build\lib,
          # through REPRO_MONITOR_SHIM_LIB -- the engine's own override, which it
          # honours before any discovery and refuses (rather than ignores) if
          # the file is missing. Monitoring is unchanged; only the injected file
          # is one no action of this build writes. The script copies the 32-bit
          # companions too, since the injector looks for them beside whichever
          # 64-bit shim it is handed; its header has the detail. The copy and
          # the pin are dropped in the `finally`, like the orchestrator copy.
          $monitorSnapshotDir = "build\orchestrator-monitor"
          $env:REPRO_MONITOR_SHIM_LIB = & ./scripts/release/snapshot_windows_monitor_stack.ps1 `
            -LibDir "build\lib" -Destination $monitorSnapshotDir
          Write-Host "monitor shim pinned to the snapshot $env:REPRO_MONITOR_SHIM_LIB"

          # Compile the recipe with the gcc env.ps1 already provisioned. Left
          # unset, the engine provisions the same pinned WinLibs release a
          # SECOND time from the builtin catalog, whose entry is the release's
          # `.7z` asset (env.ps1 fetches its `.zip`). Unpacking that needs a 7z,
          # which the engine realizes through `msiexec /a` -- and on runners
          # where the Windows Installer service is unreachable (win-ci-vm-001,
          # exit 1601) the release leg died with "could not provision the
          # pinned C compiler ... no 7z extractor available". Same release,
          # already sha256-verified by windows/ensure-gcc.ps1; the error text
          # itself names REPRO_BOOTSTRAP_CC as the override.
          $bootstrapCc = (Get-Command gcc.exe -ErrorAction Stop).Source
          & $bootstrapCc --version | Select-Object -First 1
          $env:REPRO_BOOTSTRAP_CC = $bootstrapCc
          try {
            & ".\$orchestrator" build --tool-provisioning=path --daemon=off --no-runquota .#release
            if ($LASTEXITCODE -ne 0) {
              throw "repro .#release build failed (exit code $LASTEXITCODE)"
            }
          } finally {
            Remove-Item -LiteralPath $orchestrator -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\REPRO_MONITOR_SHIM_LIB -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $monitorSnapshotDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      # Package the artifacts preserving the bin/ and lib/ structures.
      #
      # The archive name is derived here the same way `plan` derives the expected
      # asset list, and the publish job asserts the two sets match exactly -- so a
      # naming drift becomes a hard failure rather than a mystery missing asset.
      - name: Package release assets (POSIX)
        if: matrix.os-name != 'windows'
        shell: bash
        run: |
          dev-exec bash -c '
            set -euo pipefail
            version=$(grep "^version\s*=" reprobuild.nimble | sed -E "s/version\s*=\s*\"([^\"]+)\"/\1/")
            pkg_name="reprobuild-${version}-${{ matrix.platform }}-${{ matrix.arch }}"

            mkdir -p "${pkg_name}/bin" "${pkg_name}/lib"
            cp -a build/bin/* "${pkg_name}/bin/"
            cp -a build/lib/* "${pkg_name}/lib/"

            # The shell completion scripts (share/repro/completions), printed
            # by the binary this leg just built, BEFORE the relocation below
            # rewrites it. Every native package installs its copies from here,
            # and the tarball installer registers them per user.
            bash scripts/release/stage_release_completions.sh "${pkg_name}"

            # The sources an installed reprobuild compiles every project
            # against (share/repro/source + share/repro/src). Without them
            # the archive cannot run the first compile of ANY project:
            # cannot open file: repro_interface_artifacts.
            bash scripts/release/stage_release_sources.sh "${pkg_name}"

            # The RunQuota daemon and CLI, at the revision flake.lock pins.
            # Under --tool-provisioning=tarball or nix the engine will not run
            # an action without a lease, and up to v0.2.12 no archive carried
            # a daemon to take one from. Staged BEFORE the relocation below,
            # which bundles their runtime closure and wraps them like every
            # other image in bin/.
            bash scripts/release/stage_release_runquota.sh "${pkg_name}"

            # Make the tree run OFF nix: raw-copied release binaries carry a
            # nix-store ELF interpreter (linux) / install names (darwin) and do
            # not bundle their runtime libs, so the tarball fails the ubuntu
            # smoke test in verify_release.sh. Relocate + bundle so it is
            # portable. (No apostrophes/backticks in this block: it is inside a
            # single-quoted dev-exec bash -c, where a stray quote truncates it.)
            bash scripts/relocate_release_posix.sh "${pkg_name}"

            # darwin: the non-SIP tools bundle, unchanged, at
            # libexec/stackable-hooks-macos-tools (a no-op elsewhere).
            bash scripts/release/stage_release_macos_tools.sh "${pkg_name}"

            tar -czf "${pkg_name}.tar.gz" "${pkg_name}"

            # Fail here, minutes after the build, rather than an hour later in
            # the native-package step: the archive must carry the bash
            # completion script the packages install. v0.2.30 shipped an
            # archive without it, because a later stager cleared share/repro.
            completion="${pkg_name}/share/repro/completions/repro.bash"
            # Read into a variable, not piped to grep -q: an early grep exit
            # would kill tar with SIGPIPE, and pipefail would report that.
            script=$(tar -xzOf "${pkg_name}.tar.gz" "${completion}" 2>/dev/null || true)
            if [[ "${script}" != *__complete* ]]; then
              echo "::error::${pkg_name}.tar.gz has no non-empty ${completion}"
              exit 1
            fi

            echo "ASSET_PATH=${pkg_name}.tar.gz" >> "$GITHUB_ENV"
            echo "ASSET_NAME=${pkg_name}.tar.gz" >> "$GITHUB_ENV"
            echo "PKG_NAME=${pkg_name}" >> "$GITHUB_ENV"
          '

      # ONE script assembles the Windows archive: it re-stages the runtime DLLs
      # into build\bin (`.#release` rewrites build\bin, so the DLLs staged
      # before it may not survive; stage-release-dlls.ps1 is idempotent and
      # skips the pinned downloads when a DLL is already present), copies bin/
      # and lib/, builds runquotad.exe and runquota.exe into bin/ at the
      # revision flake.lock pins, stages the installed-compile sources into
      # share\repro with Git for Windows' bash (never WSL's -- v0.2.0 shipped
      # without them and every `repro exec` from the unpacked zip died at its
      # first compile: cannot open file: repro_interface_artifacts), and zips
      # the tree. The
      # GM1w gate tests/e2e/m83/t_e2e_windows_bundle_compiles_profile.nim runs
      # the same script, so the archive it tests is the archive shipped here.
      # The siblings resolve from the checkouts setup-dev-env cloned beside
      # this repository (and ../nim-bearssl, cloned above).
      - name: Package release assets (Windows)
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $out = @(./scripts/release/package_windows_release.ps1 -Zip `
            -Platform "${{ matrix.platform }}" -Arch "${{ matrix.arch }}")
          $pkg_name = Split-Path -Leaf $out[0]
          $asset = Split-Path -Leaf $out[1]
          Add-Content -Path $env:GITHUB_ENV -Value "PKG_NAME=${pkg_name}"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_PATH=${asset}"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_NAME=${asset}"

      # Smoke-tests the PACKAGED archive, not the build tree: on Windows it
      # asserts the runtime-DLL manifest and runs the binary with PATH scrubbed
      # to the system directories, so the build host cannot satisfy a dlopen
      # the archive omits.
      #
      # The Linux leg's multi-distro glibc sweep is the ONLY check that the
      # tarball runs off the machine that built it, so we now gate on it:
      # REPRO_VERIFY_REQUIRE_DOCKER=1 turns a missing/unusable Docker into a hard
      # failure instead of a silent skip (the skip is what let non-portable Linux
      # tarballs ship v0.1.0..v0.1.3). `eph-linux-x64` now carries a usable
      # Docker, so the ubuntu:24.04..almalinux:9 sweep runs and proves the
      # relocate step in packaging. The flag is a no-op on macOS/Windows (the
      # sweep is Linux-only).
      - name: Verify release assets
        shell: bash
        env:
          REPRO_VERIFY_REQUIRE_DOCKER: "1"
        run: |
          # macOS runs this under `dev-exec` so the nix dev shell supplies the
          # POSIX userland the script shells out to (find, coreutils, ...). The
          # static nix-darwin runners do NOT carry `find` on the bare step PATH
          # -- unlike the ephemeral image, whose system /usr/bin leaked in -- so
          # a bare `bash scripts/verify_release.sh` dies at the first `find` with
          # `find: command not found` (exit 127) even though the archive built,
          # packaged, and re-signed cleanly. This mirrors the POSIX packaging
          # step above, which already runs under `dev-exec` for the same reason.
          #
          # Linux stays BARE on purpose: its verify runs the multi-distro Docker
          # sweep (REPRO_VERIFY_REQUIRE_DOCKER=1), and the host `docker` CLI is
          # not in the nix dev shell -- routing it through `dev-exec` would turn
          # a green leg red. Windows stays bare too (Git-for-Windows bash already
          # supplies find/grep/etc.; there is no `dev-exec` on windows-diy).
          if [ "${{ matrix.os-name }}" = "macos" ]; then
            dev-exec bash scripts/verify_release.sh "${{ env.ASSET_PATH }}"
          else
            bash scripts/verify_release.sh "${{ env.ASSET_PATH }}"
          fi

      # The checks above prove the archive STARTS. This proves it can do the
      # first thing every consumer asks of it: compile a project's recipe and
      # provider from the sources it ships, then run a command. v0.2.0 passed
      # everything above and failed here on every platform (cannot open file:
      # repro_interface_artifacts), which is how agent-harbor's Windows CI
      # found it. Two halves: a static `nim check` of the installed-compile
      # closure against ONLY the archive's share/repro (the build host's
      # checkouts cannot mask a missing tree), and a real `repro exec` in a
      # fresh project with every source-root variable scrubbed.
      #
      # POSIX runs under `dev-exec` for the Nim compiler; Windows has it on
      # PATH from env.ps1.
      - name: Verify the archive builds a project from its own sources
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          if [ "${{ matrix.os-name }}" = "windows" ]; then
            bash scripts/release/check_release_source_closure.sh "${PKG_NAME}"
            # The recipe compile needs a C compiler. Hand it the gcc env.ps1
            # provisioned, exactly as the `.#release` build step above does
            # and for the same reason: left unset, the engine provisions the
            # pinned WinLibs .7z itself, and the 7-Zip it needs for that is
            # realized through `msiexec /a`, which exits 1601 on these
            # service-account runners (measured on this step's first run).
            # That is a property of the runner, not of the archive under test.
            gcc_exe=$(command -v gcc.exe || command -v gcc || true)
            if [ -z "${gcc_exe}" ]; then
              echo "::error::no gcc on PATH for the Windows smoke test (env.ps1 should have provisioned it)"
              exit 1
            fi
            REPRO_BOOTSTRAP_CC=$(cygpath -w "${gcc_exe}")
            export REPRO_BOOTSTRAP_CC
            echo "smoke: REPRO_BOOTSTRAP_CC=${REPRO_BOOTSTRAP_CC}"
            bash scripts/release/smoke_release_dev_exec.sh "${PKG_NAME}"
          else
            # ONE dev-exec for both: each entry re-evaluates the flake through
            # the nix daemon, and a dropped daemon socket on the macOS runners
            # ("writing to file: Socket is not connected") failed the second
            # entry of an otherwise green step.
            dev-exec bash -c 'bash scripts/release/check_release_source_closure.sh "$1" && bash scripts/release/smoke_release_dev_exec.sh "$1"' _ "${PKG_NAME}"
          fi

      # Checksum at the point of production. The publish job RE-computes this
      # from the downloaded artifact and compares, which is what makes the
      # artifact round-trip itself verified rather than assumed.
      #
      # The line is GNU sha256sum's TEXT form, `<digest>  <name>`, on every
      # leg. The Windows leg's MSYS2 sha256sum defaults to binary mode and
      # wrote `<digest> *<name>`, so the concatenated SHA256SUMS mixed the two
      # forms. The digest is read from stdin in binary mode (byte-exact, no
      # name escaping) and the line assembled here, as
      # scripts/release-signing/lib-signing.sh does for the signed manifest.
      - name: Compute checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ env.ASSET_NAME }}"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum -b < "${asset}")"
          else
            digest="$(shasum -a 256 -b < "${asset}")"
          fi
          digest="${digest%% *}"
          [[ "${digest}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no sha256 digest for ${asset}: ${digest}"; exit 1; }
          printf '%s  %s\n' "${digest}" "${asset}" > "${asset}.sha256"
          cat "${asset}.sha256"

      # The musl-static add-on binaries are NOT built here: the
      # `build-addon-static` job below builds them in parallel with this leg.

      # Native packages (.deb, .rpm) are carriers for the same bytes as this
      # leg's archive, so they are built right here, from the archive just
      # checksummed, inside the dev shell (`dev-exec`). The publish job has no
      # dev environment at all, which is why they are not built there; and
      # building them here means the workflow_dispatch dry run exercises them.
      # Each gets a `.sha256`, so the publish job's asset assertion, the
      # SHA256SUMS manifest, signing and the draft verification treat them as
      # ordinary release members. .github/release-platforms.json's `packages`
      # list declares them; a leg builds only those made from ITS archive, and
      # a leg none is made from (`matrix.native-packages`, set by `plan`) skips
      # this step and the install check below.
      - name: Build native packages from this leg's archive
        if: matrix.native-packages
        shell: bash
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          while read -r ecosystem archive asset; do
            [ -n "${ecosystem}" ] || continue
            [ "${archive}" = "${ASSET_NAME}" ] || continue
            platform_arch="${archive#"reprobuild-${VERSION}-"}"; platform_arch="${platform_arch%%.*}"
            dev-exec nix shell nixpkgs#dpkg nixpkgs#rpm -c sh scripts/release/repro-build-packages.sh \
              --version "${VERSION}" --tarball "${archive}" --out "${out}" \
              --ecosystem "${ecosystem}" \
              --platform "${platform_arch%-*}" --asset-arch "${platform_arch##*-}" < /dev/null
            [ -f "${out}/${asset}" ] || {
              echo "::error::repro-build-packages produced $(ls "${out}" | tr '\n' ' ')but not ${asset} as .github/release-platforms.json declares"
              exit 1
            }
            mv "${out}/${asset}" .
            sha256sum "${asset}" > "${asset}.sha256"
            cat "${asset}.sha256"
          done <<< "${PACKAGES}"

      # The native packages must install EXACTLY the archive's tree, and that
      # installed tree must build a project on its own. v0.2.3's .deb/.rpm
      # carried only bin/ and lib/: the archive gate above passed, and every
      # apt/dnf install would still have failed its first compile. So the
      # archive gate is re-run against what the .deb installs, and each
      # package's file set is compared with the archive's, entry for entry.
      - name: Verify the native packages install the archive intact
        if: matrix.native-packages
        shell: bash
        timeout-minutes: 60
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          set -euo pipefail
          # Every dev-exec resolves the flake from its working directory, so
          # each one runs from the checkout explicitly, whatever the step's
          # current directory happens to be.
          checkout="${PWD}"
          dx() { (cd "${checkout}" && dev-exec "$@"); }
          ref="$(mktemp -d)"
          tar -xzf "${ASSET_NAME}" -C "${ref}"
          top="$(find "${ref}" -mindepth 1 -maxdepth 1 -type d | head -1)"
          (cd "${top}" && find . -mindepth 1 | LC_ALL=C sort) > "${RUNNER_TEMP}/archive.list"
          checked=0
          while read -r ecosystem archive asset; do
            [ -n "${ecosystem}" ] || continue
            [ "${archive}" = "${ASSET_NAME}" ] || continue
            root="$(mktemp -d)"
            case "${ecosystem}" in
              deb) dx nix shell nixpkgs#dpkg -c dpkg-deb -x "${checkout}/${asset}" "${root}" < /dev/null ;;
              rpm) dx nix shell nixpkgs#rpm nixpkgs#cpio -c sh -c 'cd "$2" && rpm2cpio "$1" | cpio -idm --quiet' _ "${checkout}/${asset}" "${root}" < /dev/null ;;
              *) echo "::error::no install check for ecosystem ${ecosystem}"; exit 1 ;;
            esac
            (cd "${root}/usr/lib/reprobuild" && find . -mindepth 1 | LC_ALL=C sort) > "${RUNNER_TEMP}/package.list"
            if ! diff -u "${RUNNER_TEMP}/archive.list" "${RUNNER_TEMP}/package.list" > "${RUNNER_TEMP}/package.diff"; then
              head -40 "${RUNNER_TEMP}/package.diff"
              echo "::error::${asset} does not install ${ASSET_NAME}'s tree intact under /usr/lib/reprobuild"
              exit 1
            fi
            echo "ok  ${asset}: $(wc -l < "${RUNNER_TEMP}/package.list") entries, identical to the archive"
            # The completion files live OUTSIDE /usr/lib/reprobuild, where the
            # shells look, so the comparison above does not see them. Each
            # must be present and byte-identical to the archive copy it was
            # made from. zsh reads Debian packages from vendor-completions and
            # rpm packages from site-functions.
            case "${ecosystem}" in
              deb) zsh_dir=usr/share/zsh/vendor-completions ;;
              *)   zsh_dir=usr/share/zsh/site-functions ;;
            esac
            for pair in \
              "repro.bash:usr/share/bash-completion/completions/repro" \
              "_repro:${zsh_dir}/_repro" \
              "repro.fish:usr/share/fish/vendor_completions.d/repro.fish"; do
              src="${top}/share/repro/completions/${pair%%:*}"
              dst="${root}/${pair#*:}"
              [ -s "${src}" ] || { echo "::error::${ASSET_NAME} carries no share/repro/completions/${pair%%:*}"; exit 1; }
              cmp -s "${src}" "${dst}" || { echo "::error::${asset} does not install ${pair#*:} identical to the archive copy ${pair%%:*}"; exit 1; }
            done
            echo "ok  ${asset}: bash, zsh and fish completion identical to the archive"
            if [ "${ecosystem}" = "deb" ]; then
              # The same two halves as the archive gate, against the tree the
              # .deb installs: it is the image a package user actually runs.
              dx bash -c 'bash scripts/release/check_release_source_closure.sh "$1" && bash scripts/release/smoke_release_dev_exec.sh "$1"' _ "${root}/usr/lib/reprobuild" < /dev/null
            fi
            checked=$((checked + 1))
          done <<< "${PACKAGES}"
          [ "${checked}" -gt 0 ] || { echo "::error::no native package was checked for ${ASSET_NAME}"; exit 1; }

      # ── The signed installers: the macOS .pkg and the Windows MSI ─────────
      #
      # Built from this leg's archive, signed, verified (and the .pkg
      # notarized) by scripts/release/build_signed_installer.sh, which takes
      # its mode from the environment alone: PRODUCTION when the leg carries
      # the production signing secrets below, STAND-IN (certificates generated
      # for this run, a stand-in notary) when it does not. The two modes run
      # the same scripts; swapping in the production certificates is setting
      # the secrets, nothing else (docs/release-signing.md, "Installer
      # signing").
      #
      # "Prove, then gate": until an installer is listed in
      # .github/release-platforms.json (`matrix.signed-installer`), these steps
      # run only on a proving run (a dispatch from a branch, which publishes
      # nothing), so an unproved step can never hold back a release. `plan`
      # refuses to list one while its production secrets are missing, the
      # signer refuses a stand-in certificate on a tag
      # (REPRO_RELEASE_PUBLISHING=1), and `publish-release` refuses any
      # stand-in-signed asset (scripts/release/refuse_stand_in_signed_assets.sh).
      - name: Build, sign and notarize the macOS installer package
        if: matrix.platform == 'darwin' && (!startsWith(github.ref, 'refs/tags/') || matrix.signed-installer != '')
        shell: bash
        timeout-minutes: 90
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REPRO_RELEASE_PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          REPRO_PKG_SIGNING_P12_BASE64: ${{ secrets.REPRO_PKG_SIGNING_P12_BASE64 }}
          REPRO_PKG_SIGNING_P12_PASSWORD: ${{ secrets.REPRO_PKG_SIGNING_P12_PASSWORD }}
          REPRO_NOTARY_API_KEY_P8: ${{ secrets.REPRO_NOTARY_API_KEY_P8 }}
          REPRO_NOTARY_API_KEY_ID: ${{ secrets.REPRO_NOTARY_API_KEY_ID }}
          REPRO_NOTARY_API_ISSUER_ID: ${{ secrets.REPRO_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          # openssl and python3 from nixpkgs (macOS's own openssl is LibreSSL);
          # pkgbuild, productsign, pkgutil, security, xcrun and spctl are the
          # system's.
          dev-exec nix shell nixpkgs#openssl nixpkgs#python3 -c sh scripts/release/build_signed_installer.sh \
            --ecosystem pkg --version "${VERSION}" --archive "${ASSET_NAME}" --out installer-out \
            --platform "${{ matrix.platform }}" --asset-arch "${{ matrix.arch }}" < /dev/null

      - name: Provision WiX v3 and signtool (Windows installer)
        if: matrix.os-name == 'windows' && (!startsWith(github.ref, 'refs/tags/') || matrix.signed-installer != '')
        shell: pwsh
        run: |
          . ./windows/toolchain-utils.ps1
          . ./windows/ensure-installer-tools.ps1
          $toolchain = Read-KeyValueFile -Path windows/toolchain-versions.env
          $root = if ($env:WINDOWS_DIY_INSTALL_ROOT) { $env:WINDOWS_DIY_INSTALL_ROOT } else { $env:RUNNER_TEMP }
          $tools = Ensure-InstallerTools -Root $root -Toolchain $toolchain
          Add-Content -Path $env:GITHUB_ENV -Value "REPRO_WIX3_BIN=$($tools.Wix3Bin)"
          Add-Content -Path $env:GITHUB_ENV -Value "REPRO_SIGNTOOL=$($tools.SignTool)"

      - name: Build and sign the Windows installer (MSI)
        if: matrix.os-name == 'windows' && (!startsWith(github.ref, 'refs/tags/') || matrix.signed-installer != '')
        shell: bash
        timeout-minutes: 60
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REPRO_RELEASE_PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          REPRO_AUTHENTICODE_PFX_BASE64: ${{ secrets.REPRO_AUTHENTICODE_PFX_BASE64 }}
          REPRO_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.REPRO_AUTHENTICODE_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          sh scripts/release/build_signed_installer.sh \
            --ecosystem msi --version "${VERSION}" --archive "${ASSET_NAME}" --out installer-out \
            --platform "${{ matrix.platform }}" --asset-arch "${{ matrix.arch }}" < /dev/null

      # A proving run keeps what it built as a workflow artifact of its own,
      # which `publish-release` never downloads (it takes `release-*`): the
      # package, its checksum, the signing report and, in stand-in mode, the
      # marker and the stand-in's PUBLIC root. No key is ever in it.
      - name: Keep the installer of a proving run
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          (matrix.platform == 'darwin' || matrix.os-name == 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: proving-installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: installer-out/
          if-no-files-found: error
          retention-days: 7

      # A listed installer joins this leg's release artifact like the .deb.
      - name: Stage the listed installer for the release
        if: startsWith(github.ref, 'refs/tags/') && matrix.signed-installer != ''
        shell: bash
        env:
          INSTALLER: ${{ matrix.signed-installer }}
        run: |
          set -euo pipefail
          [ -f "installer-out/${INSTALLER}" ] || { echo "::error::no ${INSTALLER} was built"; exit 1; }
          mv "installer-out/${INSTALLER}" "installer-out/${INSTALLER}.sha256" .

      # Publish NOTHING to the release from here. The artifact is the only
      # output of a build leg; a leg that uploads directly to the release is
      # exactly the bug this workflow was restructured to remove.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          # The native packages this leg built, if any (Linux only).
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
            reprobuild_*.deb
            reprobuild_*.deb.sha256
            reprobuild-*.rpm
            reprobuild-*.rpm.sha256
            reprobuild-*.pkg
            reprobuild-*.pkg.sha256
            reprobuild-*.msi
            reprobuild-*.msi.sha256
          if-no-files-found: error
          retention-days: 7

  # ── The musl-static add-on binaries, in a job of their own ────────────────
  #
  # .github/release-platforms.json `addon_static`: one musl-static `repro` per
  # Debian architecture, built and statically verified by
  # scripts/build_addon_static.sh, the same script a developer runs. Each gets
  # a `.sha256`, so it joins SHA256SUMS, the publish job's asset assertion and
  # the signature like every other asset.
  #
  # WHY A JOB OF ITS OWN. This was a step of the Linux leg, after that leg's
  # build and archive verification, and on both runs that reached it the leg
  # then ran out of its 540-minute cap:
  #   - agents run 41847213559: the step took 5 h 37 m (17:39-23:16Z), and the
  #     leg was cancelled at 9 h 5 m, in the native-package verification after it;
  #   - v0.2.20 run 41962654843: the leg reached the step after 7 h 6 m. amd64
  #     and arm64 took 20 minutes from substituted toolchains; the armhf cross
  #     gcc (armv7l-unknown-linux-musleabihf-gcc-15.2.0) then built from source
  #     for 82 minutes, and the cap fell 7 s into the armhf compile.
  # The build needs nothing that leg builds -- only the dev shell (nim and the
  # sibling sources) and three nixpkgs toolchains -- and its cost is mostly
  # those toolchains: cache.nixos.org carries no stage of the armhf one, so a
  # runner the private cache cannot serve builds a two-stage cross gcc. Here it
  # runs beside the Linux leg instead of after it, and neither job's duration
  # adds to the other's. It runs on general Linux capacity, not the release
  # lane, which has a single runner (see `addon_static.runner`); time spent
  # queued there does not count against `timeout-minutes`.
  build-addon-static:
    name: Static add-on binaries
    needs: plan
    if: needs.plan.outputs.addon-runner != ''
    runs-on: ${{ fromJSON(needs.plan.outputs.addon-runner) }}
    # Sized from the one run in which the build completed (5 h 37 m, toolchains
    # built from source) plus about 10 minutes of checkout and dev-env setup,
    # and kept below build-release's 540 so this job never makes a release
    # wait longer than its Linux leg does.
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4

      # As in build-release: the dev environment clones private siblings.
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: ${{ needs.plan.outputs.addon-env-flavor }}
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          flake-override-inputs: |
            runquota-src=../runquota
            io-mon-src=../io-mon
            nim-shm-queue-src=../nim-shm-queue
            nim-cli-spec-src=../nim-cli-spec
            nim-entrypoints-src=../nim-entrypoints
            nim-confutils-src=../nim-confutils
            nim-stackable-hooks-src=../nim-stackable-hooks
            reprobuild-test-adapters-src=../reprobuild-test-adapters
            test-certificates-tools-src=../test-certificates-tools

      - name: Build the static add-on binaries
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ARCHES: ${{ needs.plan.outputs.addon-arches }}
        run: |
          set -euo pipefail
          # ARCHES is the space-separated `addon_static.arches` list.
          # shellcheck disable=SC2086
          dev-exec bash scripts/build_addon_static.sh ${ARCHES} < /dev/null
          for a in ${ARCHES}; do
            name="repro-addon-${VERSION}-linux-${a}"
            cp "build/addon/${a}/repro" "${name}"
            sha256sum "${name}" > "${name}.sha256"
            cat "${name}.sha256"
          done

      # `release-*`, so the publish job's download collects it with the legs.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-addon-static
          path: repro-addon-*
          if-no-files-found: error
          retention-days: 7

  # ── The Nix package, to the organisation cache, in a job of its own ───────
  #
  # Consumers that bind an explicit Linux Repro runtime run
  # `nix build github:metacraft-labs/reprobuild/<pin>#reprobuild`. Nothing
  # used to build that attribute for a release revision (ci.yml builds
  # `.#default` only on `main`/`dev` pushes and on pull requests not targeting
  # `agents`), so every such lane compiled the engine from source for 28-38
  # minutes. This job builds that attribute and pushes its closure to Attic.
  #
  # WHY A JOB OF ITS OWN. It was the last step of the Linux build leg. On
  # v0.2.26 (run 43892878762, attempt 1) the leg built every asset in 8 h,
  # then atticd answered the push with HTTP 500 (InternalServerError) for 19
  # minutes; the step failed, so the leg failed, so the all-or-nothing publish
  # refused, and the only way forward was an 8-hour re-run of the leg. The push
  # needs nothing the leg builds: the flake reference below is self-contained
  # (`github:<repo>/<sha>`, the locked inputs), so this job rebuilds nothing
  # the leg made and the leg hands it nothing. Here it runs beside the legs on
  # general Linux capacity, and "Re-run failed jobs" repeats only this job
  # (a build of the package plus the push; consumer lanes measured that build
  # at 28-38 minutes) -- not the leg.
  #
  # WHY NO CLOSURE IS HANDED OVER FROM THE LEG. That was considered and
  # rejected. The package closure is about 1.5 GiB (reprobuild 0.2.19:
  # 74 paths, a 686 MiB source tree among them), uploaded as an artifact by
  # every release; and importing it here needs `nix-store --import` or
  # `nix copy --no-check-sigs` of unsigned paths, which the nix-daemon refuses
  # to an untrusted client -- and the ephemeral `eph-linux-x64` guests are
  # untrusted Nix clients.
  #
  # IT DOES NOT GATE THE RELEASE. `publish-release` does not need this job:
  # the cache entry is a convenience for consumers, not a release asset, and a
  # transient cache-service failure must not stop a release that built every
  # asset. Its failure is still loud -- the job and the run go red, the push
  # step annotates the attempt history, and the last step writes the re-run
  # instruction into the job summary. Nothing reads the cache at publish time;
  # consumers fetch the package only after a pin moves to this revision, and
  # a pin should move only once this job is green.
  #
  # Like the step it replaces, it runs on every run of this workflow, a branch
  # dispatch included, so a dispatch exercises it before a tag depends on it.
  publish-nix-cache:
    name: Publish the Nix package to the organisation cache
    permissions:
      contents: read
    # After `plan`, which carries the release-lane guard and must take the
    # lane's one warm runner first: this job has no other `needs:`, and
    # started beside `plan` it could take that runner for half an hour while
    # `plan`, which gates every leg, waits for general capacity. Nothing a
    # leg builds is needed here.
    needs: plan
    # Not on a proving run (a `platforms` filter): it proves one leg, and the
    # cache push of the x86_64 package is no part of that.
    if: needs.plan.outputs.full-release == 'true'
    # `[self-hosted, linux, x64]`, like `plan`: the `eph-linux-x64-release`
    # scale set has a single runner and the Linux leg holds it for hours.
    runs-on: [self-hosted, linux, x64]
    # The build step's cap, plus the push step's, plus setup.
    timeout-minutes: 500
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The package's locked flake inputs include private metacraft-labs
      # repositories (runquota and the other `*-src` inputs), so Nix needs the
      # installation token to fetch them, as in build-release.
      - name: Mint installation token for private flake inputs
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # The action setup-dev-env runs for the `nix` flavour, without the dev
      # shell and the sibling clones this job does not use. `attic-token`
      # without `attic-cache` configures only the read half (setup-nix's
      # `attic-token` input): Nix substitutes from the private cache, and no
      # `attic watch-store` is started. The push is the explicit, bounded step
      # below; a background watcher would upload every path the build produces
      # to the same atticd at the same time, with nobody checking its result.
      - name: Setup Nix
        uses: metacraft-labs/metacraft-github-actions/setup-nix@dev
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      # Spelled exactly as the consumers spell it, so the store path pushed
      # below is the one they ask for.
      - name: Build the Nix package of this revision
        id: package
        timeout-minutes: 240
        shell: bash
        run: |
          set -euo pipefail
          package="$(nix build --no-link --print-out-paths --no-update-lock-file \
            "github:${GITHUB_REPOSITORY}/${GITHUB_SHA}#reprobuild")"
          test -x "$package/bin/repro"
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "Built $package (reprobuild $GITHUB_SHA)"

      # `attic push` sends the whole closure and skips what the cache, or its
      # upstream cache.nixos.org, already holds. atticd answers in bursts of
      # HTTP 500 when its database pool times out, so the push is retried with
      # backoff (1, 2, 4, 8, 16 minutes) on transient failures and fails at
      # once on credential and request errors; the classification and its
      # sources are in scripts/release/attic_push_with_retry.sh. The step's
      # cap is that script's worst case, 6 x 30 + 31 = 211 minutes, rounded up.
      - name: Push the package to Attic
        timeout-minutes: 220
        shell: bash
        env:
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          if [[ -z "${ATTIC_TOKEN}" || -z "${ATTIC_CACHE}" || -z "${ATTIC_ENDPOINT}" ]]; then
            echo "::error::ATTIC_TOKEN, vars.ATTIC_CACHE and vars.ATTIC_ENDPOINT are required to publish the reprobuild package"
            exit 1
          fi
          echo "::add-mask::$ATTIC_TOKEN"
          attic="$(nix build --no-link --print-out-paths --accept-flake-config nixpkgs#attic-client)/bin/attic"
          "$attic" login --set-default release "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
          ATTIC="$attic" bash scripts/release/attic_push_with_retry.sh "$ATTIC_CACHE" "$PACKAGE"
          echo "Published $PACKAGE (reprobuild $GITHUB_SHA)"

      - name: Say how to repeat the cache publish
        if: failure()
        shell: bash
        run: |
          {
            echo "### The Nix package of ${GITHUB_SHA} is NOT in the organisation cache"
            echo ""
            echo "This job does not gate the GitHub release, which publishes without it."
            echo "Consumers of \`github:${GITHUB_REPOSITORY}/${GITHUB_SHA}#reprobuild\` build"
            echo "the engine from source until it is pushed. Do not move a reprobuild pin to"
            echo "this revision before this job is green."
            echo ""
            echo "Repeat it with **Re-run failed jobs** on this run once the cache is healthy"
            echo "(\`curl -fsS ${ATTIC_ENDPOINT:-https://cache.metacraft-labs.com/}\`). That re-runs this"
            echo "job alone; it does not rebuild the release legs."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::The Nix package of ${GITHUB_SHA} was not published to the organisation cache. Re-run this job (Re-run failed jobs); the release does not depend on it."
        env:
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}

  publish-release:
    name: Publish release (all-or-nothing)
    # Not `publish-nix-cache`, deliberately: the cache entry is not a release
    # asset, and a cache-service failure must not hold back a release whose
    # assets all built. See that job.
    needs: [plan, build-release, build-addon-static]
    # A job-level `permissions:` block REPLACES the workflow-level one rather
    # than merging with it, so `contents: write` is restated here -- without it
    # this job could not create or update the release at all.
    #
    # `id-token: write` is what lets a step in this job ask GitHub for an OIDC
    # token ($ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN), which is the ONLY way
    # cosign keyless can derive a signer identity on a runner. It is granted
    # ahead of the rest of that work because it is the one half of the boundary
    # that cannot be arranged from the infra repo, and it is INERT until
    # something actually requests a token: nothing here passes `--cosign` yet,
    # and `rs_cosign_sign_blob` refuses (exit 2, SKIPPED, no .sigstore) rather
    # than fabricating anything.
    #
    # Installing cosign and passing `--cosign` land as their own reviewed
    # change, deliberately NOT bundled with the first release that has a real
    # signing key -- and the first bundle it produces is unverified until
    # someone runs `cosign verify-blob --certificate-identity
    # --certificate-oidc-issuer` against Rekor. See
    # docs/release-signing.md and metacraft-labs/infra
    # docs/runbooks/secret-rotation/reprobuild-release-signing-key.md (Section 8).
    permissions:
      contents: write
      id-token: write
    # The `eph-linux-x64-release` scale set (infra's release lane, routing
    # half), like the Linux leg in .github/release-platforms.json.
    runs-on: eph-linux-x64-release
    # `always()` so a failed matrix reaches the explicit assertion below and
    # reports a RED publish job. Plain `needs:` semantics would SKIP this job,
    # which renders green-ish in the UI -- the same quiet non-event that let
    # partial releases look normal for four releases running.
    #
    # The release-lane guard (see the header) is repeated here because
    # `always()` would otherwise run this job even when `plan` was skipped.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      github.repository == 'metacraft-labs/reprobuild' &&
      startsWith(github.workflow_ref, 'metacraft-labs/reprobuild/.github/workflows/release.yml@') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Assert every platform built
        # The add-on job is skipped, not failed, when no add-on is declared.
        if: >-
          needs.build-release.result != 'success' || needs.plan.result != 'success' ||
          (needs.plan.outputs.addon-runner != '' && needs.build-addon-static.result != 'success')
        run: |
          echo "::error::Refusing to publish. plan=${{ needs.plan.result }} build=${{ needs.build-release.result }} addon=${{ needs.build-addon-static.result }}"
          echo "::error::A release publishes every platform in .github/release-platforms.json or it publishes nothing."
          echo "::error::Fix the failing leg and re-run, or -- as a reviewed, deliberate decision -- remove that"
          echo "::error::platform from .github/release-platforms.json to narrow what this release promises."
          exit 1

      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging
          merge-multiple: true

      # Belt-and-braces over the job gate: a green leg whose upload silently
      # produced nothing would otherwise still yield a short release. This
      # compares what actually landed against `plan`'s derived list, in BOTH
      # directions, and re-verifies each checksum after the artifact round trip.
      - name: Assert the complete, expected asset set is present
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.expected-assets }}
        run: |
          set -euo pipefail
          cd staging

          echo "=== staged files ==="
          ls -la

          missing=()
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            if [ ! -f "${asset}" ]; then
              missing+=("${asset}")
              continue
            fi
            if [ ! -f "${asset}.sha256" ]; then
              missing+=("${asset}.sha256")
              continue
            fi
            # Re-derive the digest here and compare with the one the build leg
            # produced, so artifact upload/download corruption cannot pass.
            expected_sum="$(awk '{print $1}' "${asset}.sha256")"
            actual_sum="$(sha256sum "${asset}" | awk '{print $1}')"
            if [ "${expected_sum}" != "${actual_sum}" ]; then
              echo "::error::${asset} changed in transit: build leg recorded ${expected_sum}, staged copy is ${actual_sum}"
              exit 1
            fi
            echo "ok  ${asset}  ${actual_sum}"
          done <<< "${EXPECTED}"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release is incomplete; refusing to publish. Missing: ${missing[*]}"
            exit 1
          fi

          # And the other direction: nothing unexpected rides along.
          for f in *; do
            case "${f}" in
              *.sha256) continue ;;
            esac
            if ! grep -Fxq "${f}" <<< "${EXPECTED}"; then
              echo "::error::Unexpected asset '${f}' staged for release; it is not in .github/release-platforms.json"
              exit 1
            fi
          done

          echo "All $(grep -c . <<< "${EXPECTED}") expected archives present and verified."

      # A stand-in-signed .pkg or MSI is never published, whatever let it get
      # this far (the leg and `plan` refuse it first; see the build job).
      - name: Refuse stand-in-signed assets
        shell: bash
        run: sh scripts/release/refuse_stand_in_signed_assets.sh staging

      # One combined manifest is what `setup-reprobuild` verifies downloads
      # against. Before this, releases published no checksums at all, so the
      # only integrity guarantee a consumer had was TLS to github.com.
      - name: Build SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          rm -f SHA256SUMS
          # Sorted for a stable, diffable manifest.
          for f in $(ls *.sha256 | sort); do
            cat "${f}"
          done > SHA256SUMS
          rm -f -- *.sha256
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # ── Sign the release ──────────────────────────────────────────────────
      #
      # SHA256SUMS above is SAME-ORIGIN integrity: it proves the bytes on
      # this release page match a list on the same release page, which an
      # attacker who can replace one can replace both. Signing is what makes
      # it trust. See docs/release-signing.md.
      #
      # This step is a NO-OP UNTIL A RELEASE KEY EXISTS, and says so out
      # loud, because scripts/release-signing/trusted-release-keys.txt is
      # empty by design: M2 built the machinery, the governance secret
      # pipeline mints the key. Until then a release still publishes, with
      # exactly the same-origin integrity it had before -- what it must never
      # do is publish something that LOOKS signed.
      #
      # When the key exists, the secret holds an ASCII-armoured private key
      # and the fingerprint must also be committed to trusted-release-keys.txt
      # in a reviewed change; the signer refuses an unlisted key rather than
      # falling back, so forgetting the second half fails the release rather
      # than silently signing with something nobody blessed.
      - name: Sign SHA256SUMS and artifacts
        shell: bash
        env:
          REPRO_RELEASE_SIGNING_KEY: ${{ secrets.REPRO_RELEASE_SIGNING_KEY }}
          REPRO_RELEASE_SIGNING_KEY_ID: ${{ secrets.REPRO_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${REPRO_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::warning::No REPRO_RELEASE_SIGNING_KEY secret is configured."
            echo "::warning::This release carries SHA256SUMS (same-origin integrity) but NO signature."
            echo "::warning::See docs/release-signing.md -- the key is a governance deliverable, not a code one."
            exit 0
          fi
          if [ -z "${REPRO_RELEASE_SIGNING_KEY_ID:-}" ]; then
            echo "::error::REPRO_RELEASE_SIGNING_KEY is set but REPRO_RELEASE_SIGNING_KEY_ID is not."
            echo "::error::Refusing to guess which key in the imported material should sign."
            exit 1
          fi
          # The key material lives in a file only for the lifetime of this
          # step, in a directory the signer shreds. `repro-sign-release.sh`
          # imports it into an ephemeral GNUPGHOME and never touches
          # ~/.gnupg. Nothing is echoed: `set -x` is deliberately absent.
          keydir="$(mktemp -d)"
          trap 'rm -rf "${keydir}"' EXIT
          printf '%s' "${REPRO_RELEASE_SIGNING_KEY}" > "${keydir}/key.asc"
          # The exported PUBLIC key goes to the runner's temp directory and
          # NOT into staging/, because staging/ is what gets uploaded to the
          # release page. docs/release-signing.md step 4 is explicit that the
          # public key must be published somewhere that is not the release
          # page: verifying a release against a key fetched from that same
          # release is circular, and shipping the key beside the artifacts
          # invites exactly that. The next step still needs it, so it lives
          # somewhere both steps can reach and no consumer can.
          pubkey="${RUNNER_TEMP:-/tmp}/reprobuild-release-key.asc"
          # Invoked through `sh` rather than as ./script so the run does
          # not depend on the executable bit surviving checkout.
          sh ./scripts/release-signing/repro-sign-release.sh \
            --dir staging \
            --key "${REPRO_RELEASE_SIGNING_KEY_ID}" \
            --secret-key-file "${keydir}/key.asc" \
            --export-key "${pubkey}"
          rm -f "${keydir}/key.asc"
          echo "=== signed release contents ==="
          ls -la staging

      # A signature nobody checks is decoration. Verify what we just
      # produced with the SAME script the installer runs.
      #
      # This is a WELL-FORMEDNESS check, not a trust check, and the
      # difference matters: the key it verifies against is the one this job
      # just exported, so it cannot tell you the right key signed. What it
      # does tell you is that the manifest, the per-artifact signatures and
      # the bytes all agree under the installer's own code path -- so a
      # release can never ship a signature the installer would reject. The
      # trust check happens on the user's machine, against a key they got
      # from somewhere other than this release.
      - name: Verify the signed release exactly as the installer will
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f staging/SHA256SUMS.asc ]; then
            echo "::warning::Release is unsigned (no key configured); nothing to verify."
            exit 0
          fi
          pubkey="${RUNNER_TEMP:-/tmp}/reprobuild-release-key.asc"
          if [ ! -s "${pubkey}" ]; then
            # A signed staging dir with no exported key means the previous
            # step did not run the way it thinks it did. Fail rather than
            # skip: "there was nothing to verify against" is the one excuse
            # this milestone does not accept.
            echo "::error::staging/SHA256SUMS.asc exists but ${pubkey} does not; refusing to skip verification."
            exit 1
          fi
          sh ./scripts/release-signing/repro-verify-release.sh \
            --keyring "${pubkey}" \
            --dir staging \
            --require-all

      # ── Refuse if the tag no longer names the commit this run built ───────
      #
      # The legs built `github.sha`, fixed when the run started; the release is
      # published under the tag NAME, which resolves to whatever the tag names
      # when someone reads it. v0.2.24 published assets built from 7c670d248
      # under a tag that had been moved to 8cd4a5051e 42 seconds after the run
      # (attempt 2 of 43218423379) started, so an ancestry check against the
      # tag credited the release with fixes its assets did not carry. Asking
      # the remote (the checkout's own tag ref cannot have moved) closes that:
      # checked here, before the release is touched at all (so a stale re-run
      # cannot hide a correctly published release by drafting it), and again
      # once the release is visible (below), so a move during the upload is
      # caught too.
      - name: Refuse if the tag no longer names this build (before upload)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          BUILT_COMMIT: ${{ github.sha }}
        run: bash scripts/release/assert_tag_names_commit.sh origin "${TAG}" "${BUILT_COMMIT}"

      # ── Force any pre-existing release for this tag back to draft ──────────
      #
      # `softprops/action-gh-release@v2` does NOT honour `draft: true` for a
      # release that already exists. Its update path passes
      # `draft: existingRelease.draft` (src/github.ts), i.e. it preserves
      # whatever the release already was and ignores the input. So on a re-run
      # of an already-PUBLISHED tag the next step would upload assets straight
      # onto the live, consumer-visible release, one at a time -- precisely the
      # "visible but incomplete" state this workflow exists to make impossible.
      # A failure midway would then leave a broken public release while the
      # verify step below reported "leaving it as a DRAFT", which would be
      # false.
      #
      # So we draft it ourselves first, and only then upload. A release being
      # rebuilt is momentarily hidden rather than momentarily inconsistent.
      - name: Force existing release for this tag back to draft
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const existing = releases.filter(r => r.tag_name === tag);
            if (!existing.length) {
              core.info(`no existing release for ${tag}; it will be created as a draft.`);
              return;
            }
            for (const r of existing) {
              if (r.draft) {
                core.info(`release ${tag} (id=${r.id}) is already a draft.`);
                continue;
              }
              core.warning(
                `release ${tag} (id=${r.id}) is currently PUBLISHED. Hiding it as a draft for the ` +
                `duration of this run so consumers cannot observe a partially re-uploaded release. ` +
                `It is republished at the end only if every expected asset is confirmed present.`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: r.id, draft: true,
              });
            }

      # Create/refresh the release as a DRAFT holding every asset. A draft is
      # invisible to consumers and is never "Latest", so even a partial or
      # interrupted upload cannot be seen by anyone.
      - name: Upload assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Confirm against the API that the draft really carries everything, then
      # -- and only then -- make it visible. This is the step that converts
      # "we uploaded" into "the published release is complete".
      - name: Verify the draft, then publish it
        uses: actions/github-script@v7
        env:
          EXPECTED: ${{ needs.plan.outputs.expected-assets }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Read through `env`, not an Actions expression interpolation
            // inside the script body: an expression is pasted in textually,
            // so an asset name containing a backtick or a JS `${` would break
            // out of the template literal it was being pasted into.
            //
            // Editing this block: `script` is an Actions *input*, so its whole
            // body -- comments included -- is scanned for expression syntax
            // before any JavaScript runs. Writing the literal two-brace
            // interpolation sequence here, even inside a `//` comment, is a
            // workflow LOAD error ("An expression was expected") that fails
            // the run before a single job is created, on every push, for every
            // event -- including ones this workflow does not subscribe to.
            // Describe the syntax in words; never spell it out.
            const expected = new Set(
              (process.env.EXPECTED || '').split('\n').map(s => s.trim()).filter(Boolean)
            );
            expected.add('SHA256SUMS');

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const matching = releases.filter(r => r.tag_name === tag);
            if (matching.length === 0) {
              core.setFailed(`no release found for tag ${tag}`);
              return;
            }
            if (matching.length > 1) {
              // Picking "the first one" here would be picking at random which
              // release becomes visible.
              core.setFailed(
                `${matching.length} releases share tag ${tag} (ids: ${matching.map(r => r.id).join(', ')}). ` +
                `Refusing to guess which one to publish -- delete the stale ones and re-run.`);
              return;
            }
            const release = matching[0];
            if (!release.draft) {
              // Everything above is built on "nothing is visible until the
              // asset set is confirmed". If the release is already live at
              // this point that invariant is broken and the reassuring
              // "leaving it as a DRAFT" messages below would be lies.
              core.setFailed(
                `release ${tag} (id=${release.id}) is already PUBLISHED before verification. ` +
                `Refusing to proceed: consumers may already have seen an incomplete release.`);
              return;
            }

            // Signing (see "Sign the release") drops a detached signature
            // beside SHA256SUMS and beside every archive. Those are ALLOWED
            // to be present but are never REQUIRED here: until the governance
            // pipeline mints a release key the signing step is a documented
            // no-op and none of them exist, so requiring them would fail every
            // release today. Their completeness is not this step's job --
            // "Verify the signed release exactly as the installer will" runs
            // the installer's own verifier with --require-all, which fails the
            // job if any manifest entry lacks a signature that verifies.
            //
            // Without this, the FIRST signed release would upload correctly
            // and then be refused here as "unexpected asset(s)", leaving a
            // permanent draft on the day the key arrives.
            const allowed = new Set([...expected].map(a => `${a}.asc`));

            const present = new Set(release.assets.map(a => a.name));
            const missing = [...expected].filter(a => !present.has(a));
            const extra = [...present].filter(a => !expected.has(a) && !allowed.has(a));

            core.info(`release ${tag} (id=${release.id}, draft=${release.draft}) carries: ${[...present].sort().join(', ') || '(nothing)'}`);

            if (missing.length) {
              core.setFailed(
                `Draft release ${tag} is missing ${missing.join(', ')}. Leaving it as a DRAFT so no consumer ` +
                `can see a partial release. Delete the draft, fix the cause, and re-run.`);
              return;
            }
            if (extra.length) {
              // A stale asset from an earlier attempt at the same tag would
              // ship alongside the intended set; that is a different release
              // than the one this run built.
              core.setFailed(
                `Draft release ${tag} carries unexpected asset(s): ${extra.join(', ')}. ` +
                `Leaving it as a DRAFT. Delete the stale assets (or the draft) and re-run.`);
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: release.id, draft: false,
            });
            core.info(`Published ${tag} with all ${expected.size} assets.`);

      # The same check as before the upload, now that the release is public:
      # the tag could have moved while the assets were uploading or while the
      # draft was being verified. On a mismatch the release is hidden again and
      # the packages below are not published, because the job fails here.
      - name: Refuse if the tag no longer names this build (after publishing)
        id: tag_after_publish
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          BUILT_COMMIT: ${{ github.sha }}
        run: bash scripts/release/assert_tag_names_commit.sh origin "${TAG}" "${BUILT_COMMIT}"

      - name: Hide the release again, its tag moved while it was publishing
        if: failure() && steps.tag_after_publish.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=true
          echo "::error::Release ${TAG} was returned to draft: its tag no longer names ${GITHUB_SHA}, the commit its assets were built from."

      # ── Add the packages to the organisation's repositories ────────────────
      #
      # Runs AFTER the release is public, on purpose: the publisher downloads
      # the .deb and .rpm from this Release and verifies them against its
      # SHA256SUMS, so they must be fetchable first. An index that is a few
      # minutes behind a release is fine; one that names files nobody can
      # fetch yet is broken.
      #
      # There is one apt and one RPM repository for every Metacraft product
      # (deb.metacraft-labs.com, rpm.metacraft-labs.com), signed with the
      # organisation's key. metacraft-labs/metacraft-desktop-packages owns that
      # key and the bucket credentials and regenerates the indices over every
      # product's packages. This workflow holds neither; it only asks. See
      # metacraft-specs infrastructure/package-distribution.md §3 and §9.1.
      - name: Mint a token for the organisation's package publisher
        id: packages_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: metacraft-desktop-packages
          # repository_dispatch requires contents: write on the target.
          permission-contents: write

      - name: Publish the packages into the organisation's repositories
        shell: bash
        env:
          GH_TOKEN: ${{ steps.packages_token.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --method POST repos/metacraft-labs/metacraft-desktop-packages/dispatches \
            -f event_type=publish-release \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${TAG}"
          echo "::notice::Asked metacraft-labs/metacraft-desktop-packages to add ${TAG}'s packages to deb.metacraft-labs.com and rpm.metacraft-labs.com. Follow it at https://github.com/metacraft-labs/metacraft-desktop-packages/actions/workflows/publish-release.yaml"
