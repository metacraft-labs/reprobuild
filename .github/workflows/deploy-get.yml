name: Deploy get.reprobuild.com

# Publishes the get/ tree (landing + /sh + /pwsh) to the `get-reprobuild`
# Cloudflare Pages project, which serves https://get.reprobuild.com.
#
# The install scripts are single-sourced from this repo's canonical installers
# (install-on-distributions.sh -> /sh, install.ps1 -> /pwsh); get/build-get.sh
# assembles get/dist/. See metacraft-dev-guidelines/policies/product-install-domains.md
# and get/README.md.
#
# The `get-reprobuild` project's production branch is `master`, so we deploy with
# `--branch master` to publish a PRODUCTION deployment (served on the custom
# domain) regardless of which repo branch triggered the run.
#
# HERMETIC WRANGLER: the self-hosted eph-linux-x64 Nix runners ship no
# preinstalled node/npx, so cloudflare/pages-action@v1 and
# cloudflare/wrangler-action@v3 both fail with `npx: command not found`. We do
# not preinstall software on runners, and we do not fetch wrangler ad-hoc — the
# build + deploy run inside this flake's `.#ci` dev shell, which provides
# wrangler pinned by flake.lock (see flake.nix `devShells.ci`). wrangler
# authenticates from CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [dev]
    paths:
      - "get/**"
      - "install-on-distributions.sh"
      - "install.ps1"
      # /sh and /pwsh are assembled from these (get/build-get.sh).
      - "scripts/install/repro-install.sh"
      - "scripts/install/repro-install.ps1"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/deploy-get.yml"
  workflow_dispatch:

# NOT cancel-in-progress. This workflow fires on every flake.lock change, which
# lands on dev several times a day, while a deploy can wait hours for a
# self-hosted runner. With cancel-in-progress, each new push cancelled the
# queued deploy before it ever ran, and get.reprobuild.com went days without
# a deploy (2026-09-30: three in a row cancelled while queued). A run that
# holds the slot now keeps it; newer runs wait, and GitHub keeps only the
# newest of those. Each deploy publishes the whole tree at its commit, so an
# older deploy followed by a newer one is harmless.
concurrency:
  group: deploy-get-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy get.reprobuild.com
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      deployments: write
    environment:
      name: get-reprobuild
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble get/dist (hermetic — .#ci dev shell)
        run: nix develop .#ci --command bash get/build-get.sh

      - name: Publish to Cloudflare Pages (get-reprobuild)
        id: deploy
        # Flake-pinned wrangler from `.#ci` (NOT npx / cloudflare/*-action).
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          nix develop .#ci --command wrangler pages deploy get/dist \
            --project-name=get-reprobuild \
            --branch=master \
            --commit-dirty=true | tee wrangler-deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' wrangler-deploy.log | tail -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"
