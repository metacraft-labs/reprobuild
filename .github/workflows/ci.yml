name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches-ignore: [agents]
  # Dispatchable on any branch, which every other workflow here already is
  # (benchmark, hcr-lanes, release, deploy-get, attestation-collateral) and
  # this one was not.
  #
  # That omission is not cosmetic: it is why a check that fails ONLY under CI
  # conditions could not be worked on. `just lint`'s sibling-pin gate failed on
  # every run for five days because `actions/checkout` persists an
  # `http.https://github.com/.extraheader` into the repo-local git config while
  # the dev-env exports a second `extraHeader` for the same host through
  # `GIT_CONFIG_*`. `http.extraHeader` is multi-valued, so git sent BOTH and
  # github answered `Duplicate header: "Authorization"` with HTTP 400 -- in
  # about 400ms, which reads like being offline. That is a condition that cannot
  # be reproduced on a laptop, where there is exactly one credential, and, with
  # the triggers above, could not be reproduced on a branch either. The only
  # way to get a verdict was to push to `dev` or open a pull request into it,
  # so the fix for a gate that blocks promotions could not be tested without
  # doing the thing the gate blocks. Promotions landed on locally-substituted
  # evidence instead.
  workflow_dispatch:

# This workflow supersedes its own older runs, on branches as well as pull
# requests, and that is deliberate rather than merely inherited.
#
# It would be nice for every commit on `dev` to get its own verdict from these
# jobs. It is not affordable: they run on a small, permanently saturated
# self-hosted pool, and `dev` takes pushes faster than the pool drains. Letting
# branch runs accumulate does not buy more verdicts -- it buys a backlog that
# delays the pull-request checks people are actually waiting on, while the
# branch verdicts arrive hours late against a commit several pushes old.
#
# The gate that must not be skipped therefore does not live here. The suite
# case-count baseline runs in `suite-case-counts.yml`, on a hosted runner, in
# seconds, with no cancellation -- so it reaches a verdict on every commit
# without competing for this pool. See that workflow for the reasoning.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI replays the project's deterministic dev environment via the
# shared `metacraft-github-actions` composite actions. Per the
# `ci-shared-dev-env` policy, this workflow:
#
#   - does NOT install tools (nim, gcc, capnp, etc.) directly; the
#     flake's devShell declares them.
#   - does NOT inline `nix develop --command …` invocations; it
#     uses `dev-exec` from the shared `setup-dev-env` action.
#   - clones sibling repos via `clone-repo` and threads them through
#     `flake-override-inputs` so the dev shell consumes the local
#     checkouts instead of pinned github tarballs.
#
# Policy doc:
#   policies/ci-shared-dev-env.md in the internal metacraft-dev-guidelines
#   repository.

jobs:
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]  # CIP-5: nix job (setup-dev-env) → eph-linux-x64
    steps:
      - uses: actions/checkout@v4
      # Mint a GitHub App installation token via the CI Token Provider
      # app.  GitHub free plan restricts org-level secrets with
      # visibility ALL from being readable inside private repos, so we
      # mint per-run tokens from the repo-local CI_TOKEN_PROVIDER_APP_ID
      # + CI_TOKEN_PROVIDER_PRIVATE_KEY secrets.
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          # Keep this closure aligned with .github/sibling-repos plus the
          # flake and CodeTracer submodule inputs reached by setup-dev-env.
          repositories: |
            codetracer
            codetracer-design-system
            codetracer-example-recordings
            codetracer-trace-format
            codetracer-trace-format-nim
            ethereum.nix
            io-mon
            isonim
            isonim-gpui
            isonim-tui
            nim-acp
            nim-agent-harbor
            nim-agents
            nim-chronicles
            nim-confutils
            nim-everywhere
            nim-json-serialization
            nim-pty
            nim-shm-gset
            nim-shm-queue
            nim-stackable-hooks
            nim-termctl
            devops-modules
            repo-workspaces
            reprobuild-ct-test-runner
            reprobuild-packages
            reprobuild-test-adapters
            runquota
            test-certificates-spec
            test-certificates-tools
            tree-sitter-aiken
            tree-sitter-cadence
            tree-sitter-cairo
            tree-sitter-masm
            tree-sitter-move-on-aptos
            tree-sitter-nim
            tree-sitter-sway
            tree-sitter-tolk
            codetracer-native-recorder
          permission-contents: read
      - uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
      # The suite case-count and entry-set gates, ahead of the whole-tree lint.
      #
      # `just lint` runs these same two checks, but only after several minutes
      # of `nim check` over every library and entry point. A stale baseline is
      # the single most common way this job goes red, and both checks are
      # source scans -- so they are asked first, and the failure annotation
      # names this step rather than a lint log.
      #
      # The second check holds the build-free half of
      # benchmarks/reports/reprobuild-suite-m0-inventory.json to the tree. It
      # is here rather than in the Test job on purpose: the Test job builds
      # ~1,450 binaries first and is routinely consumed before it reaches a
      # verdict, which is how that artifact went stale six times.
      #
      # This copy is a convenience, not the gate: it shares this job's fate,
      # and this workflow supersedes its own branch runs. The gate that
      # always reaches a verdict is `suite-case-counts.yml`.
      #
      # FIRST, BUT NOT IN FRONT. These artifacts are bookkeeping: they go
      # stale whenever anyone lands a test without regenerating them, so this
      # step can be red through no fault of the change under test. When it
      # was the only guard on the steps below, a stale baseline SKIPPED them:
      # for five `dev` commits no content lint ran at all (reprobuild-pm issue
      # 2026-10-01). So every audit after it carries `!cancelled()` and runs
      # regardless of this step's outcome; the job still ends red because
      # this step failed. `steps.suite_baseline.outcome != 'skipped'` keeps
      # them from running when the dev env itself never came up, where each
      # would only fail again for the same unrelated reason.
      #
      # The base revision lets the refusal say which stale entries this
      # change introduced and which it inherited (see the script header). A
      # pull request's checkout is the merge commit, so its base is the base
      # branch tip; a push's is the previous tip, all zeros for a new branch.
      # The fetch is best effort: without the commit there is no attribution,
      # and the verdict is the same either way.
      - name: Suite case-count baseline and inventory entry set
        id: suite_baseline
        env:
          ATTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=""
          if [ -n "${ATTRIBUTION_BASE}" ] && [ -n "${ATTRIBUTION_BASE//0/}" ] &&
             git fetch --no-tags --depth=1 origin "${ATTRIBUTION_BASE}"; then
            base="${ATTRIBUTION_BASE}"
          fi
          dev-exec env "SUITE_CASE_COUNTS_BASE=${base}" bash scripts/check_suite_case_counts.sh
      # The vacuous-case gate, for the same reason and at the same point:
      # a source scan that answers in seconds, so it is asked before the
      # multi-minute `nim check` sweep and its failure annotation names
      # this step rather than a lint log. `just lint` runs it too.
      - name: No test case asserts only `check true`
        if: ${{ !cancelled() && steps.suite_baseline.outcome != 'skipped' }}
        run: dev-exec python3 scripts/check_vacuous_test_cases.py
      # Graph-Owned-Test-Artifacts M3, same class of gate: a source scan that
      # refuses a new test compiling a helper program at execution time. Named
      # as its own step so the failure annotation says what is wrong instead of
      # pointing at a lint log.
      - name: No test body compiles a helper program
        if: ${{ !cancelled() && steps.suite_baseline.outcome != 'skipped' }}
        run: dev-exec python3 scripts/check_test_body_helper_compilation.py
      - name: just lint
        if: ${{ !cancelled() && steps.suite_baseline.outcome != 'skipped' }}
        run: dev-exec just lint
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-logs
          path: test-logs/
          if-no-files-found: error
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: test-logs/
          prefix: lint-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  windows-expand-archive-boundary:
    name: Windows expandArchive boundary
    # M3f is an execution-boundary contract, not a cross-compiled unit test.
    # Keeping this as its own required PR job means an unavailable Windows
    # service leaves the gate queued/pending; there is no skip-as-pass branch.
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Check Windows PowerShell bootstrap syntax
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: .\scripts\check_windows_bootstrap_syntax.ps1

      - name: Verify OpenSSL mirror failures and provisioning
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: .\windows\tests\test-openssl-mirrors.ps1

      - name: Verify live pinned OpenSSL mirror downloads
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: .\windows\tests\test-openssl-mirrors-live.ps1

      - name: Verify authenticated local HTTPS redirects and download deadlines
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File {0}
        run: .\windows\tests\test-openssl-redirects.ps1

      - name: Mint installation token for Windows dev environment
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup Windows dev environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        env:
          WINDOWS_DIY_HCR_TESTS: '1'
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Run real PowerShell/filesystem execution-boundary gate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test-bin | Out-Null
          New-Item -ItemType Directory -Force build/nimcache/windows-expand-archive-boundary | Out-Null
          $nimArgs = @(
            'c', '-r',
            '--threads:on',
            '--hints:off',
            '--warnings:off',
            '--nimcache:build/nimcache/windows-expand-archive-boundary',
            '--out:build/test-bin/windows_expand_archive_execution_boundary.exe',
            'tests/windows/windows_expand_archive_execution_boundary.nim'
          )
          & nim @nimArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Windows expandArchive execution-boundary gate failed with exit code $LASTEXITCODE"
          }

      - name: Verify native Windows release DLL staging
        shell: pwsh
        run: |
          nim c -r --threads:on --hints:off --warnings:off --nimcache:build/nimcache/windows-release-dll-staging --out:build/test-bin/windows_release_dll_staging_boundary.exe tests/windows/windows_release_dll_staging_boundary.nim
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release DLL staging boundary failed with exit code $LASTEXITCODE"
          }

      - name: Verify Windows Python provisioning
        shell: pwsh
        run: ./scripts/check_windows_python_provisioning.ps1

      - name: Verify Windows LLVM provisioning
        shell: pwsh
        run: ./scripts/check_windows_llvm_provisioning.ps1

      - name: Measure Windows HCR linked-image publication geometry
        shell: pwsh
        run: |
          python tests/windows/hx_w0_windows_publication_decision_is_recorded_and_measured.py
          if ($LASTEXITCODE -ne 0) {
            throw "HX-W-0 linked-image measurement gate failed with exit code $LASTEXITCODE"
          }

      - name: Build the emitted Windows HCR patchable profile
        shell: pwsh
        run: |
          python tests/windows/hwg_m0_windows_patchable_profile.py
          if ($LASTEXITCODE -ne 0) {
            throw "HWG-M0 Windows patchable-profile gate failed with exit code $LASTEXITCODE"
          }

      - name: Enforce Windows HCR quiescence-only publication
        shell: pwsh
        run: |
          python tests/windows/hx_w1_windows_publication_refuses_or_quiesces_but_never_neither.py
          if ($LASTEXITCODE -ne 0) {
            throw "HX-W-1 publication-serialization gate failed with exit code $LASTEXITCODE"
          }

      - name: Exercise Windows HCR quiescence and resume mapping
        shell: pwsh
        run: |
          python tests/windows/hx_w2_windows_quiescence_holds_and_the_hotpatch_resume_mapping_is_load_bearing.py
          if ($LASTEXITCODE -ne 0) {
            throw "HX-W-2 quiescence gate failed with exit code $LASTEXITCODE"
          }

      - name: Resolve Windows HCR COFF and PE/PDB symbols
        shell: pwsh
        run: |
          python tests/windows/hx_w3_windows_symbol_resolution_and_coff_relocations.py
          if ($LASTEXITCODE -ne 0) {
            throw "HX-W-3 symbol-resolution gate failed with exit code $LASTEXITCODE"
          }

      - name: Register Windows HCR unwind tables and CFG targets
        shell: pwsh
        run: |
          python tests/windows/hx_w4_windows_unwind_and_cfg_registration.py
          if ($LASTEXITCODE -ne 0) {
            throw "HX-W-4 unwind/CFG gate failed with exit code $LASTEXITCODE"
          }

      - name: Inject the Windows HCR agent and complete its handshake
        shell: pwsh
        run: |
          python tests/windows/hx_w5_windows_agent_injection_and_transport.py
          if ($LASTEXITCODE -ne 0) {
            throw "HX-W-5 injection/transport gate failed with exit code $LASTEXITCODE"
          }

      - name: Apply a real Windows HCR PE/COFF patch
        shell: pwsh
        run: |
          python tests/windows/hwg_m1_windows_direct_patch.py
          if ($LASTEXITCODE -ne 0) {
            throw "HWG-M1 Windows direct-patch gate failed with exit code $LASTEXITCODE"
          }

      - name: Resolve Windows HCR patch source lines in WinDbg
        shell: pwsh
        run: |
          python tests/windows/hx_w6_windbg_resolves_source_lines_inside_a_patched_windows_function.py
          if ($LASTEXITCODE -ne 0) {
            throw "HX-W-6 debugger/PDB gate failed with exit code $LASTEXITCODE"
          }

  test:
    name: Test
    # Self-hosted bare-metal Linux runner. Standard ubuntu-latest is
    # too small (4 vCPU / 16 GB) — the parallel nim c phase trips OOM
    # and the test runner hits an fd race at higher concurrency. The
    # metacraft-labs bare-metal pool has nixos hosts with plenty of
    # cores + RAM. Twelve concurrent engine actions avoid the tail stalls
    # observed at sixteen; see the note on REPROBUILD_MAX_PARALLELISM below.
    # EXEMPTION (CIP-5): bare-metal runner — the parallel `nim c` phase OOMs on
    # small ephemeral runners; kept on the persistent big-iron nixos bare-metal
    # pool rather than the eph-linux-x64 class.
    runs-on: [self-hosted, Linux, X64, bare-metal, nixos]
    # THE CEILING AND THE SUITE ARE A CHECKED PAIR. Until 2026-10-18 nothing
    # here set a timeout, so GitHub's 360-minute default ended every run that
    # needed longer -- `cancelled`, read as a verdict on the code, including
    # run 38428391026 whose suite had finished 7m45s earlier. Now every step
    # carries its own `timeout-minutes`, chosen above its worst measured
    # duration; `just test` pins run_tests.sh's backstops so they fire, with
    # their legible messages, before the step limit; and this job limit
    # covers the sum of the steps, so a step limit (after which the
    # `if: always()` steps still upload the logs) fires before it.
    # scripts/check_ci_test_budget.py enforces all of that in `just lint`,
    # against the measurements recorded in it; change a number here and
    # there together. Self-hosted jobs may run up to 7200 minutes; this
    # stays under 24h, the lifetime of the job's GITHUB_TOKEN.
    timeout-minutes: 1425
    env:
      # REPROBUILD_MAX_PARALLELISM governs the BUILD phase. Twelve is not a
      # placeholder and must not be raised to track `nproc`: the bare-metal
      # host reports 32 logical CPUs but runs twelve GitHub Actions runner
      # instances side by side, so `nproc` overstates this job's share of the
      # machine by an order of magnitude. Observed load average on that host
      # while a single Test job builds is already ~28 of 32.
      REPROBUILD_MAX_PARALLELISM: "12"
      # REPROBUILD_TEST_THREADS governs the EXECUTION phase, which is a
      # separate resource profile: test processes spend most of their time
      # waiting on nested builds and subprocesses rather than pinning a core.
      # One thread cannot finish ~10,700 cases in any plausible budget. Eight
      # is the value with evidence behind it: an earlier local run took 2h15m
      # for 6828 cases, and CI run 38428391026 (dev @ 9aaa2a918) ran all
      # 10691 cases in 2h08m25s at eight threads.
      #
      # NB: a value other than eight has not been measured in CI. See the
      # note above the `just test` step.
      REPROBUILD_TEST_THREADS: "8"
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10

      # Mint a GitHub App installation token via the CI Token Provider
      # app for the sibling-repo clones + setup-dev-env below.  See the
      # comment in the `lint` job for the rationale.
      - name: Mint installation token for cross-repo sibling access
        timeout-minutes: 15
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          # setup-dev-env uses the lint closure; the test job also clones the
          # three repositories appended below explicitly.
          #
          # These are EXACT current repository names. The mint does NOT follow
          # the rename redirect that the REST API does, so a renamed entry
          # fails the whole token with a 422 and every later step is skipped,
          # including `just test`.
          # NB: the list is a literal block scalar -- a `#` line inside it is
          # sent as a repository name, not treated as a comment.
          repositories: |
            codetracer
            codetracer-design-system
            codetracer-example-recordings
            codetracer-trace-format
            codetracer-trace-format-nim
            ethereum.nix
            io-mon
            isonim
            isonim-gpui
            isonim-tui
            nim-acp
            nim-agent-harbor
            nim-agents
            nim-chronicles
            nim-confutils
            nim-everywhere
            nim-json-serialization
            nim-pty
            nim-shm-gset
            nim-shm-queue
            nim-stackable-hooks
            nim-termctl
            devops-modules
            repo-workspaces
            reprobuild-ct-test-runner
            reprobuild-packages
            reprobuild-test-adapters
            runquota
            test-certificates-spec
            test-certificates-tools
            tree-sitter-aiken
            tree-sitter-cadence
            tree-sitter-cairo
            tree-sitter-masm
            tree-sitter-move-on-aptos
            tree-sitter-nim
            tree-sitter-sway
            tree-sitter-tolk
            codetracer-native-recorder
            reprobuild-cmake
            reprobuild-examples
            gosti
            codetracer-native-backend
            codetracer-visual-replay
          permission-contents: read

      # Sibling clones: setup-dev-env clones the CodeTracer sibling declared in
      # .github/sibling-repos, and scripts/run_tests.sh builds ../runquota.
      # Local clones let CI pick up sibling changes without waiting for a
      # flake.lock bump.
      - name: Clone runquota sibling
        timeout-minutes: 10
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          # runquota's mainline is ``dev`` (its default branch); ``main`` is
          # stale and lacks the b0 config.nims closure fix + the forking-lease
          # completion fix the reprobuild b0 / cmake-develop tests depend on.
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}

      # reprobuild-cmake is the CMake fork carrying the Reprobuild
      # generator. The cmake-develop e2e tests (tests/e2e/cmake-develop/)
      # hard-require its built ``cmake`` binary (no graceful skip), so the
      # test job must clone it and scripts/run_tests.sh builds it as a
      # prerequisite. Pinned to the ``reprobuild`` branch (the fork).
      - name: Clone reprobuild-cmake sibling
        timeout-minutes: 10
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/reprobuild-cmake
          ref: reprobuild
          path: ${{ github.workspace }}/../reprobuild-cmake
          gh-token: ${{ steps.ci_token.outputs.token }}

      # reprobuild-examples carries the canonical M71 reference home.nim
      # under m71-home-profile-walkthrough/ + a number of hello-binary
      # fixtures (haskell-cabal, crystal-shards, nim/mode3-pilot, …) that
      # several library / e2e tests assert against by walking up to the
      # metacraft root and then into ../reprobuild-examples. Without this
      # clone, the M71 reference-home check fails at runtime because the
      # path baked in via currentSourcePath() at compile time points at
      # a non-existent file on the CI runner.
      - name: Clone reprobuild-examples sibling
        timeout-minutes: 10
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/reprobuild-examples
          ref: dev
          path: ${{ github.workspace }}/../reprobuild-examples
          gh-token: ${{ steps.ci_token.outputs.token }}

      # The `ct-mcr` recorder bundle (`.#test-cross-repo-fixtures` edge
      # `reprobuild.test_fixtures.hcr_ct_mcr_bundle`, which
      # e2e_hcr_linux_replay_of_patched_recording records and replays with)
      # is built by the recorder's own `just build-ct-mcr`. Its licensing
      # prerequisite builds `ct_license_ffi` in ../codetracer-native-backend,
      # and ct_cli imports ../codetracer-visual-replay; the recorder,
      # codetracer, codetracer-trace-format and codetracer-trace-format-nim
      # already come from .github/sibling-repos. Cloned here rather than added
      # to sibling-repos because only this job builds that collection.
      - name: Clone codetracer-native-backend sibling
        timeout-minutes: 10
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-backend
          ref: dev
          path: ${{ github.workspace }}/../codetracer-native-backend
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-visual-replay sibling
        timeout-minutes: 10
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-visual-replay
          ref: dev
          path: ${{ github.workspace }}/../codetracer-visual-replay
          gh-token: ${{ steps.ci_token.outputs.token }}

      # gosti ships the ``gosti`` library that the ReproOS
      # R2 / R9 boot integration tests import unconditionally at the
      # top of the file.  ``addPackagePath("GOSTI_SRC", …)`` in
      # ``config.nims`` falls back to ``../gosti/src`` when the
      # env var isn't set, so a sibling clone is all the test runner
      # needs.  Without this clone, ``tests/integration/t_r2_iso_boot.
      # nim`` and ``tests/integration/t_r9_systemd_boot.nim`` fail at
      # the ``import gosti`` line and ``repro build
      # .#test-builds`` surfaces ``Error: cannot open file: gosti``
      # long before the ``when not defined(windows): quit(0)`` skip
      # block can run.  The tests still skip at runtime on Linux /
      # macOS because the Hyper-V backend they exercise is Windows-
      # only.
      - name: Clone gosti sibling
        timeout-minutes: 10
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          # The PATH is ../gosti because that is what `config.nims` falls
          # back to (see above).
          repo: metacraft-labs/gosti
          ref: dev
          path: ${{ github.workspace }}/../gosti
          gh-token: ${{ steps.ci_token.outputs.token }}

      # metacraft-github-actions hosts the shared CI composite actions. Two of
      # them (``reprobuild-provision``, ``setup-reprobuild``) used to live in
      # THIS repo under ``.github/actions/``; they were moved out because
      # GitHub materialises a composite action by downloading its WHOLE
      # repository, so any consumer that referenced one had to pull this repo's
      # ~546 MB archive during ``Set up job``, against the runner's fixed
      # 100-second per-action timeout — which the Windows lane could not
      # sustain and which failed before its first step.
      #
      # ``tests/e2e/codetracer-subset/`` asserts a contract on
      # ``reprobuild-provision``'s action.yml (that it provisions the CodeTracer
      # Nim gitlinks the subset build needs), so it now reads that file from
      # this sibling. The assertion raises ``MissingTestFixtureError`` rather
      # than skipping when the checkout is absent, so without this clone the
      # test fails loudly instead of silently asserting nothing.
      - name: Clone metacraft-github-actions sibling
        timeout-minutes: 10
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/metacraft-github-actions
          ref: dev
          path: ${{ github.workspace }}/../metacraft-github-actions
          gh-token: ${{ steps.ci_token.outputs.token }}

      # codetracer's .envrc loads its flake-override direnv plugin from a
      # ``../direnv-nix-flake-overrides`` sibling when present, and only falls
      # back to a hash-pinned URL otherwise. That URL pin has drifted, so the
      # fallback fails (``flake_override_args_quoted: command not found``) and
      # breaks the ``direnv exec`` that drives the ct build below. Clone the
      # (public) plugin repo next to codetracer so the preferred sibling path is
      # taken. Not a metacraft-labs repo, and public, so clone it directly.
      - name: Clone direnv-nix-flake-overrides sibling (codetracer .envrc plugin)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dest="${{ github.workspace }}/../direnv-nix-flake-overrides"
          rm -rf "$dest"
          git clone --depth 1 \
            https://github.com/blocksense-network/direnv-nix-flake-overrides.git \
            "$dest"

      - name: Set up the dev environment
        timeout-minutes: 30
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          flake-override-inputs: |
            runquota-src=../runquota

      # Installation tokens expire after one hour. Mint replacements immediately
      # before each long phase and expose them only to that step environment and
      # its descendants. The bootstrap needs only the private native-recorder
      # flake input; public GitHub fetches continue to use github.token.
      - name: Refresh installation token for Reprobuild bootstrap
        timeout-minutes: 15
        id: ci_token_bootstrap
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: codetracer-native-recorder
          permission-contents: read

      - name: Bootstrap Reprobuild
        timeout-minutes: 150
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.ci_token_bootstrap.outputs.token }}@github.com/metacraft-labs/codetracer-native-recorder.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/metacraft-labs/codetracer-native-recorder
          NIX_CONFIG: >-
            access-tokens = github.com=${{ github.token }}
            github.com/metacraft-labs/codetracer-native-recorder=${{ steps.ci_token_bootstrap.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p test-logs
          # Keep evidence even when dev-exec fails before just creates its log.
          # Use a separate file: just bootstrap owns test-logs/bootstrap.log.
          {
            repro_root="${{ github.workspace }}"
            repro_bin="$repro_root/build/bin/repro"
            # Materialise reprobuild's own `repro` binary (idempotent bootstrap).
            dev-exec just bootstrap
            # The bootstrapped `repro` carries bare dlopen()s for its runtime
            # libraries (libclingo.so is lazy; libzstd.so.1 loads at module init for
            # the binary-cache client) because build_apps.sh strips rpath per the
            # .rodata-bake guard, relying on a runtime LD_LIBRARY_PATH. The build below
            # runs it inside CODETRACER's dev shell, which does not carry those libs,
            # so bake reprobuild's own dev-shell library dirs into repro's RPATH.
            # Mirrors the flake's zstd DT_RPATH postFixup for the package build.
            repro_ld="$(dev-exec sh -c 'printf %s "${LD_LIBRARY_PATH:-}"')"
            echo "ct-build: reprobuild dev-shell lib dirs = ${repro_ld:-<EMPTY>}"
            if [ -n "$repro_ld" ]; then
              # `repro build ct` self-spawns a repro-daemon and other helper
              # binaries; patch every bootstrapped binary, not just `repro`.
              for b in "$repro_root"/build/bin/*; do
                [ -f "$b" ] && dev-exec patchelf --print-rpath "$b" >/dev/null 2>&1 || continue
                cur_rpath="$(dev-exec patchelf --print-rpath "$b" 2>/dev/null || true)"
                dev-exec patchelf --force-rpath --set-rpath "${cur_rpath:+$cur_rpath:}$repro_ld" "$b" \
                  || echo "ct-build: patchelf failed for $b"
              done
              echo "ct-build: repro RPATH now = $(dev-exec patchelf --print-rpath "$repro_bin" 2>/dev/null)"
            else
              echo "ct-build: WARNING dev-shell LD_LIBRARY_PATH empty; cannot bake RPATH" >&2
            fi
          } 2>&1 | tee test-logs/ci-bootstrap.log

      # Reconcile CodeTracer's lock-pinned source siblings, after preparing
      # the freshly bootstrapped binaries.
      #
      # WHICH REPOSITORIES, AND WHY SOME ARE PRIVATE. `develop --all` clones
      # every `coord_kind = "vcs"` dep of CodeTracer's committed repro.lock.
      # That set is NOT anonymously cloneable, and nothing promises it is:
      # reprobuild-pm/spec/Unified-Locking-And-Hooks.md §14.1 makes the
      # committed lock the default home of every develop-set sibling, and a
      # lock entry's `visibility = "public"` names the configuration TIER that
      # declared it, never who can read it on its forge. CodeTracer's lock
      # names forge-private repos (codetracer-launcher, -native-backend,
      # -native-recorder, -test-mirror, -visual-replay) marked "public", and
      # the anonymous clone failed with `could not read Username`. So the step
      # carries a credential, minted for exactly the set the lock names: the
      # next two steps derive the list from the lock itself (ignoring
      # `visibility`) and mint a read-only installation token for it.
      - name: List the repositories CodeTracer's lock clones
        timeout-minutes: 10
        id: ct_lock_repos
        run: |
          set -euo pipefail
          ct_root="$(cd "${{ github.workspace }}/../codetracer" && pwd)"
          # Fails loudly on a missing or unparseable lock, or on an empty set
          # (an empty `repositories:` would mint an all-repositories token).
          # Deps under other owners are reported on stderr: they are cloned
          # without a credential.
          repos="$(dev-exec python3 scripts/ci_lock_source_credentials.py repositories \
            --lock "$ct_root/repro.lock" --owner metacraft-labs)"
          printf '%s\n' "$repos"
          delim="ct_lock_repos_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "repositories<<$delim"
            printf '%s\n' "$repos"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Installation tokens expire after one hour and the job-wide `ci_token`
      # was minted at job start, so mint this one immediately before the
      # clones that use it.
      - name: Refresh installation token for CodeTracer source dependencies
        timeout-minutes: 15
        id: ci_token_reconcile
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: ${{ steps.ct_lock_repos.outputs.repositories }}
          permission-contents: read

      # WHAT THE MASKING GUARDS AGAINST. These runners are self-hosted and
      # reused: their HOME, global git config and workspace outlive the job.
      # The setup action's persistent credential (a global helper or a broad
      # `url.<token>@github.com/.insteadOf`) would hand this phase an
      # org-wide token for every github.com URL. A token carried in a URL is
      # also exposed beyond the request: a rewrite puts it into the argv of
      # every `git-remote-https`, readable by any process on the host, and a
      # token in a clone URL is written into that clone's `.git/config`, in a
      # workspace that outlives the job. So global and system configuration
      # stay masked (/dev/null, NOSYSTEM, no prompts), and the only credential
      # this phase sees is the scoped, freshly minted token above, as an
      # `http.<repo-url>/.extraHeader` per lock repository in a 0600 file
      # under $RUNNER_TEMP that is deleted when the step exits. The header is
      # sent on the wire and never persisted into a clone, and git matches it
      # by slash-delimited path prefix, so it reaches only those repositories.
      #
      # WHY GIT_CONFIG_GLOBAL AND NOT GIT_CONFIG_COUNT. The engine runs its git
      # actions with `scrubbedGitRepositoryEnv()`
      # (libs/repro_workspace_vcs/src/git_tool.nim, GitRepositoryLocalEnv and
      # GitRepositoryLocalEnvPrefixes), which drops GIT_CONFIG_COUNT /
      # GIT_CONFIG_KEY_* / GIT_CONFIG_VALUE_*. The mechanism the ct build step
      # below uses would therefore never reach `develop`'s clones;
      # GIT_CONFIG_GLOBAL is not scrubbed. It is exported only inside the
      # subshell that runs `develop`, so the local-config cleanup keeps the
      # masked /dev/null.
      - name: Reconcile CodeTracer source dependencies
        timeout-minutes: 30
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GH_TOKEN: ${{ steps.ci_token_reconcile.outputs.token }}
        run: |
          set -euo pipefail
          repro_root="${{ github.workspace }}"
          repro_bin="$repro_root/build/bin/repro"
          ct_root="$(cd "$repro_root/../codetracer" && pwd)"
          test -x "$repro_bin" || { echo "repro not bootstrapped at $repro_bin" >&2; exit 1; }
          # setup-dev-env's inherited checkout token may leave a broad rewrite
          # in CodeTracer's local config. Remove that exact entry silently and
          # restore the canonical origin before syncing submodule URLs, so the
          # job-wide token is not what `develop` (or anything after it)
          # authenticates with.
          git -C "$ct_root" config --local --unset-all \
            "url.https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/.insteadOf" \
            >/dev/null 2>&1 || true
          if git -C "$ct_root" remote get-url origin >/dev/null 2>&1; then
            git -C "$ct_root" remote set-url origin \
              https://github.com/metacraft-labs/codetracer.git
          fi
          git -C "$ct_root" submodule sync --recursive
          # The scoped credential (see the comment above this step). mktemp -d
          # gives a fresh 0700 directory; the script creates the file inside
          # it exclusively with mode 0600, and the trap removes both on every
          # exit path. --emit-actions-mask masks the header's base64 form,
          # which GitHub does not mask on its own.
          git_auth_dir="$(mktemp -d "$RUNNER_TEMP/ct-lock-git-auth.XXXXXX")"
          trap 'rm -rf "$git_auth_dir"' EXIT
          git_auth_config="$git_auth_dir/gitconfig"
          dev-exec python3 scripts/ci_lock_source_credentials.py gitconfig \
            --lock "$ct_root/repro.lock" --owner metacraft-labs \
            --out "$git_auth_config" --emit-actions-mask
          # The file now holds the credential; nothing below needs it in the
          # environment, so do not hand it to every descendant of `develop`.
          unset GH_TOKEN
          # L2 (CI-PROVISION-FROM-LOCK): provision codetracer's dependency
          # siblings FROM THE LOCK, not from a hard-coded name list. codetracer
          # ships a committed `repro.lock` enumerating its from-source deps at
          # pinned revisions -- isonim, the nim-* libs it `uses:`, and the
          # codetracer-* repos, several of them forge-private (see the comment
          # above this step) -- and a single `repro develop --all` resolves
          # that set over the solved graph and records the develop-mode
          # override map so reprobuild splices each sibling's Nim source into
          # the ct consumer graph. The sibling checkouts already sit adjacent
          # to $ct_root (cloned by setup-dev-env from reprobuild's
          # .github/sibling-repos), so `develop --all` ADOPTS them in place
          # when they match the locked revision; --into=<siblings> names that
          # adjacency explicitly. Fails loud if the lock is missing.
          #
          # --reset: the siblings were pre-cloned by clone-siblings at their
          # `=dev` BRANCH TIPS, which in general differ from the revisions
          # codetracer's committed repro.lock pins. Without --reset, `develop
          # --all` REFUSES to overwrite a checkout that drifted off the lock
          # (the fleet-safe default). --reset makes `develop --all` reconcile
          # each drifted sibling back to its locked revision (re-clone + hard
          # reset at the locked SHA) so the ct build consumes the EXACT
          # lock-pinned sources, not the moving `=dev` tips. This is the crux
          # that keeps this step green as the sibling `dev` tips advance.
          siblings_root="$(cd "$ct_root/.." && pwd)"
          ( cd "$ct_root" && export GIT_CONFIG_GLOBAL="$git_auth_config" && \
            "$repro_bin" develop --all --reset --into="$siblings_root" )

      # CodeTracer's Nix graph reads native-recorder, while its submodule graph
      # also reads tree-sitter-nim. Mint exactly that repository set immediately
      # before entering CodeTracer's direnv environment.
      - name: Refresh installation token for the CodeTracer build
        timeout-minutes: 15
        id: ci_token_build
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: |
            codetracer-native-recorder
            tree-sitter-nim
          permission-contents: read

      # Build codetracer's `ct` binary that the ct_incremental_adapter execs
      # (`ct test --incremental --watch-decide|--watch-record`; resolved from
      # $CT_BIN). We build ONLY the `ct` target with reprobuild itself —
      # codetracer ships a `reprobuild.nim` recipe and its build-once.sh drives
      # `repro build <target>` (target from CODETRACER_REPROBUILD_TARGET), so
      # this avoids tup/FUSE and the full-product frontend build, and the
      # reprobuild content-addressed cache (persistent /nix/store + repro's own
      # cache on the self-hosted runners) makes rebuilds fast once warm.
      - name: Build codetracer ct (via reprobuild)
        timeout-minutes: 190
        env:
          # This prerequisite must exercise this job's freshly built engine;
          # a pre-existing host daemon can carry another source/runtime closure.
          REPRO_DAEMON: 'off'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.ci_token_build.outputs.token }}@github.com/metacraft-labs/codetracer-native-recorder.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/metacraft-labs/codetracer-native-recorder
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ steps.ci_token_build.outputs.token }}@github.com/metacraft-labs/tree-sitter-nim.git.insteadOf
          GIT_CONFIG_VALUE_1: https://github.com/metacraft-labs/tree-sitter-nim.git
          NIX_CONFIG: >-
            access-tokens = github.com=${{ github.token }}
            github.com/metacraft-labs/codetracer-native-recorder=${{ steps.ci_token_build.outputs.token }}
          REPRO_PUBLISH_KEY: ${{ secrets.REPRO_PUBLISH_KEY }}
          REPRO_PUBLISH_CERT: ${{ secrets.REPRO_PUBLISH_CERT }}
        run: |
          set -euo pipefail
          repro_root="${{ github.workspace }}"
          ct_root="$(cd "$repro_root/../codetracer" && pwd)"
          # R4: when a CI publisher key is configured (repo/org secret), publish
          # the `repro build` action outputs to the fleet binary cache so other
          # machines get cache hits. Fork PRs receive no secrets -> the vars stay
          # empty -> reprobuild's engine publisher stays disabled (no publish).
          if [ -n "${REPRO_PUBLISH_KEY:-}" ] && [ -n "${REPRO_PUBLISH_CERT:-}" ]; then
            umask 077
            printf '%s' "$REPRO_PUBLISH_KEY" > "$RUNNER_TEMP/repro-publish.key"
            printf '%s' "$REPRO_PUBLISH_CERT" > "$RUNNER_TEMP/repro-publish.cert"
            export REPRO_BINARY_CACHE_URL="https://repro-cache.metacraft-labs.com"
            export REPRO_BINARY_CACHE_KEY_PATH="$RUNNER_TEMP/repro-publish.key"
            export REPRO_BINARY_CACHE_CERT_PATH="$RUNNER_TEMP/repro-publish.cert"
            echo "ct-build: repro binary-cache publish ENABLED -> $REPRO_BINARY_CACHE_URL"
          else
            echo "ct-build: no REPRO_PUBLISH_KEY; binary-cache publish disabled"
          fi
          repro_bin="$repro_root/build/bin/repro"
          # Build only the `ct` target via codetracer's reprobuild.nim recipe.
          #    build-once.sh's reprobuild path (CODETRACER_REPROBUILD_LINUX=1)
          #    runs `repro build "$CODETRACER_REPROBUILD_TARGET"`; codetracer's
          #    toolchain comes from its dev shell (direnv).
          direnv allow "$ct_root"
          # Keep the build's own output, and on a derivation failure keep that
          # derivation's BUILDER log too. Without this the step reports only
          # `error: Cannot build '<drv>'` -- nix buffers the builder's stdout
          # and nothing here asks for it -- so a failure names the derivation
          # and hides the error inside it. Step 15 already tees its output;
          # this is the same thing one step later.
          mkdir -p "$repro_root/test-logs"
          ct_build_log="$repro_root/test-logs/ct-build.log"
          set +e
          ( cd "$ct_root" && \
            CODETRACER_REPROBUILD_LINUX=1 \
            CODETRACER_REPROBUILD_TARGET=ct \
            CODETRACER_REPROBUILD_REPO_PATH="$repro_root" \
            REPROBUILD_NIX_DAEMON_BIN="$repro_root/tools/reprobuild-nix-daemon/reprobuild-nix-daemon" \
            REPROBUILD_BIN="$repro_bin" \
            REPRO_BINARY_CACHE_URL="${REPRO_BINARY_CACHE_URL:-}" \
            REPRO_BINARY_CACHE_KEY_PATH="${REPRO_BINARY_CACHE_KEY_PATH:-}" \
            REPRO_BINARY_CACHE_CERT_PATH="${REPRO_BINARY_CACHE_CERT_PATH:-}" \
            direnv exec "$ct_root" just build-once ) 2>&1 | tee "$ct_build_log"
          ct_build_rc=${PIPESTATUS[0]}
          set -e
          if [ "$ct_build_rc" -ne 0 ]; then
            grep -oE "/nix/store/[a-z0-9]+-[^']+\\.drv" "$ct_build_log" \
              | sort -u \
              | while read -r drv; do
                  echo "=== nix log $drv ==="
                  nix log "$drv" 2>&1 \
                    | tee "$repro_root/test-logs/drv-$(basename "$drv" .drv).log" \
                    | tail -80
                done
            exit "$ct_build_rc"
          fi
          ct_bin="$ct_root/src/build-debug-repro/bin/ct"
          test -x "$ct_bin" || { echo "ct not built at $ct_bin" >&2; exit 1; }
          echo "CT_BIN=$ct_bin" >> "$GITHUB_ENV"

      - name: Refresh installation token for tests
        timeout-minutes: 15
        id: ci_token_test
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          # codetracer-rr (a private flake input of the recorder's dev shell)
          # and lldb-sys.rs (a private cargo git dependency of the backend's
          # `ct_license_ffi`) are fetched while `.#test-cross-repo-fixtures`
          # builds the `ct-mcr` bundle for
          # e2e_hcr_linux_replay_of_patched_recording.
          repositories: |
            codetracer-native-recorder
            codetracer-rr
            lldb-sys.rs
          permission-contents: read

      # BUDGET NOTE (rewritten 2026-10-18 against runs 38428391026 and
      # 36583430437; the note it replaces was measured on 31716928161 and
      # 31724249825 at 910cb956, and later runs had falsified it).
      #
      # The suite RUNS TO A VERDICT in CI. Run 38428391026 (dev @ 9aaa2a918,
      # Test job 115403755907):
      #
      #   Bootstrap Reprobuild                     16m25s
      #   Build codetracer ct                      25m14s
      #   just test: start -> runner summary       5h03m28s
      #     of which the test runner               2h08m25s  (all 10691 cases:
      #                                             pass=10280 fail=105 skip=306)
      #   just test: runner summary -> killed      7m45s, no output at all
      #
      # The verdict landed 7m45s before GitHub's 360-minute default ended the
      # step, and the run was recorded `cancelled` -- a red result on 105
      # failing cases, reported as a timeout. The silent tail is most likely the
      # Python phase (run_tests.sh runs the `tests/**/test_*.py` modules after
      # the runner, and unittest's progress dots carry no newline, so the log
      # shows nothing); that is inferred from the script's order, not measured.
      #
      # Run 36583430437 (on the slower host class) is the other
      # bound: the 1759-action `.#test-builds` graph took 4h08m51s and the whole
      # build phase 4h27m37s; the runner then reached 1697 of 10605 cases in
      # 51m06s and estimated 4h28m15s more before the ceiling killed it.
      #
      # THE BUILD PHASE GOT LONGER WHEN ITS COMPILES BECAME CACHEABLE. The
      # 3h46m measured on 31716928161 was attributed to the test compiles being
      # declared `cacheable = false`. 1cb62e84 (2026-08-20) removed that
      # argument from the `buildNimUnittest.build` edges: `build` for
      # `BuildNimUnittest` (libs/ct_test_nim_unittest) now defaults to
      # `cacheable = true`, which `compileDependencyPolicy` maps to the
      # automatic monitor policy. The phase then measured 4h08m on
      # 36583430437, not less. Why the runners' persistent cache does not turn
      # that into cross-run hits is an open question; the flag was not the
      # cause.
      #
      # WHAT BOUNDS THIS STEP. Its `timeout-minutes` covers
      # REPROBUILD_BUILD_TIMEOUT + REPROBUILD_RUNNER_TIMEOUT (pinned in `env:`
      # below) plus an allowance for the rest of `just test` -- prerequisite
      # sibling builds (reprobuild-cmake alone took 1h08m45s on 36590087746),
      # the smaller collections, the Python phase. So run_tests.sh's own
      # backstops fire first, with their legible messages ("Timed out building
      # ... the build did NOT fail"; a runner summary marked cut_short), then
      # this step's limit, then the job's -- never GitHub's silent default.
      # The backstops are sized to the slower class: 5h over the 4h08m graph,
      # 330m over the runner's 5h19m projection. scripts/check_ci_test_budget.py
      # holds these numbers to each other and to the measurements in it. The
      # "Declare suite coverage" step after this one then states, from the
      # runner's summary, whether the run is a verdict or a partial run.
      #
      # RUNNER-CLASS NOTE (measured before 2026-09-09). `runs-on` selects a
      # POOL, and the host classes in it are not interchangeable for this job.
      # Measured then over the last 60 CI runs, by the runner that picked up
      # the Test job:
      #
      #   gpu-server-002-*   every run that reached the END of the suite --
      #                      build phase plus Nim execution, terminating on
      #                      real per-case failures rather than on a clock --
      #                      was on this class: 1h55m, 1h56m, 1h57m, 2h10m.
      #   high-mem-server-*  not once. Two runs (31542890603, 31542884617)
      #                      died on "Timed out building .#test-builds after
      #                      4h" at 917/1212 and 934/1212. Four more were
      #                      killed at exactly 6h00m, GitHub's per-job
      #                      ceiling, one of them with the build phase still
      #                      at 446/1237. The runs that did finish building
      #                      then spent 3h32m-5h55m and failed in the Python
      #                      inventory, including once on a
      #                      CatalogEnvironmentError.
      #
      #   gpu-server-001-*   between the two: ~1h04m typical, 4h01m/4h51m at
      #                      worst.
      #
      # CORRECTION, 2026-09-09. That CatalogEnvironmentError was read above as
      # "host contention reported as such, which is itself a symptom of the
      # class rather than of the suite". The second half of that is wrong, and
      # believing it cost real time: the suite carried a defect that produces
      # exactly this signature no matter which host class runs it.
      #
      # `libs/repro_cli_support/tests/`
      # `t_develop_override_records_the_identity_it_replaced.nim` built its
      # scenarios at MODULE scope, and building one runs the real
      # `repro develop` verb. The Python inventory phase enumerates every
      # binary's case catalog by executing it with `--list-json`, which runs
      # module-level code -- so the probe ran the verb, the verb reached a
      # monitored helper edge, and the engine spawned the image named by
      # `getAppFilename()`, which in a TEST binary is the test binary itself.
      # It has no `__repro-extract-interface` dispatcher, so the child re-ran
      # module init and spawned the next generation. Measured locally: 154
      # live generations in 20 s, host load 829, ~900 processes.
      #
      # That is a fork bomb inside the probe. It makes its OWN host contention,
      # so the contention is evidence for the suite and not against it. The
      # probe then times out, `timeout` is in ENVIRONMENTAL_QUARANTINE_REASONS,
      # the serial retry pays 3600 s and bombs again, and the phase aborts with
      # CatalogEnvironmentError -- with every other still-running probe on the
      # box slowed enough to look marginal too.
      #
      # The per-class timing table above is unaffected and still stands. What
      # does not survive is the inference that an inventory-phase environmental
      # abort could be attributed to the runner class without first ruling this
      # out; the suite reached the Nim execution phase on `gpu-server-002-*`
      # because those hosts absorbed the storm, not because they were free of
      # it. Diagnose a future CatalogEnvironmentError by asking WHICH binary
      # the probe was on and whether it self-spawns, before asking which host
      # picked the job up.
      #
      # The class gap is why the budgets here follow the slower class's
      # numbers (36583430437) rather than the faster one's (38428391026).
      # Narrowing `runs-on` to the faster class is a fleet-capacity decision,
      # not a workflow edit, and is documented here rather than acted on.
      - name: just test
        id: just_test
        timeout-minutes: 750
        env:
          # run_tests.sh's backstops, pinned so that they fire before this
          # step's limit (see WHAT BOUNDS THIS STEP above). coreutils
          # `timeout` durations: a single number and suffix, so 330m, not
          # 5h30m. The build one applies to each collection build in turn.
          REPROBUILD_BUILD_TIMEOUT: "5h"
          REPROBUILD_RUNNER_TIMEOUT: "330m"
          CT_BIN: ${{ env.CT_BIN }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          # The second rewrite, and cargo fetching through the git CLI so that
          # it honours these GIT_CONFIG_* rewrites at all, serve the `ct-mcr`
          # bundle edge (scripts/build_hcr_ct_mcr_fixture.sh forwards exactly
          # these variables into the recorder's otherwise cleared shell).
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.ci_token_test.outputs.token }}@github.com/metacraft-labs/codetracer-native-recorder.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/metacraft-labs/codetracer-native-recorder
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ steps.ci_token_test.outputs.token }}@github.com/metacraft-labs/lldb-sys.rs.insteadOf
          GIT_CONFIG_VALUE_1: https://github.com/metacraft-labs/lldb-sys.rs
          NIX_CONFIG: >-
            access-tokens = github.com=${{ github.token }}
            github.com/metacraft-labs/codetracer-native-recorder=${{ steps.ci_token_test.outputs.token }}
            github.com/metacraft-labs/codetracer-rr=${{ steps.ci_token_test.outputs.token }}
        run: dev-exec just test
      # Say, where the conclusion is read, whether this run is a VERDICT on the
      # code or a partial run. A `cancelled` or truncated run used to look like
      # a result; scripts/ci_suite_coverage.py reads the runner's summary,
      # run_tests.sh's end-of-script marker (written only once its Python
      # phase is done, so a step killed after the Nim verdict is still
      # PARTIAL) and the `just test` outcome, and prints COMPLETE or PARTIAL
      # as an annotation and in the step summary. It always exits 0 and is
      # continue-on-error besides: the `just test` step's own status is the
      # gate, and this step must never change the job's conclusion. Runs even
      # when an earlier step failed (outcome `skipped`), and falls back to a
      # bare python3 when setup-dev-env never provided dev-exec.
      - name: Declare suite coverage
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        env:
          JUST_TEST_OUTCOME: ${{ steps.just_test.outcome }}
        run: |
          set -uo pipefail
          args=(scripts/ci_suite_coverage.py
                --summary test-logs/parallel-run.json
                --finished-marker test-logs/suite-finished.json
                --outcome "$JUST_TEST_OUTCOME"
                --step-summary "$GITHUB_STEP_SUMMARY")
          if command -v dev-exec >/dev/null 2>&1; then
            dev-exec python3 "${args[@]}"
          elif command -v python3 >/dev/null 2>&1; then
            python3 "${args[@]}"
          else
            echo "::warning title=Suite coverage::PARTIAL: neither dev-exec nor python3 is available to read the runner summary -- this job's conclusion is NOT known to be a verdict on the code"
          fi
      # RunQuota daemon diagnostics, collected whether or not anything
      # failed.
      #
      # The `ct` build and a good part of the e2e suite each start their
      # own `runquotad`, and a daemon that refuses to start says WHY in
      # `.repro/runquota/runquotad.log` and nowhere else -- the caller
      # only ever prints "runquotad exited before becoming ready. See
      # <log>". Those logs sit in the working directory of whichever
      # tree started the daemon (this repo, and CodeTracer's checkout
      # next door), and neither is `test-logs/`, so the job used to
      # discard the one file that explained its own failure and leave a
      # red run with no diagnosis in it at all. Fold them into the
      # existing artifact rather than adding a second one.
      #
      # Regular files only, and bounded: the same directory can hold
      # daemon state (sqlite stores, sockets) that is neither small nor
      # copyable.
      - name: Collect runquotad diagnostics
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          dest="${{ github.workspace }}/test-logs/runquota"
          mkdir -p "$dest"
          for root in "${{ github.workspace }}" "${{ github.workspace }}/../codetracer"; do
            [ -d "$root/.repro/runquota" ] || continue
            name="$(basename "$(cd "$root" && pwd)")"
            mkdir -p "$dest/$name"
            find "$root/.repro/runquota" -maxdepth 1 -type f -size -8M \
              -exec cp {} "$dest/$name/" \; || true
          done
          echo "collected runquotad diagnostics:"
          find "$dest" -type f -printf '  %p (%s bytes)\n' || true
      - name: Upload logs
        timeout-minutes: 15
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/
          if-no-files-found: error
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        timeout-minutes: 50
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: test-logs/
          prefix: test-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

  nix-build:
    name: Nix Build
    runs-on: [self-hosted, linux, x64]  # CIP-5: nix job (setup-dev-env) → eph-linux-x64
    steps:
      - uses: actions/checkout@v4
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          # Keep this closure aligned with the lint setup-dev-env closure.
          repositories: |
            codetracer
            codetracer-design-system
            codetracer-example-recordings
            codetracer-trace-format
            codetracer-trace-format-nim
            ethereum.nix
            io-mon
            isonim
            isonim-gpui
            isonim-tui
            nim-acp
            nim-agent-harbor
            nim-agents
            nim-chronicles
            nim-confutils
            nim-everywhere
            nim-json-serialization
            nim-pty
            nim-shm-gset
            nim-shm-queue
            nim-stackable-hooks
            nim-termctl
            devops-modules
            repo-workspaces
            reprobuild-ct-test-runner
            reprobuild-packages
            reprobuild-test-adapters
            runquota
            test-certificates-spec
            test-certificates-tools
            tree-sitter-aiken
            tree-sitter-cadence
            tree-sitter-cairo
            tree-sitter-masm
            tree-sitter-move-on-aptos
            tree-sitter-nim
            tree-sitter-sway
            tree-sitter-tolk
            codetracer-native-recorder
          permission-contents: read
      - uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
      - name: Verify committed Nix inputs
        run: |
          git diff --exit-code -- flake.lock
          dev-exec nix flake metadata --no-update-lock-file --json > /dev/null
      - name: Check the trace-format pin against CodeTracer's lock
        # Decided at evaluation time, so it builds nothing: it fails when
        # ``ct-trace-format-src`` is not the revision the pinned
        # ``codetracer-src``'s ``repro.lock`` names (see the check in
        # flake.nix). Nothing else would run it -- CI builds only
        # ``.#default``, not ``checks.*``.
        run: |
          system="$(dev-exec nix eval --impure --raw --expr builtins.currentSystem)"
          dev-exec nix build --no-update-lock-file --no-link \
            ".#checks.${system}.ct-trace-format-pin-coherence"
      - name: nix build
        # ``--log-lines 200`` widens nix's failure tail from its default 25.
        # Twenty-five lines is not enough to see WHICH entrypoint's ``nim c``
        # failed or why: ``scripts/build_apps.sh`` keeps going after a failed
        # entrypoint and reports the failures at the very end, so the tail
        # shows a LATER entrypoint's successful link and the one-line summary,
        # with the actual compiler diagnostic scrolled off. A reader then
        # cannot tell a source regression from a transient builder failure
        # without reproducing the whole derivation by hand. The flag costs
        # nothing on success (nix prints the tail only when a build fails).
        run: dev-exec nix build --no-update-lock-file --log-lines 200 .#default
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: test-logs/
          retention-days: 1
      - name: Mirror logs to S3 (non-blocking)
        if: always()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: test-logs/
          prefix: build-logs/${{ github.run_id }}
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
