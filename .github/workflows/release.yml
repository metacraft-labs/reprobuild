name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# Release shape: build everything, THEN publish once, atomically.
#
# History this structure exists to prevent. Every release to date shipped a
# different subset of platforms, and no release ever carried all of them:
#
#   v0.1.0  darwin-aarch64 + linux-x86_64   (no windows)
#   v0.1.1  draft, holding a stray v0.1.0 linux tarball
#   v0.1.2  windows-x86_64 only -- and that asset was uploaded BY HAND
#           (uploader=zah, 8 days after the tag); CI published nothing at all
#   v0.1.3  linux-x86_64 only  <- and this one is tagged "Latest"
#
# The cause was structural, not incidental: each matrix leg carried its own
# `softprops/action-gh-release` step, and `fail-fast: false` let the green legs
# publish while the red ones simply did not. A partially-published release is
# strictly worse than no release -- consumers on the missing platforms get a
# confident-looking "Latest" whose asset 404s.
#
# So, now:
#
#   plan     -- reads .github/release-platforms.json, the ONE declaration of
#               which platforms a release contains, and derives both the build
#               matrix and the exact asset list the release must carry.
#   build    -- per-platform build/package/verify. Publishes NOTHING. Emits a
#               workflow artifact and a checksum.
#   publish  -- runs only for tags, gated on EVERY leg succeeding, asserts the
#               full asset set is present, then creates the release as a DRAFT,
#               uploads everything, re-verifies against the API, and only then
#               flips it visible.
#
# Two independent guarantees, because a gate alone is not enough:
#   1. No leg can publish on its own -- only `publish` touches the release.
#   2. Even `publish` cannot half-finish visibly -- the release stays a draft
#      until every expected asset is confirmed present on it. A dropped upload
#      or a mid-flight network failure leaves an invisible draft, not a broken
#      "Latest".
#
# Note on `workflow_dispatch`: it is a dry run ONLY when dispatched against a
# branch. `publish` is gated on `startsWith(github.ref, 'refs/tags/')`, and a
# dispatch can be aimed at a tag ref -- in which case github.ref IS
# `refs/tags/vX.Y.Z` and the publish job runs and publishes for real. Dispatch
# from a branch (the normal case: every dispatch run to date was against `dev`)
# builds and publishes nothing, which is what made the 2026-08-01 dispatch run
# show green macOS and Linux legs yet add nothing to any release.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  plan:
    name: Plan release
    # Release jobs run on the dedicated `eph-linux-x64-release` runner class so a
    # release is not queued behind ordinary CI. The Linux build leg in
    # .github/release-platforms.json names the same class.
    runs-on: eph-linux-x64-release
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      expected-assets: ${{ steps.plan.outputs.expected-assets }}
    steps:
      - uses: actions/checkout@v4

      # `actions/github-script` rather than jq/python: this job runs on a bare
      # runner before any dev-env provisioning, and the GARM Debian/macOS/Windows
      # images cannot be assumed to carry either. A JS action runs wherever the
      # Actions runner itself runs.
      - name: Derive matrix and expected asset set
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const spec = JSON.parse(fs.readFileSync('.github/release-platforms.json', 'utf8'));
            const platforms = spec.platforms;
            if (!Array.isArray(platforms) || platforms.length === 0) {
              core.setFailed('.github/release-platforms.json declares no platforms; a release with no platforms is not a release.');
              return;
            }

            const nimble = fs.readFileSync('reprobuild.nimble', 'utf8');
            const m = nimble.match(/^\s*version\s*=\s*"([^"]+)"/m);
            if (!m) {
              core.setFailed('could not read `version` from reprobuild.nimble');
              return;
            }
            const version = m[1];

            // The tag and the nimble version MUST agree. Asset names embed the
            // nimble version while the download URL embeds the tag, so if they
            // drift the published asset is unreachable at the URL every
            // consumer constructs -- including setup-reprobuild's installer,
            // which derives the asset name from the tag. Catch it here, before
            // spending an hour of build time on an unusable release.
            const ref = context.ref || '';
            if (ref.startsWith('refs/tags/')) {
              const tag = ref.slice('refs/tags/'.length);
              if (tag !== `v${version}`) {
                core.setFailed(
                  `tag ${tag} does not match reprobuild.nimble version ${version} (expected tag v${version}). ` +
                  `Asset names embed the nimble version and the download path embeds the tag, so these must agree.`);
                return;
              }
            }

            const assets = platforms.map(p =>
              `reprobuild-${version}-${p.platform}-${p.arch}.${p['archive_ext']}`);

            const dupes = assets.filter((a, i) => assets.indexOf(a) !== i);
            if (dupes.length) {
              core.setFailed(`.github/release-platforms.json yields duplicate asset names: ${[...new Set(dupes)].join(', ')}`);
              return;
            }

            core.info(`release ${version} will consist of exactly ${assets.length} archives:`);
            for (const a of assets) core.info(`  - ${a}`);

            core.setOutput('matrix', JSON.stringify(platforms));
            core.setOutput('version', version);
            core.setOutput('expected-assets', assets.join('\n'));

  build-release:
    name: ${{ matrix.os-name }} (${{ matrix.arch }}) Release Build
    needs: plan
    runs-on: ${{ matrix.runner }}
    env:
      # Per-edge lines instead of a repainting bar, on every leg.
      #
      # The default (`bar-line`) redraws one status line in place. A terminal
      # collapses those repaints; a CI log keeps every one of them, and the bar
      # ELIDES the very thing a stuck build needs to name -- it renders the
      # running action's path truncated to terminal width
      # ("C:\actions-runner\_work\re...").
      #
      # Measured on the windows leg of run 33641812258: the log was 55k lines,
      # 50k of them bar repaints, and every single one reported the same
      # "checked=10/20 running=2" with both running actions unnameable. The leg
      # then hit the 240-minute cap. From that log it is impossible to say WHICH
      # two actions were outstanding, or whether they were slow or wedged.
      #
      # `simple-lines` writes "Starting: <command>" and "Finished: <command> in
      # <duration> [SUCCESS|FAILED]", flushed, one line per transition. That
      # names every action in full and times it, which turns "the leg timed out"
      # into "this action took N minutes" or "this action never finished".
      REPROBUILD_PROGRESS: simple-lines
    strategy:
      # fail-fast stays false so ONE broken leg still lets the others report.
      # That is a diagnostics choice only -- it no longer affects what gets
      # published, because publishing is gated on the aggregate result below.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # ── Windows: fail fast, and legibly, if the image has no Git ───────────
      #
      # Git for Windows supplies bash.exe. Without it this workflow dies with
      # `##[error]bash: command not found` inside the FIRST step of
      # setup-dev-env (its `shell: bash` env-flavor check), and actions/checkout
      # above silently degrades to the REST-API tarball, logging "add Git 2.18
      # or higher to the PATH" and leaving no .git behind.
      #
      # This step is an ASSERTION, not a workaround. An earlier version tried to
      # rescue an installed-but-unexported Git by searching the usual install
      # roots and appending them to GITHUB_PATH. That was written before the
      # cause was known; the Windows runner image simply had no Git installed at
      # all, so the rescue path could never have fired. Keeping it would have
      # been worse than useless: it would let a half-provisioned image pass CI
      # and hide the image defect from whoever has to fix it.
      #
      # So we assert instead. A correctly built runner image has Git on the
      # MACHINE PATH (services capture their environment from the machine
      # environment at service start, so a user-scoped PATH never reaches the
      # runner service) and this step is a no-op costing one second. A bad image
      # fails here, named, instead of anonymously five steps later.
      - name: Assert Git for Windows is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $bash = Get-Command bash -ErrorAction SilentlyContinue
          $git = Get-Command git -ErrorAction SilentlyContinue

          if ($bash -and $git) {
            Write-Host "bash: $($bash.Source)"
            Write-Host "git:  $($git.Source)"
            & git --version
            exit 0
          }

          $missing = @()
          if (-not $bash) { $missing += 'bash' }
          if (-not $git) { $missing += 'git' }

          # Built by joining an array rather than with a here-string: a
          # PowerShell here-string terminator must sit flush against the left
          # margin, which would break out of this YAML block scalar.
          throw (@(
            "Missing on this Windows runner: $($missing -join ', ')",
            "",
            "Git for Windows provides both. Without it every 'shell: bash' step in this",
            "workflow -- including the first step of setup-dev-env -- fails with",
            "'bash: command not found', and actions/checkout cannot create a real",
            "repository.",
            "",
            "This is a defect in the Windows runner image, not in this repository, and it",
            "cannot be worked around from a workflow: the runner runs as a service, and a",
            "service's environment is captured from the MACHINE environment when the",
            "service starts.",
            "",
            "Fix it in the image: install Git for Windows and add its 'bin' directory to",
            "the machine PATH before the image is captured."
          ) -join [Environment]::NewLine)

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the setup-dev-env / clone-siblings actions can clone private
      # metacraft-labs repos (codetracer, runquota, etc.).
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # Setup dev environment using the shared composite workflow.
      # Automatically clones all sibling repos defined in .github/sibling-repos.
      - name: Setup dev environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: ${{ matrix.env-flavor }}
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          flake-override-inputs: |
            runquota-src=../runquota
            io-mon-src=../io-mon
            nim-shm-queue-src=../nim-shm-queue
            nim-stackable-hooks-src=../nim-stackable-hooks
            reprobuild-test-adapters-src=../reprobuild-test-adapters

      # Clone status-im/nim-bearssl manually on Windows (since it belongs to a
      # foreign organization and is not resolvable by metacraft-labs clone-siblings).
      - name: Clone nim-bearssl (Windows)
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          if (Test-Path -Path ../nim-bearssl) { Remove-Item -Recurse -Force ../nim-bearssl }
          git clone --depth 1 --recurse-submodules https://github.com/status-im/nim-bearssl.git ../nim-bearssl

      # Enable the repro binary-cache publish for THIS per-platform build so its
      # `repro build` outputs land in the fleet cache (repro-cache.metacraft-labs.com),
      # giving Windows/macOS/ARM machines cache hits when provisioning from source.
      # The composite action writes the signing key/cert to $RUNNER_TEMP and exports
      # the REPRO_BINARY_CACHE_* env vars picked up by the build steps below; it is a
      # no-op when the secrets are empty (fork PRs) and publish failures are non-fatal
      # (see .github/actions/setup-repro-publish). It selects bash vs pwsh by
      # runner.os, so it covers every matrix leg -- including any leg added later to
      # .github/release-platforms.json, which needs no change here.
      - name: Configure repro binary-cache publish
        uses: ./.github/actions/setup-repro-publish
        with:
          publish-key: ${{ secrets.REPRO_PUBLISH_KEY }}
          publish-cert: ${{ secrets.REPRO_PUBLISH_CERT }}

      # Build all release applications and monitor shims using repro.nim/repro.lock.
      # The build inherits REPRO_BINARY_CACHE_* from $GITHUB_ENV (set by the step
      # above) so reprobuild's engine publisher signs and POSTs the outputs.
      # `.#release` (B5) replaced `.#reprobuild.build_apps`. That wrapper ran the
      # whole build inside ONE shell() action, which takes the automatic-monitor
      # policy, so every nim compile and clang link executed as a child under the
      # io-mon shim -- where, on macOS, children die producing no output. (That is
      # precisely how the v0.1.3 macOS leg died: `repro build: action failed:
      # reprobuild.build_apps (exit code 2)` / `unsupported platform for the
      # io-mon shim`.) The `release` collection is per-artifact `nim.c` /
      # `fs.copyFile` edges, which are depfile-policied and unmonitored, and it
      # covers both `build/bin` and the `build/lib` libraries the tarball packages.
      #
      # `just bootstrap` still runs scripts/build_apps.sh directly -- unmonitored,
      # and the only way to get an engine binary in the first place.
      - name: Bootstrap and Build (POSIX)
        if: matrix.os-name != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dev-exec just bootstrap
          dev-exec ./build/bin/repro build --tool-provisioning=path --daemon=off --no-runquota .#release

      - name: Bootstrap and Build (Windows)
        if: matrix.os-name == 'windows'
        # Fail-fast guard. The `.#release` build's interface-extraction phase
        # (a single `nim c` of the full DSL-stdlib closure) has hung for 4+
        # HOURS on Windows -- nim.exe wedged on the large compile, holding a
        # runner slot indefinitely. A healthy Windows leg (app build + extract
        # + package + verify) completes well inside an hour, so cap the step:
        # a wedged extract now fails in bounded time with the runner's timeout
        # annotation instead of blocking the pool for hours. Remove/raise once
        # the Windows interface-extract hang is root-caused and fixed (it is
        # release-only and has no CI coverage today -- see ci.yml).
        # The Windows runner is slow and cache-less (windows-diy recompiles the
        # whole tree from scratch): app build 43-65 min + interface-extract ~13
        # min + the `.#release` build of 20 artifacts ~61 min (the repro app
        # alone is 435k lines of C / 1.9 GiB / 12 min) ≈ 115-140 min. A 120-min
        # cap guillotined the LAST still-compiling artifact (reprobuild.apps.repro)
        # at exactly 120 min -- a killed process with empty stderr, not a real
        # failure. The phases PROGRESS (proven: extract completes in 13 min, the
        # earlier "hang" was that too-tight cap), they are just slow, so give the
        # whole leg room to finish. The interface-extract still has its own tight
        # 40-min inner cap (REPRO_INTERFACE_COMPILE_TIMEOUT_SECONDS) to catch a
        # genuine extract wedge fast, so this outer cap need not be tight.
        timeout-minutes: 240
        env:
          # Cap the interface `nim c` (inside runCommand) above a healthy-but-slow
          # extract (~11 min observed; 40 min gives wide margin) so genuine
          # slowness passes while a true multi-hour wedge is still killed fast
          # with a dumped partial sink. LIST_CMD keeps nim echoing each gcc
          # sub-command so any future wedge names itself. Both are retained as
          # durable guards, not just debug scaffolding.
          REPRO_INTERFACE_COMPILE_TIMEOUT_SECONDS: "2400"
          REPRO_INTERFACE_LIST_CMD: "1"
          # Cap the `.#release` engine's action parallelism on this leg.
          #
          # `repro build` defaults to 8-wide (buildMaxParallelism()). On the
          # ephemeral Linux/macOS runners that fits; on the memory-constrained
          # windows-diy runner it does not. The engine scheduled all eight heavy
          # `nim c` edges at once, and `nim.exe`'s codegen alone peaks at ~1.9 GiB
          # for the repro app (435k lines of C) -- eight such peaks plus their gcc
          # children exhaust the box. The largest edge, `reprobuild.apps.repro`,
          # lost the memory race: its gcc/cc1 died mid-compile, `nim` reported the
          # failure on STDOUT (where nim writes compiler diagnostics), and the edge
          # exited 1. It ran ~60 min under contention before failing, versus the
          # 15 min the SAME compile takes when `just bootstrap` builds it SERIALLY
          # (which is exactly why bootstrap succeeds and `.#release` did not).
          #
          # Two is the balance point: it keeps peak RAM to ~2 concurrent nim
          # codegens (~4 GiB) so nothing OOMs, while still overlapping the long
          # tail of small edges so the leg finishes comfortably inside the 240-min
          # cap. Raise once the windows-diy image carries more RAM headroom.
          REPROBUILD_MAX_PARALLELISM: "2"
        shell: pwsh
        run: |
          # env.ps1 from setup-dev-env is already sourced in GITHUB_ENV/PATH.
          # That is what provisions the pinned conda-forge clingo via
          # windows/ensure-clingo.ps1 and exports REPRO_WINDOWS_CLINGO_DIR,
          # which build_apps.sh stages into build/bin. Before that provisioner
          # existed, clingo.dll was picked up only if the runner happened to
          # carry a hand-provisioned C:\clingo on its machine PATH.

          # Raise nim.exe's OWN stack BEFORE any nim compile. The `.#release`
          # interface-extract compiles the entire DSL-stdlib closure in a single
          # nim.exe whose deep sem/macro recursion overruns nim's linker-default
          # ~1 MB stack, crashing the COMPILER with STATUS_STACK_BUFFER_OVERRUN
          # (0xC0000409 / exit -1073740791) -- confirmed as nim.exe's own exit
          # code. This patches nim.exe's PE SizeOfStackReserve to 128 MB (exactly
          # what `editbin /STACK` writes, but MSVC/editbin is absent on
          # windows-diy: `vswhere.exe not found`). Idempotent; covers both
          # `just bootstrap` and the `.#release` extract below.
          & ./windows/raise-nim-stack.ps1

          # Provision `just`: the reprobuild dev-env summary reports
          # `just = (not on PATH)` on the windows-diy runners (the repo-workspaces
          # framework provisions nim/gcc but not just here), yet both builds below
          # invoke it. Fetch the single static just.exe and put it on PATH. Pinned
          # to the version the windows dev-env docs record.
          if (-not (Get-Command just -ErrorAction SilentlyContinue)) {
            $justVersion = "1.51.0"
            $justRoot = if ($env:WINDOWS_DIY_INSTALL_ROOT) { $env:WINDOWS_DIY_INSTALL_ROOT } else { $env:RUNNER_TEMP }
            $justDir = Join-Path $justRoot "just\$justVersion"
            $justExe = Join-Path $justDir "just.exe"
            if (-not (Test-Path $justExe)) {
              New-Item -ItemType Directory -Force -Path $justDir | Out-Null
              $justZip = Join-Path $env:RUNNER_TEMP "just.zip"
              $justUrl = "https://github.com/casey/just/releases/download/$justVersion/just-$justVersion-x86_64-pc-windows-msvc.zip"
              Write-Host "Provisioning just $justVersion from $justUrl"
              Invoke-WebRequest -Uri $justUrl -OutFile $justZip
              Expand-Archive -Path $justZip -DestinationPath $justDir -Force
            }
            if (-not (Test-Path $justExe)) { throw "failed to provision just.exe" }
            $env:Path = $justDir + [IO.Path]::PathSeparator + $env:Path
            Add-Content -Path $env:GITHUB_PATH -Value $justDir
            Write-Host "just provisioned at $justExe"
          }

          Push-Location ../runquota
          just build
          Pop-Location
          $runquotaRoot = (Resolve-Path ../runquota).Path
          $runquotaBin = Join-Path $runquotaRoot "build\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $runquotaBin
          $env:Path = $runquotaBin + [IO.Path]::PathSeparator + $env:Path

          # `just bootstrap` runs scripts/build_apps.sh to compile the engine and
          # every app entry point. That script stages clingo.dll (fatal if absent
          # -- the dev-env exports REPRO_WINDOWS_CLINGO_DIR) and best-effort stages
          # libzstd/sqlite3/cacert next to the binaries.
          #
          # We deliberately do NOT set REPRO_REQUIRE_WINDOWS_RUNTIME_DLLS=1 for
          # this step. Those runtime-DLL sources are not all present on the PATH
          # the windows-diy runner provisions (no zstd.exe is installed, and the
          # prebuilt Nim does not reliably carry sqlite3_64.dll), so promoting a
          # miss to a hard error would abort bootstrap before the deterministic
          # staging below could supply them. Release self-containment is instead
          # guaranteed by windows/stage-release-dlls.ps1 (explicit, toolchain-
          # source-first with a pinned-download fallback) and independently gated
          # by scripts/verify_release.sh against the packaged archive.
          just bootstrap

          # Put the MSYS coreutils on PATH for the pwsh-side `repro build`.
          # repro's recipe declares `uses: "mkdir"/"cp"/"chmod"/"sh"` (the
          # reprobuild-nix-daemon staging edge shells them) and resolves them from
          # PATH under --tool-provisioning=path. On Windows `mkdir` is a cmd
          # builtin, not an executable -- the coreutils live in Git for Windows'
          # `<git>\usr\bin`. setup-dev-env's env.ps1 puts `<git>\bin` on PATH
          # (bash/sh/git, which is why `sh`/`openssl` already resolve) but NOT
          # `usr\bin`, and build_apps.sh only saw them because it runs under bash.
          # `.#release` runs here in pwsh, so add `usr\bin` -- the whole dir, so
          # every coreutil any edge shells (cp, rm, mv, cat, ...) resolves at
          # once. The path-mode resolver just needs to FIND each declared tool on
          # PATH; it composes each action's own PATH from the resolved dirs.
          $gitExe = (Get-Command git -ErrorAction Stop).Source
          $gitUsrBin = Join-Path (Split-Path -Parent (Split-Path -Parent $gitExe)) "usr\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $gitUsrBin "mkdir.exe"))) {
            throw "coreutils not found at $gitUsrBin (repro path-mode resolution needs mkdir.exe/cp.exe/chmod.exe); is this MinGit rather than full Git for Windows?"
          }
          $env:Path = $gitUsrBin + [IO.Path]::PathSeparator + $env:Path
          Add-Content -Path $env:GITHUB_PATH -Value $gitUsrBin
          Write-Host "coreutils on PATH via $gitUsrBin"

          # Stage every required runtime DLL into build\bin BEFORE running the
          # engine. The orchestrating repro.exe (built by bootstrap) dlopens
          # clingo.dll and sqlite3_64.dll at MODULE INIT and imports
          # libcrypto/libssl through its PE import table, so it will not even
          # start unless those sit beside it -- Win32 LoadLibrary searches the
          # exe's own directory first. This same script runs again after the
          # build (next step) because `.#release` rewrites build\bin.
          & ./windows/stage-release-dlls.ps1

          # Run the `.#release` build from a COPY of the engine at a different
          # path. That build RELINKS the engine image -- the very binary
          # orchestrating the build -- and
          # on Windows a running .exe holds an exclusive lock on its own image
          # file, so the linker cannot open it for output:
          #
          #   ld.exe: cannot open output file ...\build\bin\repro.exe: Permission denied
          #   collect2.exe: error: ld returned 1 exit status
          #   Error: execution of an external program failed: 'gcc.exe @repro_linkerArgs.txt'
          #
          # (POSIX has no such lock: `ld` unlinks the old inode and creates a new
          # file, so a running process keeps executing the old image while the new
          # binary lands -- which is exactly why the Linux/macOS legs relink repro
          # without trouble and only Windows fails here. This is also why the DSL
          # runtime library is already built as `librepro_project_dsl_runtime.new.dll`
          # and swapped: the same self-lock, handled for the .dll but not the .exe.)
          #
          # The copy lives NEXT TO the staged runtime DLLs in build\bin so
          # clingo.dll / sqlite3_64.dll / libcrypto-3-x64.dll / libssl / vcruntime
          # etc. still resolve from the orchestrator's own directory at load time
          # (Win32 LoadLibrary searches the exe's dir first). It is removed in the
          # `finally` so the packaged archive never carries the orchestrator
          # copy.
          #
          # THE COPY IS OF THE ENGINE, `reprobuild.exe`, NOT OF `repro.exe`.
          # `repro.exe` is now the thin daemon client, and it `execv`s
          # build\bin\reprobuild.exe for this build (see
          # libs/repro_core/src/repro_core/cli_images.nim). Copying the client
          # moved the lock rather than removing it: the 0.2.0 dry run failed
          # with `ld.exe: cannot open output file ...\build\bin\reprobuild.exe:
          # Permission denied`. The engine does not decide what it is from its
          # file name, so running it under another one is sound.
          $orchestrator = "build\bin\repro-orchestrator.exe"
          Copy-Item -LiteralPath "build\bin\reprobuild.exe" -Destination $orchestrator -Force
          try {
            & ".\$orchestrator" build --tool-provisioning=path --daemon=off --no-runquota .#release
            if ($LASTEXITCODE -ne 0) {
              throw "repro .#release build failed (exit code $LASTEXITCODE)"
            }
          } finally {
            Remove-Item -LiteralPath $orchestrator -Force -ErrorAction SilentlyContinue
          }

      # Re-stage after `.#release`: that build rewrites build\bin, so the DLLs
      # staged above may not survive into the packaged tree. Idempotent -- it
      # re-copies from the runner toolchain sources (cheap) and skips the pinned
      # downloads when a DLL is already present. This is the state the packaging
      # step zips and scripts/verify_release.sh asserts against.
      - name: Stage Windows runtime DLLs into the release tree
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          & ./windows/stage-release-dlls.ps1

      # Package the artifacts preserving the bin/ and lib/ structures.
      #
      # The archive name is derived here the same way `plan` derives the expected
      # asset list, and the publish job asserts the two sets match exactly -- so a
      # naming drift becomes a hard failure rather than a mystery missing asset.
      - name: Package release assets (POSIX)
        if: matrix.os-name != 'windows'
        shell: bash
        run: |
          dev-exec bash -c '
            set -euo pipefail
            version=$(grep "^version\s*=" reprobuild.nimble | sed -E "s/version\s*=\s*\"([^\"]+)\"/\1/")
            pkg_name="reprobuild-${version}-${{ matrix.platform }}-${{ matrix.arch }}"

            mkdir -p "${pkg_name}/bin" "${pkg_name}/lib"
            cp -a build/bin/* "${pkg_name}/bin/"
            cp -a build/lib/* "${pkg_name}/lib/"

            # Make the tree run OFF nix: raw-copied release binaries carry a
            # nix-store ELF interpreter (linux) / install names (darwin) and do
            # not bundle their runtime libs, so the tarball fails the ubuntu
            # smoke test in verify_release.sh. Relocate + bundle so it is
            # portable. (No apostrophes/backticks in this block: it is inside a
            # single-quoted dev-exec bash -c, where a stray quote truncates it.)
            bash scripts/relocate_release_posix.sh "${pkg_name}"

            tar -czf "${pkg_name}.tar.gz" "${pkg_name}"
            echo "ASSET_PATH=${pkg_name}.tar.gz" >> "$GITHUB_ENV"
            echo "ASSET_NAME=${pkg_name}.tar.gz" >> "$GITHUB_ENV"
          '

      - name: Package release assets (Windows)
        if: matrix.os-name == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content reprobuild.nimble | Select-String -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $pkg_name = "reprobuild-${version}-${{ matrix.platform }}-${{ matrix.arch }}"

          New-Item -ItemType Directory -Force -Path "${pkg_name}\bin"
          New-Item -ItemType Directory -Force -Path "${pkg_name}\lib"
          Copy-Item -Path "build\bin\*" -Destination "${pkg_name}\bin\" -Recurse
          Copy-Item -Path "build\lib\*" -Destination "${pkg_name}\lib\" -Recurse

          Compress-Archive -Path "${pkg_name}" -DestinationPath "${pkg_name}.zip" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_PATH=${pkg_name}.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_NAME=${pkg_name}.zip"

      # Smoke-tests the PACKAGED archive, not the build tree: on Windows it
      # asserts the runtime-DLL manifest and runs the binary with PATH scrubbed
      # to the system directories, so the build host cannot satisfy a dlopen
      # the archive omits.
      #
      # The Linux leg's multi-distro glibc sweep is the ONLY check that the
      # tarball runs off the machine that built it, so we now gate on it:
      # REPRO_VERIFY_REQUIRE_DOCKER=1 turns a missing/unusable Docker into a hard
      # failure instead of a silent skip (the skip is what let non-portable Linux
      # tarballs ship v0.1.0..v0.1.3). `eph-linux-x64` now carries a usable
      # Docker, so the ubuntu:24.04..almalinux:9 sweep runs and proves the
      # relocate step in packaging. The flag is a no-op on macOS/Windows (the
      # sweep is Linux-only).
      - name: Verify release assets
        shell: bash
        env:
          REPRO_VERIFY_REQUIRE_DOCKER: "1"
        run: |
          # macOS runs this under `dev-exec` so the nix dev shell supplies the
          # POSIX userland the script shells out to (find, coreutils, ...). The
          # static nix-darwin runners do NOT carry `find` on the bare step PATH
          # -- unlike the ephemeral image, whose system /usr/bin leaked in -- so
          # a bare `bash scripts/verify_release.sh` dies at the first `find` with
          # `find: command not found` (exit 127) even though the archive built,
          # packaged, and re-signed cleanly. This mirrors the POSIX packaging
          # step above, which already runs under `dev-exec` for the same reason.
          #
          # Linux stays BARE on purpose: its verify runs the multi-distro Docker
          # sweep (REPRO_VERIFY_REQUIRE_DOCKER=1), and the host `docker` CLI is
          # not in the nix dev shell -- routing it through `dev-exec` would turn
          # a green leg red. Windows stays bare too (Git-for-Windows bash already
          # supplies find/grep/etc.; there is no `dev-exec` on windows-diy).
          if [ "${{ matrix.os-name }}" = "macos" ]; then
            dev-exec bash scripts/verify_release.sh "${{ env.ASSET_PATH }}"
          else
            bash scripts/verify_release.sh "${{ env.ASSET_PATH }}"
          fi

      # Checksum at the point of production. The publish job RE-computes this
      # from the downloaded artifact and compares, which is what makes the
      # artifact round-trip itself verified rather than assumed.
      - name: Compute checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ env.ASSET_NAME }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi
          cat "${asset}.sha256"

      # Publish NOTHING to the release from here. The artifact is the only
      # output of a build leg; a leg that uploads directly to the release is
      # exactly the bug this workflow was restructured to remove.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ env.ASSET_NAME }}
            ${{ env.ASSET_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish release (all-or-nothing)
    needs: [plan, build-release]
    # A job-level `permissions:` block REPLACES the workflow-level one rather
    # than merging with it, so `contents: write` is restated here -- without it
    # this job could not create or update the release at all.
    #
    # `id-token: write` is what lets a step in this job ask GitHub for an OIDC
    # token ($ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN), which is the ONLY way
    # cosign keyless can derive a signer identity on a runner. It is granted
    # ahead of the rest of that work because it is the one half of the boundary
    # that cannot be arranged from the infra repo, and it is INERT until
    # something actually requests a token: nothing here passes `--cosign` yet,
    # and `rs_cosign_sign_blob` refuses (exit 2, SKIPPED, no .sigstore) rather
    # than fabricating anything.
    #
    # Installing cosign and passing `--cosign` land as their own reviewed
    # change, deliberately NOT bundled with the first release that has a real
    # signing key -- and the first bundle it produces is unverified until
    # someone runs `cosign verify-blob --certificate-identity
    # --certificate-oidc-issuer` against Rekor. See
    # docs/release-signing.md and metacraft-labs/infra
    # docs/runbooks/secret-rotation/reprobuild-release-signing-key.md (Section 8).
    permissions:
      contents: write
      id-token: write
    # Same dedicated release runner class as `plan` (see there).
    runs-on: eph-linux-x64-release
    # `always()` so a failed matrix reaches the explicit assertion below and
    # reports a RED publish job. Plain `needs:` semantics would SKIP this job,
    # which renders green-ish in the UI -- the same quiet non-event that let
    # partial releases look normal for four releases running.
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Assert every platform built
        if: needs.build-release.result != 'success' || needs.plan.result != 'success'
        run: |
          echo "::error::Refusing to publish. plan=${{ needs.plan.result }} build=${{ needs.build-release.result }}"
          echo "::error::A release publishes every platform in .github/release-platforms.json or it publishes nothing."
          echo "::error::Fix the failing leg and re-run, or -- as a reviewed, deliberate decision -- remove that"
          echo "::error::platform from .github/release-platforms.json to narrow what this release promises."
          exit 1

      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: staging
          merge-multiple: true

      # Belt-and-braces over the job gate: a green leg whose upload silently
      # produced nothing would otherwise still yield a short release. This
      # compares what actually landed against `plan`'s derived list, in BOTH
      # directions, and re-verifies each checksum after the artifact round trip.
      - name: Assert the complete, expected asset set is present
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.expected-assets }}
        run: |
          set -euo pipefail
          cd staging

          echo "=== staged files ==="
          ls -la

          missing=()
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            if [ ! -f "${asset}" ]; then
              missing+=("${asset}")
              continue
            fi
            if [ ! -f "${asset}.sha256" ]; then
              missing+=("${asset}.sha256")
              continue
            fi
            # Re-derive the digest here and compare with the one the build leg
            # produced, so artifact upload/download corruption cannot pass.
            expected_sum="$(awk '{print $1}' "${asset}.sha256")"
            actual_sum="$(sha256sum "${asset}" | awk '{print $1}')"
            if [ "${expected_sum}" != "${actual_sum}" ]; then
              echo "::error::${asset} changed in transit: build leg recorded ${expected_sum}, staged copy is ${actual_sum}"
              exit 1
            fi
            echo "ok  ${asset}  ${actual_sum}"
          done <<< "${EXPECTED}"

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release is incomplete; refusing to publish. Missing: ${missing[*]}"
            exit 1
          fi

          # And the other direction: nothing unexpected rides along.
          for f in *; do
            case "${f}" in
              *.sha256) continue ;;
            esac
            if ! grep -Fxq "${f}" <<< "${EXPECTED}"; then
              echo "::error::Unexpected asset '${f}' staged for release; it is not in .github/release-platforms.json"
              exit 1
            fi
          done

          echo "All $(grep -c . <<< "${EXPECTED}") expected archives present and verified."

      # One combined manifest is what `setup-reprobuild` verifies downloads
      # against. Before this, releases published no checksums at all, so the
      # only integrity guarantee a consumer had was TLS to github.com.
      - name: Build SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          rm -f SHA256SUMS
          # Sorted for a stable, diffable manifest.
          for f in $(ls *.sha256 | sort); do
            cat "${f}"
          done > SHA256SUMS
          rm -f -- *.sha256
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      # ── Sign the release ──────────────────────────────────────────────────
      #
      # SHA256SUMS above is SAME-ORIGIN integrity: it proves the bytes on
      # this release page match a list on the same release page, which an
      # attacker who can replace one can replace both. Signing is what makes
      # it trust. See docs/release-signing.md.
      #
      # This step is a NO-OP UNTIL A RELEASE KEY EXISTS, and says so out
      # loud, because scripts/release-signing/trusted-release-keys.txt is
      # empty by design: M2 built the machinery, the governance secret
      # pipeline mints the key. Until then a release still publishes, with
      # exactly the same-origin integrity it had before -- what it must never
      # do is publish something that LOOKS signed.
      #
      # When the key exists, the secret holds an ASCII-armoured private key
      # and the fingerprint must also be committed to trusted-release-keys.txt
      # in a reviewed change; the signer refuses an unlisted key rather than
      # falling back, so forgetting the second half fails the release rather
      # than silently signing with something nobody blessed.
      - name: Sign SHA256SUMS and artifacts
        shell: bash
        env:
          REPRO_RELEASE_SIGNING_KEY: ${{ secrets.REPRO_RELEASE_SIGNING_KEY }}
          REPRO_RELEASE_SIGNING_KEY_ID: ${{ secrets.REPRO_RELEASE_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${REPRO_RELEASE_SIGNING_KEY:-}" ]; then
            echo "::warning::No REPRO_RELEASE_SIGNING_KEY secret is configured."
            echo "::warning::This release carries SHA256SUMS (same-origin integrity) but NO signature."
            echo "::warning::See docs/release-signing.md -- the key is a governance deliverable, not a code one."
            exit 0
          fi
          if [ -z "${REPRO_RELEASE_SIGNING_KEY_ID:-}" ]; then
            echo "::error::REPRO_RELEASE_SIGNING_KEY is set but REPRO_RELEASE_SIGNING_KEY_ID is not."
            echo "::error::Refusing to guess which key in the imported material should sign."
            exit 1
          fi
          # The key material lives in a file only for the lifetime of this
          # step, in a directory the signer shreds. `repro-sign-release.sh`
          # imports it into an ephemeral GNUPGHOME and never touches
          # ~/.gnupg. Nothing is echoed: `set -x` is deliberately absent.
          keydir="$(mktemp -d)"
          trap 'rm -rf "${keydir}"' EXIT
          printf '%s' "${REPRO_RELEASE_SIGNING_KEY}" > "${keydir}/key.asc"
          # The exported PUBLIC key goes to the runner's temp directory and
          # NOT into staging/, because staging/ is what gets uploaded to the
          # release page. docs/release-signing.md step 4 is explicit that the
          # public key must be published somewhere that is not the release
          # page: verifying a release against a key fetched from that same
          # release is circular, and shipping the key beside the artifacts
          # invites exactly that. The next step still needs it, so it lives
          # somewhere both steps can reach and no consumer can.
          pubkey="${RUNNER_TEMP:-/tmp}/reprobuild-release-key.asc"
          # Invoked through `sh` rather than as ./script so the run does
          # not depend on the executable bit surviving checkout.
          sh ./scripts/release-signing/repro-sign-release.sh \
            --dir staging \
            --key "${REPRO_RELEASE_SIGNING_KEY_ID}" \
            --secret-key-file "${keydir}/key.asc" \
            --export-key "${pubkey}"
          rm -f "${keydir}/key.asc"
          echo "=== signed release contents ==="
          ls -la staging

      # A signature nobody checks is decoration. Verify what we just
      # produced with the SAME script the installer runs.
      #
      # This is a WELL-FORMEDNESS check, not a trust check, and the
      # difference matters: the key it verifies against is the one this job
      # just exported, so it cannot tell you the right key signed. What it
      # does tell you is that the manifest, the per-artifact signatures and
      # the bytes all agree under the installer's own code path -- so a
      # release can never ship a signature the installer would reject. The
      # trust check happens on the user's machine, against a key they got
      # from somewhere other than this release.
      - name: Verify the signed release exactly as the installer will
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f staging/SHA256SUMS.asc ]; then
            echo "::warning::Release is unsigned (no key configured); nothing to verify."
            exit 0
          fi
          pubkey="${RUNNER_TEMP:-/tmp}/reprobuild-release-key.asc"
          if [ ! -s "${pubkey}" ]; then
            # A signed staging dir with no exported key means the previous
            # step did not run the way it thinks it did. Fail rather than
            # skip: "there was nothing to verify against" is the one excuse
            # this milestone does not accept.
            echo "::error::staging/SHA256SUMS.asc exists but ${pubkey} does not; refusing to skip verification."
            exit 1
          fi
          sh ./scripts/release-signing/repro-verify-release.sh \
            --keyring "${pubkey}" \
            --dir staging \
            --require-all

      # ── Force any pre-existing release for this tag back to draft ──────────
      #
      # `softprops/action-gh-release@v2` does NOT honour `draft: true` for a
      # release that already exists. Its update path passes
      # `draft: existingRelease.draft` (src/github.ts), i.e. it preserves
      # whatever the release already was and ignores the input. So on a re-run
      # of an already-PUBLISHED tag the next step would upload assets straight
      # onto the live, consumer-visible release, one at a time -- precisely the
      # "visible but incomplete" state this workflow exists to make impossible.
      # A failure midway would then leave a broken public release while the
      # verify step below reported "leaving it as a DRAFT", which would be
      # false.
      #
      # So we draft it ourselves first, and only then upload. A release being
      # rebuilt is momentarily hidden rather than momentarily inconsistent.
      - name: Force existing release for this tag back to draft
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const existing = releases.filter(r => r.tag_name === tag);
            if (!existing.length) {
              core.info(`no existing release for ${tag}; it will be created as a draft.`);
              return;
            }
            for (const r of existing) {
              if (r.draft) {
                core.info(`release ${tag} (id=${r.id}) is already a draft.`);
                continue;
              }
              core.warning(
                `release ${tag} (id=${r.id}) is currently PUBLISHED. Hiding it as a draft for the ` +
                `duration of this run so consumers cannot observe a partially re-uploaded release. ` +
                `It is republished at the end only if every expected asset is confirmed present.`);
              await github.rest.repos.updateRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: r.id, draft: true,
              });
            }

      # Create/refresh the release as a DRAFT holding every asset. A draft is
      # invisible to consumers and is never "Latest", so even a partial or
      # interrupted upload cannot be seen by anyone.
      - name: Upload assets to a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Confirm against the API that the draft really carries everything, then
      # -- and only then -- make it visible. This is the step that converts
      # "we uploaded" into "the published release is complete".
      - name: Verify the draft, then publish it
        uses: actions/github-script@v7
        env:
          EXPECTED: ${{ needs.plan.outputs.expected-assets }}
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Read through `env`, not an Actions expression interpolation
            // inside the script body: an expression is pasted in textually,
            // so an asset name containing a backtick or a JS `${` would break
            // out of the template literal it was being pasted into.
            //
            // Editing this block: `script` is an Actions *input*, so its whole
            // body -- comments included -- is scanned for expression syntax
            // before any JavaScript runs. Writing the literal two-brace
            // interpolation sequence here, even inside a `//` comment, is a
            // workflow LOAD error ("An expression was expected") that fails
            // the run before a single job is created, on every push, for every
            // event -- including ones this workflow does not subscribe to.
            // Describe the syntax in words; never spell it out.
            const expected = new Set(
              (process.env.EXPECTED || '').split('\n').map(s => s.trim()).filter(Boolean)
            );
            expected.add('SHA256SUMS');

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const matching = releases.filter(r => r.tag_name === tag);
            if (matching.length === 0) {
              core.setFailed(`no release found for tag ${tag}`);
              return;
            }
            if (matching.length > 1) {
              // Picking "the first one" here would be picking at random which
              // release becomes visible.
              core.setFailed(
                `${matching.length} releases share tag ${tag} (ids: ${matching.map(r => r.id).join(', ')}). ` +
                `Refusing to guess which one to publish -- delete the stale ones and re-run.`);
              return;
            }
            const release = matching[0];
            if (!release.draft) {
              // Everything above is built on "nothing is visible until the
              // asset set is confirmed". If the release is already live at
              // this point that invariant is broken and the reassuring
              // "leaving it as a DRAFT" messages below would be lies.
              core.setFailed(
                `release ${tag} (id=${release.id}) is already PUBLISHED before verification. ` +
                `Refusing to proceed: consumers may already have seen an incomplete release.`);
              return;
            }

            // Signing (see "Sign the release") drops a detached signature
            // beside SHA256SUMS and beside every archive. Those are ALLOWED
            // to be present but are never REQUIRED here: until the governance
            // pipeline mints a release key the signing step is a documented
            // no-op and none of them exist, so requiring them would fail every
            // release today. Their completeness is not this step's job --
            // "Verify the signed release exactly as the installer will" runs
            // the installer's own verifier with --require-all, which fails the
            // job if any manifest entry lacks a signature that verifies.
            //
            // Without this, the FIRST signed release would upload correctly
            // and then be refused here as "unexpected asset(s)", leaving a
            // permanent draft on the day the key arrives.
            const allowed = new Set([...expected].map(a => `${a}.asc`));

            const present = new Set(release.assets.map(a => a.name));
            const missing = [...expected].filter(a => !present.has(a));
            const extra = [...present].filter(a => !expected.has(a) && !allowed.has(a));

            core.info(`release ${tag} (id=${release.id}, draft=${release.draft}) carries: ${[...present].sort().join(', ') || '(nothing)'}`);

            if (missing.length) {
              core.setFailed(
                `Draft release ${tag} is missing ${missing.join(', ')}. Leaving it as a DRAFT so no consumer ` +
                `can see a partial release. Delete the draft, fix the cause, and re-run.`);
              return;
            }
            if (extra.length) {
              // A stale asset from an earlier attempt at the same tag would
              // ship alongside the intended set; that is a different release
              // than the one this run built.
              core.setFailed(
                `Draft release ${tag} carries unexpected asset(s): ${extra.join(', ')}. ` +
                `Leaving it as a DRAFT. Delete the stale assets (or the draft) and re-run.`);
              return;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: release.id, draft: false,
            });
            core.info(`Published ${tag} with all ${expected.size} assets.`);

      # ── M3: generate and upload the native repository metadata ─────────────
      #
      # This runs AFTER the release is published, on purpose. The repository
      # metadata points at artifacts by URL; publishing an index that
      # references assets nobody can fetch yet would make `apt update`
      # succeed and `apt install` fail, which is the worse of the two
      # orderings. A repository a few seconds behind a release is fine; one
      # that is ahead of it is broken.
      #
      # The upload destination is a VARIABLE -- `--target` -- and that is
      # what lets this step exist while the hosting does not. Generating
      # signed metadata is entirely local and is covered by the M3 gate arms
      # against a local HTTP server; pushing it to R2 needs credentials and a
      # bucket that live outside this repository, and reprobuild.com's DNS
      # delegation was still in flight when this was written. The same code
      # path serves both and the only difference is the scheme in --target.
      #
      # It SKIPS rather than fails when either half of what it needs is
      # absent, and says which half:
      #
      #   * no release signing key -> there is nothing to sign the indices
      #     with, and an unsigned repository is worse than no repository:
      #     apt/dnf/pacman either refuse it, or -- if a user turned the check
      #     off to get past that -- accept anything. Skipping keeps the
      #     "never publish something that only LOOKS signed" rule that
      #     docs/release-signing.md sets for the artifacts.
      #   * no REPRO_PUBLISH_TARGET -> no bucket exists to publish to.
      #
      # Both are `::warning::` rather than `::error::` for the same reason
      # the signing step is: the release itself is complete and correct
      # without them, and failing every release until external
      # infrastructure lands would mean no releases at all.
      - name: Generate and upload native repository metadata (apt/dnf/pacman/scoop)
        if: success()
        shell: bash
        env:
          REPRO_PUBLISH_TARGET: ${{ vars.REPRO_PUBLISH_TARGET }}
          # ONE --target CANNOT ADDRESS FIVE BUCKETS.
          #
          # infra's terraform/cloudflare/reprobuild-prod provisions five R2
          # buckets -- reprobuild-{deb,rpm,arch,downloads,keys}-prod -- each
          # bound by an R2 custom domain to one hostname and therefore served
          # at the ROOT of it. `deb.reprobuild.com/dists/stable/InRelease`
          # needs a bucket whose key `dists/stable/InRelease` is at its root,
          # so a single destination with six prefixes under it addresses none
          # of them. These are the five values `tofu output r2_buckets` emits.
          #
          # Each is independently optional: unset, the surface falls back to
          # deriving a prefix under $REPRO_PUBLISH_TARGET, which is what the
          # M3 gate uses and what this step did before.
          REPRO_PUBLISH_TARGET_DEB: ${{ vars.REPRO_PUBLISH_TARGET_DEB }}
          REPRO_PUBLISH_TARGET_RPM: ${{ vars.REPRO_PUBLISH_TARGET_RPM }}
          REPRO_PUBLISH_TARGET_ARCH: ${{ vars.REPRO_PUBLISH_TARGET_ARCH }}
          REPRO_PUBLISH_TARGET_DOWNLOADS: ${{ vars.REPRO_PUBLISH_TARGET_DOWNLOADS }}
          REPRO_PUBLISH_TARGET_KEYS: ${{ vars.REPRO_PUBLISH_TARGET_KEYS }}
          # The two git-backed surfaces. A Scoop bucket and a Homebrew tap are
          # git REPOSITORIES that clients clone; R2 serves objects and cannot
          # serve git, which is why terraform provisions no bucket for either
          # and why the publisher refuses an object-store target for them.
          # metacraft-labs/scoop-reprobuild and
          # metacraft-labs/homebrew-reprobuild DO NOT EXIST YET; until they
          # do, leave these unset and the publisher stages the manifests and
          # says so -- see the prerequisite warning at the end of this step.
          REPRO_PUBLISH_TARGET_SCOOP: ${{ vars.REPRO_PUBLISH_TARGET_SCOOP }}
          REPRO_PUBLISH_TARGET_HOMEBREW: ${{ vars.REPRO_PUBLISH_TARGET_HOMEBREW }}
          REPRO_RELEASE_SIGNING_KEY: ${{ secrets.REPRO_RELEASE_SIGNING_KEY }}
          REPRO_RELEASE_SIGNING_KEY_ID: ${{ secrets.REPRO_RELEASE_SIGNING_KEY_ID }}
          # rclone reads its remote from the environment, so no config file
          # is written and no credential touches the disk. The remote name
          # `r2` matches repro-publish-repos.sh's $REPRO_RCLONE_REMOTE default.
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.REPRO_R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.REPRO_R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.REPRO_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          version=$(grep "^version\s*=" reprobuild.nimble | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "release version: ${version}"

          if [ -z "${REPRO_PUBLISH_TARGET:-}" ]; then
            echo "::warning::REPRO_PUBLISH_TARGET is not set, so there is no repository to publish to. Skipping repo metadata. Once the metacraft-labs/infra root terraform/cloudflare/reprobuild-prod has been applied, set the five per-surface variables from its r2_buckets output -- REPRO_PUBLISH_TARGET_DEB=r2:reprobuild-deb-prod and the same for RPM, ARCH, DOWNLOADS and KEYS -- plus REPRO_PUBLISH_TARGET=none to satisfy this check. A single REPRO_PUBLISH_TARGET writes prefixes under one destination and cannot address five buckets each served at the root of its own hostname."
            exit 0
          fi
          if [ -z "${REPRO_RELEASE_SIGNING_KEY:-}" ] || [ -z "${REPRO_RELEASE_SIGNING_KEY_ID:-}" ]; then
            echo "::warning::No release signing key is configured, so repository indices cannot be signed. Skipping repo metadata rather than publishing an UNSIGNED repository. See docs/release-signing.md."
            exit 0
          fi

          # Ephemeral GNUPGHOME, shredded in this step. Never ~/.gnupg: the
          # publish scripts refuse to run without GNUPGHOME set precisely so
          # a signature can never come from whatever key a runner happened to
          # already trust.
          export GNUPGHOME="${RUNNER_TEMP}/gnupg-publish"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          cleanup() {
            gpgconf --kill all >/dev/null 2>&1 || true
            find "${GNUPGHOME}" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${GNUPGHOME}"
          }
          trap cleanup EXIT

          printf '%s' "${REPRO_RELEASE_SIGNING_KEY}" | gpg --batch --quiet --import
          keyid="${REPRO_RELEASE_SIGNING_KEY_ID}"

          # Build the native packages from the SAME archives that were just
          # published, so the .deb/.rpm/.pkg and the tarball carry identical
          # bytes. Rebuilding from source here would produce packages that
          # nothing has verified.
          mkdir -p pkgs
          linux_tarball="staging/reprobuild-${version}-linux-x86_64.tar.gz"
          if [ -f "${linux_tarball}" ]; then
            sh ./scripts/release/repro-build-packages.sh \
              --version "${version}" --tarball "${linux_tarball}" \
              --out pkgs --ecosystem all --platform linux --asset-arch x86_64
          else
            echo "::warning::${linux_tarball} is absent; no Linux packages will be built."
          fi
          # The Windows archive is NOT repackaged: the Scoop manifest points
          # at the published .zip itself, which is what Scoop fetches and
          # hashes.
          win_zip="staging/reprobuild-${version}-windows-x86_64.zip"
          if [ -f "${win_zip}" ]; then
            cp "${win_zip}" pkgs/
          fi

          # --scoop-downloads-base IS A ROOT, NOT A RELEASE DIRECTORY.
          #
          # The publisher owns the version segment: it appends `/v<version>/`
          # to this base, because that is what `repro-install.sh --method
          # tarball` fetches and what the `downloads` bucket layout writes.
          # This used to pass the release directory itself -- the base with
          # the tag already appended -- so the generated
          # URL doubled the segment --
          # `.../releases/download/v0.1.3/v0.1.3/<asset>` -- and 404'd. Scoop
          # carried that dead link from the start, and the Homebrew formula
          # inherited the same base and the same dead link. Passing the root
          # is exact for GitHub too: the appended `v<version>` IS the release
          # tag, so the result is the canonical asset URL
          # `https://github.com/<owner>/<repo>/releases/download/v<version>/<asset>`.
          # The publisher now refuses a base that already ends in the version,
          # so this cannot regress silently from either end.
          # --fetch-existing is load-bearing: it pulls the CURRENT published
          # pool down before adding this version. Without it, publishing
          # 0.1.4 would DELETE 0.1.3 from the repository -- `apt upgrade`
          # would work exactly once and every pinned install would break.
          # --archives staging is what finally writes the `downloads` bucket.
          # `repro-install.sh --method tarball` -- the only install path on a
          # distribution none of apt/dnf/pacman covers -- fetches
          # $REPRO_DOWNLOADS_URL/v<version>/{<asset>,SHA256SUMS,SHA256SUMS.asc}
          # and terraform provisions downloads.reprobuild.com for exactly
          # that. Nothing wrote it: the archives went to the GitHub release
          # and stopped there, so that hostname would have resolved, served,
          # and held nothing. staging/ is the exact bytes that were published,
          # not a rebuild of them.
          sh ./scripts/release/repro-publish-repos.sh \
            --version "${version}" \
            --packages pkgs \
            --archives staging \
            --key "${keyid}" \
            --ecosystem all \
            --repo-root "${RUNNER_TEMP}/repo" \
            --target "${REPRO_PUBLISH_TARGET}" \
            --fetch-existing \
            --scoop-downloads-base "https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            --export-keyring "${RUNNER_TEMP}/reprobuild-archive-keyring.gpg" \
            | tee "${RUNNER_TEMP}/publish.out"

          # A surface that published nothing emits one machine-readable line
          # saying so. Turning those into ::warning:: is the point: the gap
          # used to be recorded only in infra's `git_backed_surfaces`
          # terraform output, which renders under `tofu output` -- needing
          # credentials this root will not have until it is applied -- so the
          # one place it was written down was a place nobody doing a release
          # would look.
          #
          # TWO MARKERS, because there are two different facts with two
          # different remedies and two different owners, and a release can
          # carry both at once (every release so far did):
          #
          #   REPRO_PUBLISH_PREREQUISITE  the surface is a git repository and
          #                               that repository does not exist yet.
          #                               Fixed by an org admin, once.
          #   REPRO_PUBLISH_SKIPPED       the surface generated nothing for
          #                               this release's artifact set -- e.g.
          #                               homebrew on a release with no macOS
          #                               archive. Fixed by the release, or
          #                               accepted for this one.
          #
          # Collapsing them would report a release-shape problem as a missing
          # repository, which sends the operator to the wrong remedy.
          while IFS=$'\t' read -r _marker surface detail; do
            case "${_marker}" in
              REPRO_PUBLISH_PREREQUISITE)
                echo "::warning::The ${surface} channel was NOT published: it is a git repository, not an object store, and ${detail} does not exist yet. Somebody with rights in the metacraft-labs organisation has to create it; then set REPRO_PUBLISH_TARGET_$(echo "${surface}" | tr '[:lower:]' '[:upper:]')=git:${detail}. The generated tree is in the job's ${RUNNER_TEMP}/repo/${surface}."
                ;;
              REPRO_PUBLISH_SKIPPED)
                echo "::warning::The ${surface} channel published nothing for ${version}: ${detail}"
                ;;
            esac
          done < "${RUNNER_TEMP}/publish.out"

          echo "::notice::Published repository metadata for ${version}."
          echo "::notice::If the trust anchor changed, scripts/install/repro-install.sh must pin its new SHA-256 (printed above as 'TRUST ANCHOR sha256')."
