name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# The release's TRIGGER. Its jobs, and the account of the release's shape, are
# in release-pipeline.yml; this file only decides which copy of that file runs.
#
#   lane     -- a `v*` tag (pushed, or dispatched on) while the repository
#               variable RELEASE_LANE is `admitted`: release-pipeline.yml at
#               `@agents`. metacraft-labs/infra's `release-lane` runner group
#               admits exactly
#                 metacraft-labs/reprobuild/.github/workflows/release-pipeline.yml@refs/heads/agents
#               so the pipeline's `[self-hosted, linux, x64]` jobs (plan,
#               build-addon-static, publish-nix-cache) may take the lane's
#               reserved runner instead of queueing behind general CI. v0.2.31
#               (run 44909832258) waited 1 h 50 min for `plan` alone.
#   general  -- everything else: release-pipeline.yml at this run's own ref,
#               exactly as release.yml ran before the split. Not admitted.
#
# The two conditions are complements, so exactly one job runs.
# release-pipeline.yml's `plan` repeats the `lane` condition to tell which of
# the two copies its run loaded (both are always in `referenced_workflows`), so
# change the two together; tests/unit/test_release_pipeline_identity.py fails
# until they agree.
#
# WHY THE VARIABLE. Turning the lane on is two steps outside this repository:
# infra's governance apply must add the entry above, and the operator confirms
# it is there. Until then the variable is unset and every release takes
# `general`. Deleting it is the fallback, needs no commit, and is also how to
# release a tag whose pipeline differs from agents' current one (`plan` on the
# lane refuses that; see release-pipeline.yml).
#
# WHY `@agents` AND NOT `@dev`. Releases are tagged from `agents`, which runs
# weeks and thousands of commits ahead of `dev`; `dev`'s copy would build an
# `agents` tree with a pipeline from before half of its release changes, and
# `plan`'s byte-for-byte check would refuse nearly every release. Trust is
# unchanged by the choice: what runs on the runner is the tag's source, and
# tags are pushed by the same writers who push `agents`. Fork pull requests
# can change neither, and release-pipeline.yml's guard skips every job for any
# caller but this file on a tag push or a dispatch.
#
# GitHub resolves every `uses:` below when the run is created, including the
# one whose job is skipped, so `@agents` must already carry
# release-pipeline.yml. It does from this commit on, and tags are cut from
# `agents`.
#
# `secrets: inherit` passes this repository's secrets to the pipeline (same
# repository). `permissions` is the ceiling the pipeline's jobs may narrow
# but never exceed: `contents: write` to publish, `id-token: write` for
# `publish-release`, `actions: read` for `plan`'s pipeline-identity check.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  lane:
    if: vars.RELEASE_LANE == 'admitted' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: metacraft-labs/reprobuild/.github/workflows/release-pipeline.yml@agents
    secrets: inherit

  general:
    if: ${{ !(vars.RELEASE_LANE == 'admitted' && startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: write
      id-token: write
      actions: read
    uses: ./.github/workflows/release-pipeline.yml
    secrets: inherit
