name: Benchmark

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (${{ matrix.platform }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # EXEMPTION (CIP-5): persistent benchmark runner — real perf hardware
          # is required for meaningful numbers; not migrated to ephemeral eph-linux-x64.
          - platform: linux
            runner: '["self-hosted", "Linux", "X64", "benchmark"]'
          - platform: macos
            runner: '["self-hosted", "macos", "arm64"]'  # CIP-5: nix macOS benchmark leg → eph-macos-arm64
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      # Deliberately the first step. It decides whether the two
      # github-action-benchmark steps at the end of this job can run at
      # all, and a broken remote query should cost seconds rather than the
      # half hour of nix builds and benchmarking that follows.
      #
      # Both of those steps read the benchmark history from a `gh-pages`
      # data branch. Upstream reaches it with a bare `git switch
      # gh-pages` and has no fallback that creates the branch (see
      # `writeBenchmarkToGitHubPages` in benchmark-action's src/write.ts),
      # so on a repository that has never published history the action
      # aborts with:
      #   fatal: invalid reference: gh-pages
      # Note that `skip-fetch-gh-pages: true` does not avoid this; it
      # skips the fetch, not the switch.
      #
      # Resolving the branch here, up front, is what lets those steps say
      # plainly whether they ran and why. Previously the PR comparison
      # simply hit the error above and hid it behind
      # `continue-on-error: true`, so every pull request produced an
      # `##[error]` line inside a green check and no comparison comment.
      - name: Detect published benchmark history
        id: bench_history
        env:
          # Neutralise the persistent runner's git configuration and
          # credential helper, as the build steps below do, and rewrite
          # the remote to an authenticated URL so this keeps working if
          # the repository ever stops being public.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ github.token }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          set -uo pipefail
          branch=gh-pages
          remote="https://github.com/${{ github.repository }}.git"

          status=0
          git ls-remote --exit-code --heads "${remote}" "refs/heads/${branch}" \
            >/dev/null 2>&1 || status=$?

          case "${status}" in
            0)
              echo "present=true" >> "${GITHUB_OUTPUT}"
              echo "Benchmark history branch '${branch}' is present."
              ;;
            2)
              # `--exit-code` reports 2 for "the query succeeded and
              # matched no refs". That is the ordinary state of a
              # repository that has not commissioned benchmark history,
              # and it is not an error.
              echo "present=false" >> "${GITHUB_OUTPUT}"
              echo "Benchmark history branch '${branch}' does not exist in ${{ github.repository }}."
              ;;
            *)
              # Anything else means the question was never answered:
              # transport, authentication, DNS. Guessing "no history"
              # here would silently disable benchmark comparison and
              # publishing for as long as the fault lasted, which is the
              # class of bug this step exists to remove. Fail instead.
              echo "::error::Could not determine whether branch '${branch}' exists in ${{ github.repository }}: git ls-remote exited ${status} (expected 0 for present, 2 for absent). This is a failed query, not an absent branch, so the benchmark steps below cannot be resolved either way."
              exit "${status}"
              ;;
          esac

      - name: Checkout Reprobuild
        uses: actions/checkout@v4
        with:
          path: reprobuild
          persist-credentials: false

      # Mint an installation token via the CI Token Provider GitHub
      # App for the private metacraft-labs sibling checkouts below.
      - name: Mint installation token for cross-repo checkouts
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: |
            runquota
            reprobuild-cmake
            codetracer-native-recorder
          permission-contents: read

      - name: Checkout RunQuota
        uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          path: runquota
          token: ${{ steps.ci_token.outputs.token }}
          persist-credentials: false

      - name: Checkout Reprobuild CMake fork
        uses: actions/checkout@v4
        with:
          repository: metacraft-labs/reprobuild-cmake
          ref: reprobuild
          path: reprobuild-cmake
          token: ${{ steps.ci_token.outputs.token }}
          persist-credentials: false

      - name: Setup Nix
        uses: metacraft-labs/devops-modules/.github/setup-nix@dev
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      # `bearssl-src` is a PUBLIC THIRD-PARTY `git+https://` flake input
      # (`status-im/nim-bearssl`, plus its `status-im/BearSSL` submodule). Nix
      # fetches it by exec'ing the `git` BINARY, and passes that subprocess no
      # credential of its own -- not `access-tokens`, not `netrc-file`; neither
      # appears anywhere in `libfetchers/{git,git-utils}.cc`. The two steps below
      # additionally set `GIT_CONFIG_GLOBAL=/dev/null` and
      # `GIT_CONFIG_NOSYSTEM=1`, so that fetch sees no ambient configuration
      # either. It is therefore fully ANONYMOUS, and anonymous github.com traffic
      # is rate-limited PER IP across this whole ephemeral fleet.
      #
      # That is the macOS-lane failure, and its shape is why it read as something
      # else for so long. It surfaces hundreds of lines below its cause as
      # `error: Failed to fetch git repository 'https://github.com/status-im/nim-bearssl'`,
      # while the real line is `fatal: could not read Username for
      # 'https://github.com'`.
      #
      # That line does NOT by itself mean "no credential was sent" -- a tempting
      # reading, and a false one. It means a 401 arrived and git had no
      # credential HELPER to retry with. With `GIT_CONFIG_GLOBAL=/dev/null` and
      # `GIT_CONFIG_NOSYSTEM=1` set, as they are below, a REJECTED preemptive
      # `extraHeader` produces the identical line; only when a helper is
      # reachable does git say `remote: Invalid username or token` instead.
      # (Both measured, including through Nix's own fetcher.)
      #
      # What establishes that this fetch was anonymous is structural, not the
      # message: the only git configuration these steps used to install was a
      # URL-embedded `insteadOf` for `metacraft-labs/codetracer-native-recorder`,
      # which cannot match a `status-im` URL, and the two GIT_CONFIG_* variables
      # above removed everything else. Nothing was in a position to attach a
      # credential.
      #
      # A consequence worth knowing when this next fails: after this change the
      # same line means the OPPOSITE -- pair 1 below now matches, so `could not
      # read Username` on a status-im URL indicates the token was REJECTED, not
      # absent. Check the token, not the quota.
      #
      # It is macOS-only by luck, not by design: the Linux leg
      # runs on a persistent bare-metal host whose fetcher cache is already warm,
      # so it never performs the fetch, while `eph-macos-arm64` is cold every job.
      #
      # A URL-embedded credential CANNOT fix this: git does not send a URL's
      # userinfo preemptively, and a public repo never issues the 401 that would
      # prompt it -- so the `insteadOf` pairs below authenticate the PRIVATE
      # native-recorder and nothing public. An `extraHeader` is sent on every
      # request including the first, so it does.
      #
      # And it works cross-org, which is the part that was assumed impossible:
      # GitHub does not require a credential to be SCOPED to a repository to
      # accept it on a PUBLIC one, only to be VALID. Measured with an
      # installation token covering nothing in `status-im`
      # (metacraft-github-actions run 34273033056, job 102219153977): the
      # third-party fetch under this exact header returns rc=0 and the correct
      # SHA, while a fake token in the same header is rejected outright -- so the
      # header is being read, not ignored, and the fetch leaves the anonymous
      # budget.
      - name: Derive the preemptive credential for the third-party flake input
        id: bearssl_auth
        shell: bash
        env:
          TOK: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          blob="$(printf 'x-access-token:%s' "$TOK" | base64 | tr -d '\n')"
          echo "::add-mask::$blob"
          echo "header=AUTHORIZATION: basic ${blob}" >> "$GITHUB_OUTPUT"
          echo "bearssl-auth: 'https://github.com/status-im/' will be fetched authenticated"

      - name: Build Reprobuild CMake fork
        env:
          # The native-recorder flake input deliberately uses git+https because
          # this private repository does not serve codeload archives. Keep the
          # App token scoped to this step environment and its descendants, and
          # bypass any persistent runner credential helper that would otherwise
          # start device flow.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/metacraft-labs/codetracer-native-recorder.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/metacraft-labs/codetracer-native-recorder
          # Pair 1 is the third-party one; see the long note above the
          # `bearssl_auth` step. Scoped to the OWNER prefix, not the single
          # repository, because git matches `http.<url>.*` by slash-delimited
          # path prefix and `nim-bearssl`'s `status-im/BearSSL` submodule is a
          # second fetch on the same anonymous budget.
          GIT_CONFIG_KEY_1: http.https://github.com/status-im/.extraHeader
          GIT_CONFIG_VALUE_1: ${{ steps.bearssl_auth.outputs.header }}
          NIX_CONFIG: >-
            access-tokens = github.com=${{ github.token }}
            github.com/metacraft-labs/codetracer-native-recorder=${{ steps.ci_token.outputs.token }}
        run: |
          nix develop ./reprobuild --command bash -c '
            set -euo pipefail
            jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
            cd reprobuild-cmake
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target cmake --parallel "${jobs}"
          '

      - name: Run quick benchmark suite
        working-directory: reprobuild
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/metacraft-labs/codetracer-native-recorder.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/metacraft-labs/codetracer-native-recorder
          # Pair 1 is the third-party one; see the long note above the
          # `bearssl_auth` step. Scoped to the OWNER prefix, not the single
          # repository, because git matches `http.<url>.*` by slash-delimited
          # path prefix and `nim-bearssl`'s `status-im/BearSSL` submodule is a
          # second fetch on the same anonymous budget.
          GIT_CONFIG_KEY_1: http.https://github.com/status-im/.extraHeader
          GIT_CONFIG_VALUE_1: ${{ steps.bearssl_auth.outputs.header }}
          NIX_CONFIG: >-
            access-tokens = github.com=${{ github.token }}
            github.com/metacraft-labs/codetracer-native-recorder=${{ steps.ci_token.outputs.token }}
        run: nix develop --command just bench --quick

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.platform }}
          path: reprobuild/bench-results/
          retention-days: 30

      # Gating: no `continue-on-error`. If the comparison runs at all it
      # has to succeed, because a comparison that fails halfway tells us
      # nothing and must not be mistaken for "no regression". The single
      # condition that legitimately stops it — a repository with no
      # published history to compare against — is decided by the first
      # step of this job and announced by the next step, rather than
      # being swallowed here.
      - name: Compare pull request benchmarks
        if: >-
          github.event_name == 'pull_request'
          && steps.bench_history.outputs.present == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: reprobuild/bench-results/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          skip-fetch-gh-pages: true
          comment-always: true
          alert-threshold: '120%'

      - name: Report skipped benchmark comparison
        if: >-
          github.event_name == 'pull_request'
          && steps.bench_history.outputs.present != 'true'
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ### Benchmark comparison skipped

          Comparison against historical results is **optional** and was skipped
          because this repository has no `gh-pages` branch, which is where
          benchmark history is stored. There is nothing to compare this run
          against.

          This is not a failure. The benchmarks themselves ran, and their raw
          results are attached to this run as a `benchmark-results-*` artifact.

          To switch comparison on, commission the history branch once:

          ```sh
          git switch --orphan gh-pages
          git commit --allow-empty -m "Initialise benchmark history"
          git push origin gh-pages
          ```

          The publish step of this workflow then records a data point per push
          to `dev`, and this comparison becomes active and gating on every pull
          request.
          SUMMARY
          echo "::notice::Benchmark comparison skipped: no gh-pages branch, so there is no published history to compare against. This is optional and not an error; see the job summary for how to enable it."

      # Retargeted from `refs/heads/main`, which this repository does not
      # have and which this workflow never triggers on (see `on.push`
      # above), so the step could not run under any circumstances and the
      # history it was supposed to write was never written. `dev` is the
      # mainline.
      #
      # Also gated on the history branch existing, because upstream
      # cannot create it (see the first step of this job): without the
      # guard the first push to `dev` would fail here rather than
      # publish. Commissioning the branch is a deliberate, one-time
      # decision, so the next step asks for it out loud instead of this
      # workflow creating a branch as a side effect.
      - name: Publish benchmark history
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/dev'
          && steps.bench_history.outputs.present == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: reprobuild/bench-results/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: perf/bench/${{ matrix.platform }}
          alert-threshold: '120%'

      - name: Report unpublished benchmark history
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/dev'
          && steps.bench_history.outputs.present != 'true'
        run: |
          set -euo pipefail
          cat >> "${GITHUB_STEP_SUMMARY}" <<'SUMMARY'
          ### Benchmark history not published

          Publishing is **inactive** because this repository has no `gh-pages`
          branch. It is not disabled in this workflow and it did not fail: the
          branch simply does not exist yet, and
          `benchmark-action/github-action-benchmark` cannot create it.

          Results for this run are attached as a `benchmark-results-*`
          artifact, with the retention shown on the upload step.

          To start recording history, create the branch once:

          ```sh
          git switch --orphan gh-pages
          git commit --allow-empty -m "Initialise benchmark history"
          git push origin gh-pages
          ```

          From the next push to `dev` this step publishes under `perf/bench/`
          and gates: if publishing fails after that, this job fails.
          SUMMARY
          echo "::notice::Benchmark history not published: no gh-pages branch exists to publish to. See the job summary for the one-time command that activates it."
