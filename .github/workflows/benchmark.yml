name: Benchmark

on:
  push:
    branches: [dev, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (${{ matrix.platform }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # EXEMPTION (CIP-5): persistent benchmark runner — real perf hardware
          # is required for meaningful numbers; not migrated to ephemeral eph-linux-x64.
          - platform: linux
            runner: '["self-hosted", "Linux", "X64", "benchmark"]'
          - platform: macos
            runner: '["eph-macos-arm64"]'  # CIP-5: nix macOS benchmark leg → eph-macos-arm64
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - name: Checkout Reprobuild
        uses: actions/checkout@v4
        with:
          path: reprobuild
          persist-credentials: false

      # Mint an installation token via the CI Token Provider GitHub
      # App for the private metacraft-labs sibling checkouts below.
      - name: Mint installation token for cross-repo checkouts
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          repositories: |
            runquota
            reprobuild-cmake
            codetracer-native-recorder
          permission-contents: read

      - name: Checkout RunQuota
        uses: actions/checkout@v4
        with:
          repository: metacraft-labs/runquota
          path: runquota
          token: ${{ steps.ci_token.outputs.token }}
          persist-credentials: false

      - name: Checkout Reprobuild CMake fork
        uses: actions/checkout@v4
        with:
          repository: metacraft-labs/reprobuild-cmake
          ref: reprobuild
          path: reprobuild-cmake
          token: ${{ steps.ci_token.outputs.token }}
          persist-credentials: false

      - name: Setup Nix
        uses: metacraft-labs/nixos-modules/.github/setup-nix@main
        with:
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}
          substituters: ${{ vars.SUBSTITUTERS }}
          nix-github-token: ${{ secrets.GITHUB_TOKEN }}
      # `bearssl-src` is a PUBLIC THIRD-PARTY `git+https://` flake input
      # (`status-im/nim-bearssl`, plus its `status-im/BearSSL` submodule). Nix
      # fetches it by exec'ing the `git` BINARY, and passes that subprocess no
      # credential of its own -- not `access-tokens`, not `netrc-file`; neither
      # appears anywhere in `libfetchers/{git,git-utils}.cc`. The two steps below
      # additionally set `GIT_CONFIG_GLOBAL=/dev/null` and
      # `GIT_CONFIG_NOSYSTEM=1`, so that fetch sees no ambient configuration
      # either. It is therefore fully ANONYMOUS, and anonymous github.com traffic
      # is rate-limited PER IP across this whole ephemeral fleet.
      #
      # That is the macOS-lane failure, and its shape is why it read as something
      # else for so long. It surfaces hundreds of lines below its cause as
      # `error: Failed to fetch git repository 'https://github.com/status-im/nim-bearssl'`,
      # while the real line is `fatal: could not read Username for
      # 'https://github.com'`.
      #
      # That line does NOT by itself mean "no credential was sent" -- a tempting
      # reading, and a false one. It means a 401 arrived and git had no
      # credential HELPER to retry with. With `GIT_CONFIG_GLOBAL=/dev/null` and
      # `GIT_CONFIG_NOSYSTEM=1` set, as they are below, a REJECTED preemptive
      # `extraHeader` produces the identical line; only when a helper is
      # reachable does git say `remote: Invalid username or token` instead.
      # (Both measured, including through Nix's own fetcher.)
      #
      # What establishes that this fetch was anonymous is structural, not the
      # message: the only git configuration these steps used to install was a
      # URL-embedded `insteadOf` for `metacraft-labs/codetracer-native-recorder`,
      # which cannot match a `status-im` URL, and the two GIT_CONFIG_* variables
      # above removed everything else. Nothing was in a position to attach a
      # credential.
      #
      # A consequence worth knowing when this next fails: after this change the
      # same line means the OPPOSITE -- pair 1 below now matches, so `could not
      # read Username` on a status-im URL indicates the token was REJECTED, not
      # absent. Check the token, not the quota.
      #
      # It is macOS-only by luck, not by design: the Linux leg
      # runs on a persistent bare-metal host whose fetcher cache is already warm,
      # so it never performs the fetch, while `eph-macos-arm64` is cold every job.
      #
      # A URL-embedded credential CANNOT fix this: git does not send a URL's
      # userinfo preemptively, and a public repo never issues the 401 that would
      # prompt it -- so the `insteadOf` pairs below authenticate the PRIVATE
      # native-recorder and nothing public. An `extraHeader` is sent on every
      # request including the first, so it does.
      #
      # And it works cross-org, which is the part that was assumed impossible:
      # GitHub does not require a credential to be SCOPED to a repository to
      # accept it on a PUBLIC one, only to be VALID. Measured with an
      # installation token covering nothing in `status-im`
      # (metacraft-github-actions run 34273033056, job 102219153977): the
      # third-party fetch under this exact header returns rc=0 and the correct
      # SHA, while a fake token in the same header is rejected outright -- so the
      # header is being read, not ignored, and the fetch leaves the anonymous
      # budget.
      - name: Derive the preemptive credential for the third-party flake input
        id: bearssl_auth
        shell: bash
        env:
          TOK: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          blob="$(printf 'x-access-token:%s' "$TOK" | base64 | tr -d '\n')"
          echo "::add-mask::$blob"
          echo "header=AUTHORIZATION: basic ${blob}" >> "$GITHUB_OUTPUT"
          echo "bearssl-auth: 'https://github.com/status-im/' will be fetched authenticated"

      - name: Build Reprobuild CMake fork
        env:
          # The native-recorder flake input deliberately uses git+https because
          # this private repository does not serve codeload archives. Keep the
          # App token scoped to this step environment and its descendants, and
          # bypass any persistent runner credential helper that would otherwise
          # start device flow.
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/metacraft-labs/codetracer-native-recorder.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/metacraft-labs/codetracer-native-recorder
          # Pair 1 is the third-party one; see the long note above the
          # `bearssl_auth` step. Scoped to the OWNER prefix, not the single
          # repository, because git matches `http.<url>.*` by slash-delimited
          # path prefix and `nim-bearssl`'s `status-im/BearSSL` submodule is a
          # second fetch on the same anonymous budget.
          GIT_CONFIG_KEY_1: http.https://github.com/status-im/.extraHeader
          GIT_CONFIG_VALUE_1: ${{ steps.bearssl_auth.outputs.header }}
          NIX_CONFIG: >-
            access-tokens = github.com=${{ github.token }}
            github.com/metacraft-labs/codetracer-native-recorder=${{ steps.ci_token.outputs.token }}
        run: |
          nix develop ./reprobuild --command bash -c '
            set -euo pipefail
            jobs="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
            cd reprobuild-cmake
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build --target cmake --parallel "${jobs}"
          '

      - name: Run quick benchmark suite
        working-directory: reprobuild
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/metacraft-labs/codetracer-native-recorder.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/metacraft-labs/codetracer-native-recorder
          # Pair 1 is the third-party one; see the long note above the
          # `bearssl_auth` step. Scoped to the OWNER prefix, not the single
          # repository, because git matches `http.<url>.*` by slash-delimited
          # path prefix and `nim-bearssl`'s `status-im/BearSSL` submodule is a
          # second fetch on the same anonymous budget.
          GIT_CONFIG_KEY_1: http.https://github.com/status-im/.extraHeader
          GIT_CONFIG_VALUE_1: ${{ steps.bearssl_auth.outputs.header }}
          NIX_CONFIG: >-
            access-tokens = github.com=${{ github.token }}
            github.com/metacraft-labs/codetracer-native-recorder=${{ steps.ci_token.outputs.token }}
        run: nix develop --command just bench --quick

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.platform }}
          path: reprobuild/bench-results/
          retention-days: 30

      - name: Compare pull request benchmarks
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: reprobuild/bench-results/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          skip-fetch-gh-pages: true
          comment-always: true
          alert-threshold: '120%'

      - name: Publish main benchmark history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: reprobuild/bench-results/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: perf/bench/${{ matrix.platform }}
          alert-threshold: '120%'
