name: Suite case counts

# The one gate that has to reach a verdict on every commit.
#
# WHAT IT CATCHES
#
# `scripts/reprobuild-suite-static-case-counts.tsv` records how many test cases
# each declared test source contains. Adding a `test "…":` without refreshing it
# leaves the baseline disagreeing with the tree, and `just lint` fails from that
# moment on -- for everyone, not for the author, who has already pushed. Whoever
# branches next inherits a red tree and someone else's regeneration.
#
# Since the same script also runs `--check-inventory`, this job additionally
# holds the BUILD-FREE half of
# `benchmarks/reports/reprobuild-suite-m0-inventory.json` -- the entry set and
# everything each entry records that is a pure function of source text -- to
# the tree it describes. That artifact went stale six times while the TSV
# beside it stayed current at every commit, and every one of the six was an
# entry-set change. It is checked HERE, in the seconds-long uncancellable job,
# rather than in the Test job that can actually regenerate it, because the Test
# job builds ~1,450 test binaries first and is routinely consumed before it
# reaches a verdict -- which is precisely how the artifact went stale.
#
# The catalog-derived half is NOT checked here and cannot be: it comes from
# probing each built binary's `--list-json`. A green run of this job is not a
# statement about it.
#
# WHY IT IS ITS OWN WORKFLOW
#
# The check was already an early step of the `lint` job in `ci.yml`, and that
# was not enough. `ci.yml` runs on a small, permanently saturated self-hosted
# pool and supersedes its own older runs, so a rapid series of pushes to `dev`
# cancelled each run before it reached a verdict: over one recent day, twenty of
# twenty-five `dev` runs ended `cancelled` rather than passed or failed --
# including the runs for every commit that moved the baseline. A check that is
# cancelled is not a check.
#
# Removing the cancellation from `ci.yml` is not the answer either: those jobs
# take the better part of an hour, and letting them accumulate starves the
# pull-request checks people are waiting on without producing timely verdicts.
#
# So the cheap gate is separated from the expensive suite. Both checks are
# source scans -- no compiler, no built binaries, no nix, no siblings, together
# roughly two minutes on the full ~1,450-source tree -- which is what makes
# them affordable to run on every commit with no cancellation at all.
#
# RUNNER CLASS (CIP-5 exemption)
#
# `ubuntu-latest`, not the `eph-linux-x64` class the policy assigns to nix jobs.
# This is not a nix job: it needs bash, git and python3 from the standard image
# and nothing else, so `setup-dev-env` would cost minutes to provision a shell
# the check never uses. Running it hosted also keeps it off the pool it exists
# to be independent of -- if it queued behind the same jobs `ci.yml` queues
# behind, separating it would have bought nothing.
#
# The pre-push hook (`flake.nix`'s `suite-case-counts`) covers the same ground
# locally and is the faster feedback, but it cannot be relied on: it is a
# pre-commit hook whose config is regenerated only on dev-shell entry, so a
# contributor whose shell predates the hook pushes with no gate at all and no
# warning that it is missing. This workflow is the layer that does not depend
# on anyone's local state.
#
# RECOVERING A STALE `dev` (job `regenerate-on-dev`)
#
# A gate that only reports leaves `dev` stale until someone volunteers a
# regeneration: five consecutive `dev` commits once carried a stale baseline,
# and every pull request opened meanwhile inherited the red (reprobuild-pm
# issue 2026-10-01; spec Test-Suite-Architecture-Guidelines, "Suite-Artifact
# Staleness", "Mainline recovery"). So when the gate fails on a push to `dev`,
# a second job runs `scripts/regenerate_suite_artifacts.py`, which regenerates
# the two build-free artifacts with the commands the refusal prints -- and
# nothing that records a judgement -- and opens one pull request into `dev`
# with the drift report as its body, or updates the one already open from the
# standing branch `automation/regenerate-suite-artifacts`.
#
# It never pushes to `dev`. A regeneration can record COVERAGE LOST, and the
# script marks the pull request for review when it does, so a human merges
# it. That is also all GITHUB_TOKEN permits: a pull request or push made with
# it triggers no workflows, so the pull request's checks do not start on their
# own -- a maintainer closes and reopens it (or pushes to its branch) to run
# them before merging.
#
# The pull request is closed again, with its branch deleted, once it is moot
# (`scripts/retire_regeneration_pr.sh`): by job `retire-regeneration-on-dev`
# when the gate PASSES on a push to `dev` (fixed another way), and by
# `regenerate-on-dev` itself when the regeneration finds nothing to change.
# Left open, it would be a stale proposal a reviewer might still merge.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches-ignore: [agents]

# No `concurrency` block, deliberately: there is nothing to supersede. The job
# is seconds long, so a backlog cannot form, and every commit gets its own
# answer.

permissions:
  contents: read

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite-case-counts:
    name: Suite case-count baseline
    # EXEMPTION (CIP-5): hosted runner -- pure-python source scan, no nix
    # toolchain, kept off the self-hosted pool by design. See header.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The base revision the refusal attributes drift against, so a run that
      # fails on staleness it INHERITED says so instead of naming files the
      # pusher never touched (see the script header). `pull_request` checks
      # out the merge commit, whose base is the base branch tip; a push's base
      # is the previous tip, all zeros for a new branch. Fetched explicitly
      # because the checkout is shallow; best effort, since the verdict does
      # not depend on it.
      - name: Check the baseline against the tree
        env:
          ATTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${ATTRIBUTION_BASE}" ] && [ -n "${ATTRIBUTION_BASE//0/}" ] &&
             git fetch --no-tags --depth=1 origin "${ATTRIBUTION_BASE}"; then
            export SUITE_CASE_COUNTS_BASE="${ATTRIBUTION_BASE}"
          fi
          bash scripts/check_suite_case_counts.sh

  regenerate-on-dev:
    name: Regeneration pull request for a stale dev
    needs: suite-case-counts
    # Only a stale `dev` itself: on a pull request the remedy is the author's,
    # and the refusal already names it. `failure()` rather than the default
    # `success()`, because this job exists for exactly the gate's red.
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # EXEMPTION (CIP-5): hosted runner -- the same pure-python source scan as
    # the gate, plus git and gh, which the standard image carries. See header.
    runs-on: ubuntu-latest
    # The only write token in this workflow, and only these two scopes: push
    # the standing branch, open or edit its pull request.
    permissions:
      contents: write
      pull-requests: write
    # Serialise stale pushes in quick succession, so the standing branch is
    # rewritten by one run at a time. Serialising does not ORDER the runs by
    # commit -- an older push's job can start after a newer one's -- which is
    # what the `tip` step below is for.
    concurrency:
      group: ${{ github.workflow }}-regenerate-on-dev
      cancel-in-progress: false
    env:
      STANDING_BRANCH: automation/regenerate-suite-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the gate refused, not whatever `dev` has become since.
          ref: ${{ github.sha }}
      # Act only while this commit is still the tip of `dev`. Runs in the
      # shared group are serialised but not ordered by commit, so without this
      # an older push's job could overwrite a newer regeneration, or close the
      # pull request a newer red push just opened. A later push runs its own
      # copy of this workflow, so a skipped commit's decision is not lost.
      - name: Act only for the current tip of dev
        id: tip
        run: |
          # No pipe: the default `bash -e` has no pipefail, and a failed query
          # must fail the step rather than read as "dev moved on".
          listing="$(git ls-remote --exit-code origin refs/heads/dev)"
          tip="${listing%%[[:space:]]*}"
          if [ "${tip}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::dev moved on from ${GITHUB_SHA} to ${tip}; its own run decides."
          fi
      - name: Regenerate the build-free suite artifacts
        id: regenerate
        if: steps.tip.outputs.current == 'true'
        env:
          # For the exit-3 arm, which retires a now-moot standing PR.
          GH_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ github.sha }}
        run: |
          status=0
          python3 scripts/regenerate_suite_artifacts.py \
            "${RUNNER_TEMP}/pr-body.md" \
            --title-file "${RUNNER_TEMP}/pr-title.txt" || status=$?
          # 3: neither artifact was stale, so what made the gate red needs a
          # judgement (enrol a test, fix the shape rule) and there is nothing
          # to propose -- and a standing PR from an earlier run is moot, so it
          # is closed. Stop green; the gate job's red already says why.
          case "${status}" in
            0) echo "changed=true" >> "${GITHUB_OUTPUT}" ;;
            3)
              echo "changed=false" >> "${GITHUB_OUTPUT}"
              bash scripts/retire_regeneration_pr.sh "${DEV_SHA}" \
                "has current suite artifacts; what is red there needs a judgement this pull request does not carry"
              ;;
            *) exit "${status}" ;;
          esac
      - name: Open or update the regeneration pull request
        if: steps.regenerate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ github.sha }}
        run: |
          # The default `bash -e` has no pipefail: without it a failed
          # `gh pr list` below would read as "no pull request open" and fall
          # through to creating a second one.
          set -o pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git switch --force-create "${STANDING_BRANCH}"
          # Exactly the two regenerated paths: whatever else the run left in
          # the checkout stays out of the commit.
          git add -- scripts/reprobuild-suite-static-case-counts.tsv \
            benchmarks/reports/reprobuild-suite-m0-inventory-sources.json
          git commit --file - <<EOF
          chore(suite): regenerate build-free suite artifacts for dev

          The Suite case counts gate refused dev at ${DEV_SHA}: its checked-in
          description of the test suite was stale. This regenerates the static
          case-count baseline and the inventory entry set at that commit, with
          the two commands the refusal prints, and nothing else. The pull
          request body carries the drift report.
          EOF
          # Force: the standing branch is rebuilt from the refused commit on
          # every run, so a later stale push replaces the earlier proposal
          # instead of stacking on it. Only this branch is ever pushed.
          git push --force origin "HEAD:refs/heads/${STANDING_BRANCH}"
          title="$(cat "${RUNNER_TEMP}/pr-title.txt")"
          # Same-repository pull requests only, exactly as
          # retire_regeneration_pr.sh filters: `--head` matches a branch NAME,
          # so a fork's identically named branch would match too, and editing
          # it would overwrite someone else's pull request.
          number="$(gh pr list --head "${STANDING_BRANCH}" --base dev --state open \
            --json number,headRefName,isCrossRepository |
            jq -r --arg branch "${STANDING_BRANCH}" \
              'first(.[] | select(.isCrossRepository == false and .headRefName == $branch) | .number) // empty')"
          if [ -n "${number}" ]; then
            gh pr edit "${number}" --title "${title}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr create --base dev --head "${STANDING_BRANCH}" \
              --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi

  retire-regeneration-on-dev:
    name: Close a moot regeneration pull request
    needs: suite-case-counts
    # `dev` passed the gate, so any open regeneration PR was overtaken by a
    # fix that landed another way. A no-op when none is open.
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # EXEMPTION (CIP-5): hosted runner -- bash, jq and gh from the standard
    # image, nothing else. See header.
    runs-on: ubuntu-latest
    # Close the PR, delete its (standing) branch; nothing else.
    permissions:
      contents: write
      pull-requests: write
    # Shares the regeneration's group: a retirement must not race a run that
    # is recreating the same branch.
    concurrency:
      group: ${{ github.workflow }}-regenerate-on-dev
      cancel-in-progress: false
    env:
      STANDING_BRANCH: automation/regenerate-suite-artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      # Act only while this commit is still the tip of `dev`. Runs in the
      # shared group are serialised but not ordered by commit, so without this
      # an older push's job could overwrite a newer regeneration, or close the
      # pull request a newer red push just opened. A later push runs its own
      # copy of this workflow, so a skipped commit's decision is not lost.
      - name: Act only for the current tip of dev
        id: tip
        run: |
          # No pipe: the default `bash -e` has no pipefail, and a failed query
          # must fail the step rather than read as "dev moved on".
          listing="$(git ls-remote --exit-code origin refs/heads/dev)"
          tip="${listing%%[[:space:]]*}"
          if [ "${tip}" = "${GITHUB_SHA}" ]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "current=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::dev moved on from ${GITHUB_SHA} to ${tip}; its own run decides."
          fi
      - name: Close the standing regeneration pull request, if open
        if: steps.tip.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ github.sha }}
        run: |
          bash scripts/retire_regeneration_pr.sh "${DEV_SHA}" \
            "passes the suite case-count gate, so the regeneration this proposed is no longer needed"
