# The Nim USER configuration (`$XDG_CONFIG_HOME/nim/nim.cfg`) the monitor
# shim's compile reads when it is built for another machine (repro.nim, the
# Linux shim edge under a zig target).
#
# The shim's source is io-mon's, compiled from io-mon's tree, so no project
# configuration of this repository reaches it -- deliberately: reprobuild's
# `config.nims` would also link the hash libraries, which a library preloaded
# into every monitored process must never need. An image an installed prefix
# ships must name no path of the build host (reprobuild-pm
# Distribution-And-Packaging.md §5.3, the builder-path gate), and this is the
# one switch that needs: Nim's file names in messages and stack traces,
# package-relative instead of absolute.
--filenames:canonical
