# ``t_c2_signature`` imports ``repro_harvest_apt/signature`` out of this
# app's own ``src`` tree. ``config.nims`` at the repo root puts every
# ``libs/<lib>/src`` on ``--path`` but no ``apps/<app>/src`` — the app
# itself gets the flag from the third field of ``apps/entrypoints.txt``
# (``--path:apps/repro-harvest-apt/src``), which is a route its tests do not
# take. Carrying it here instead of in the build edge means every route that
# ever compiles this file — the engine's test-build edge, ``nim c -r`` by
# hand, an editor — resolves the import the same way, and ``TestSpec`` needs
# no ``--path`` field it has never needed for anything else.
--path:"$projectDir/../src"
# The Valid-Until test drives ``fetchAndVerifyIndexes`` in the app's entry
# module itself (reached with ``{.all.}``), so the app directory is on the
# path too.
--path:"$projectDir/.."
