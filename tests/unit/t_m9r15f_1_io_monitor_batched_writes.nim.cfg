## Build this test with C optimisation. Its first case compares the batched
## io-mon fragment writer with per-record write+flush. Test edges compile at
## -O0, and at -O0 the batched path's cost is unoptimised Nim code: per-index
## overflow checks and one thread-local lookup per access. On m1 (macOS,
## /usr/bin/clang) that alone held it to ~2.5x, below the 4x floor, with no
## per-record syscall left. The writer ships in the monitor shim, which builds
## with -d:release, so -O0 measures code nobody runs. With --opt:speed the
## same host measures ~17x, and a writer with a per-record fstat restored
## still fails at ~2.1x.
--opt:speed
