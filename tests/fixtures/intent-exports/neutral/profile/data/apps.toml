# GM5 fixture data: package rows reach the export expanded; the resource row
# is built by its constructor and carries its `when` as the guard.
[[package]]
name = "llvm"
activity = "cli"
when = "linux or macos"

[[package]]
name = "gm5-windows-tool"
activity = "default"
when = "windows"

[[resource]]
kind = "env.userVariable"
when = "host == \"m1\""
name = "GM5_M1"
value = "yes"

# GM9: a resource row that belongs to an activity (home-pc selects `cli`).
[[resource]]
kind = "env.userVariable"
activity = "cli"
name = "GM9_CLI"
value = "1"
