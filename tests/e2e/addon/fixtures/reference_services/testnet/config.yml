# The local test network of the reference-service gates (reference_services.nim).
# Prysm's interop config: every fork through Electra at epoch 0 (post-merge
# from genesis), Fulu and Gloas never; two-second slots and six-slot epochs
# so a gate sees epochs justify within a minute. No peers, no discovery.
# genesis.json beside it is geth's genesis: chain 32382, every fork at 0,
# and the four system contracts Prague needs (EIP-2935, EIP-4788, EIP-7002,
# EIP-7251), their code copied from go-ethereum v1.17.10 params/protocol_params.go.
CONFIG_NAME: interop
PRESET_BASE: interop
GENESIS_FORK_VERSION: 0x20000089
ALTAIR_FORK_EPOCH: 0
ALTAIR_FORK_VERSION: 0x20000090
BELLATRIX_FORK_EPOCH: 0
BELLATRIX_FORK_VERSION: 0x20000091
TERMINAL_TOTAL_DIFFICULTY: 0
CAPELLA_FORK_EPOCH: 0
CAPELLA_FORK_VERSION: 0x20000092
DENEB_FORK_EPOCH: 0
DENEB_FORK_VERSION: 0x20000093
ELECTRA_FORK_EPOCH: 0
ELECTRA_FORK_VERSION: 0x20000094
FULU_FORK_EPOCH: 18446744073709551615
FULU_FORK_VERSION: 0x20000095
SECONDS_PER_SLOT: 2
SLOTS_PER_EPOCH: 6
SECONDS_PER_ETH1_BLOCK: 2
MIN_GENESIS_ACTIVE_VALIDATOR_COUNT: 8
MIN_VALIDATOR_WITHDRAWABILITY_DELAY: 1
SHARD_COMMITTEE_PERIOD: 1
ETH1_FOLLOW_DISTANCE: 1
DEPOSIT_CHAIN_ID: 32382
DEPOSIT_NETWORK_ID: 32382
DEPOSIT_CONTRACT_ADDRESS: 0x4242424242424242424242424242424242424242
GLOAS_FORK_EPOCH: 18446744073709551615
GLOAS_FORK_VERSION: 0x20000096
