# CONF-3 profiling drop-in for repro-daemon-worker.service: run the service
# with NO syscall filter and LOG every system call it (and every execution
# lease it starts) makes outside @system-service, and every call it makes
# inside the groups the CONF-1 floor removes. The kernel writes one audit
# record per call (type=1326); scripts/profile_daemon_worker_syscalls.sh turns
# the records into recipes/repro-daemon-worker/syscalls.
#
# Re-run it whenever the worker's code changes what it executes (CONF-3: "keep
# the profiling configuration in the repo so it can be re-run").
[Service]
SystemCallFilter=
SystemCallLog=
SystemCallLog=~@system-service
